<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub V6</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f3f3}.container{max-width:1100px;margin:auto;padding:20px}.header{background:#0b2a73;color:#fff;padding:30px;border-radius:18px;text-align:center;margin-bottom:20px}#student,#search{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:#fff;padding:16px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.15)}.card h3{color:#0b2a73;margin-bottom:10px}.card button{width:100%;padding:10px;margin:5px 0;border:none;border-radius:8px;background:#0b2a73;color:#fff;font-weight:bold;cursor:pointer}.card button:hover{background:#143d9c}</style>
</head><body><div class="container"><div class="header"><h1>📘 MPPSC MCQ Hub V6</h1><p>200 ऑनलाइन टेस्ट | 10 यूनिट | प्रत्येक टेस्ट में 20 प्रश्न</p></div><input id="student" placeholder="अपना नाम लिखें"><input id="search" placeholder="टेस्ट नंबर खोजें (1-200)"><div class="grid" id="units"></div></div><script>const units=document.getElementById('units');for(let u=1;u<=10;u++){let c=document.createElement('div');c.className='card';let h=`<h3>📚 Unit ${u}</h3>`;for(let t=(u-1)*20+1;t<=u*20;t++){h+=`<button onclick="startTest(${t})">टेस्ट ${t}</button>`}c.innerHTML=h;units.appendChild(c)}function startTest(n){localStorage.setItem('student',document.getElementById('student').value);location.href='quiz.html?test='+n}document.getElementById('search').onkeyup=function(){let v=this.value.toLowerCase();document.querySelectorAll('.card button').forEach(b=>b.style.display=b.innerText.toLowerCase().includes(v)?'block':'none')}</script></body></html>
