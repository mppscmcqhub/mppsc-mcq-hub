<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub V6</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:#f3f3f3;
}
.container{
max-width:1100px;
margin:auto;
padding:20px;
}
.header{
background:#0b2a6f;
color:white;
padding:30px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
}
.header h1{font-size:42px;margin-bottom:10px}
.header p{font-size:18px}

#student{
width:100%;
padding:12px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:15px;
}

#search{
width:100%;
padding:12px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:20px;
}

.units{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.card h3{
margin-bottom:12px;
color:#0b2a6f;
}

.card button{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
background:#0b2a6f;
color:white;
font-size:15px;
cursor:pointer;
transition:.3s;
}

.card button:hover{
background:#163b92;
transform:scale(1.02);
}

.footer{
text-align:center;
padding:25px;
color:#555;
font-size:14px;
}
</style>

</head>
<body>

<div class="container">

<div class="header">
<h1>📘 MPPSC MCQ Hub V6</h1>
<p>200 ऑनलाइन टेस्ट | 10 यूनिट | प्रत्येक टेस्ट में 20 प्रश्न</p>
</div>

<input id="student" placeholder="अपना नाम लिखें">

<input id="search" placeholder="🔍 टेस्ट नंबर खोजें (1-200)">

<div class="units" id="units"></div>

<div class="footer">
© MPPSC MCQ Hub
</div>

</div>

<script>

const units=document.getElementById("units");

for(let u=1;u<=10;u++){

let card=document.createElement("div");
card.className="card";

let html=`<h3>📚 Unit ${u}</h3>`;

for(let t=(u-1)*20+1;t<=u*20;t++){

html+=`
<button data-test="${t}" onclick="startTest(${t})">
टेस्ट ${t}
</button>`;
}

card.innerHTML=html;
units.appendChild(card);
}

function startTest(n){

const name=document.getElementById("student").value.trim();

localStorage.setItem("student",name);

location.href="quiz.html?test="+n;

}

/* Search */

document.getElementById("search").addEventListener("keyup",function(){

const value=this.value.trim();

document.querySelectorAll(".card button").forEach(btn=>{

if(value===""){
btn.style.display="block";
}else{

btn.style.display=
btn.dataset.test.includes(value)
?"block":"none";

}

});

});
</script>

</body>
</html>
