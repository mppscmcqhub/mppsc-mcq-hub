<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub V6</title>
<link rel="stylesheet" href="style.css">
<style>
body{
font-family:Arial,sans-serif;
background:#f3f3f3;
margin:0;
}
.container{
max-width:1100px;
margin:auto;
padding:20px;
}
.header{
background:#0b2a6f;
color:white;
padding:25px;
border-radius:15px;
text-align:center;
}
input{
width:100%;
padding:12px;
margin:20px 0;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}
.card{
background:white;
padding:18px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}
.card h3{
margin-top:0;
color:#0b2a6f;
}
button{
width:100%;
padding:10px;
margin:5px 0;
background:#0b2a6f;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
button:hover{
background:#163d96;
}
</style>
</head>
<body>

<div class="container">

<div class="header">
<h1>📘 MPPSC MCQ Hub V6</h1>
<p>200 ऑनलाइन टेस्ट | 10 यूनिट | प्रत्येक टेस्ट में 20 प्रश्न</p>
</div>

<input type="text" id="student" placeholder="अपना नाम लिखें">

<div class="grid" id="units"></div>

</div>

<script>
const units=document.getElementById("units");
const student=document.getElementById("student");

for(let u=1;u<=10;u++){

let card=document.createElement("div");
card.className="card";

let html=`<h3>📚 Unit ${u}</h3>`;

for(let t=(u-1)*20+1;t<=u*20;t++){

html+=`<button onclick="startTest(${t})">
टेस्ट ${t}
</button>`;

}

card.innerHTML=html;
units.appendChild(card);

}

function startTest(n){

localStorage.setItem("student",student.value);

location.href="quiz.html?test="+n;

}
</script>

</body>
</html>
