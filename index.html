</head><body><div class="container"><div class="header"><h1>📘 MPPSC MCQ Hub V6</h1><p>200 ऑनलाइन टेस्ट | 10 यूनिट | प्रत्येक टेस्ट में 20 प्रश्न</p></div><input id="student" placeholder="अपना नाम लिखें"><input id="search" placeholder="टेस्ट नंबर खोजें (1-200)"><div class="grid" id="units"></div></div><script>const units=document.getElementById('units');for(let u=1;u<=10;u++){let c=document.createElement('div');c.className='card';let h=`<h3>📚 Unit ${u}</h3>`;for(let t=(u-1)*20+1;t<=u*20;t++){h+=`<button onclick="startTest(${t})">टेस्ट ${t}</button>`}c.innerHTML=h;units.appendChild(c)}function startTest(n){localStorage.setItem('student',document.getElementById('student').value);location.href='quiz.html?test='+n}document.getElementById('search').onkeyup=function(){let v=this.value.toLowerCase();document.querySelectorAll('.card button').forEach(b=>b.style.display=b.innerText.toLowerCase().includes(v)?'block':'none')}</script></body></html>
