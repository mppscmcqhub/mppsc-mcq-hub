<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub V7</title>

<link rel="stylesheet" href="style.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:Arial,sans-serif;
background:#f4f6fb;
}
.container{
max-width:1200px;
margin:auto;
padding:20px;
}
.header{
background:#0b2a6f;
color:white;
padding:25px;
border-radius:20px;
text-align:center;
margin-bottom:20px;
}
.header h1{
font-size:38px;
margin-bottom:10px;
}
.header p{
font-size:18px;
}

input{
width:100%;
padding:12px;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
margin-bottom:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:15px;
padding:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.card h3{
color:#0b2a6f;
margin-bottom:12px;
}

button{
width:100%;
padding:10px;
margin:5px 0;
background:#0b2a6f;
color:white;
border:none;
border-radius:8px;
font-size:15px;
cursor:pointer;
transition:.3s;
}
button:hover{
background:#1849b8;
transform:scale(1.02);
}

.footer{
margin-top:40px;
text-align:center;
color:#555;
font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>📘 MPPSC MCQ Hub V7</h1>
<p>200 ऑनलाइन टेस्ट | 10 यूनिट | प्रत्येक टेस्ट में 20 प्रश्न</p>
</div>

<input id="student" placeholder="👤 अपना नाम लिखें">

<input id="searchBox" placeholder="🔍 टेस्ट नंबर खोजें (1-200)">

<div class="grid" id="units"></div>

<div class="footer">
MPPSC MCQ Hub © 2026
</div>

</div>

<script>

const units=document.getElementById("units");
const student=document.getElementById("student");
const search=document.getElementById("searchBox");

for(let u=1;u<=10;u++){

let card=document.createElement("div");
card.className="card";

let html=`<h3>📚 Unit ${u}</h3>`;

for(let t=(u-1)*20+1;t<=u*20;t++){

html+=`
<button data-test="${t}" onclick="startTest(${t})">
टेस्ट ${t}
</button>
`;

}

card.innerHTML=html;
units.appendChild(card);

}

function startTest(n){

localStorage.setItem("student",student.value);

location.href="quiz.html?test="+n;

}

search.addEventListener("keyup",function(){

let value=this.value.trim();

document.querySelectorAll(".card button").forEach(btn=>{

let num=btn.dataset.test;

btn.style.display=(value==""||num.includes(value))
?"block":"none";

});

});

</script>

</body>
</html>
