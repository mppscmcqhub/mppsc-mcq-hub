<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Register</title>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<script src='js/supabase.js'></script></head>
<body style="font-family:Arial;padding:30px"><h2>Student Register</h2>
<input id=e placeholder='Email'><br><br><input id=m placeholder='Mobile'><br><br><input id=p type=password placeholder='Password'><br><br>
<button onclick="signup()">Register</button>
<script>
async function signup(){
 const {data,error}=await sb.auth.signUp({email:e.value,password:p.value});
 if(error) return alert(error.message);
 await sb.from('students').insert({id:data.user.id,mobile:m.value});
 alert('Account Created');
 location='student-login.html';
}
</script></body></html>
