<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>MPPSC Test 2</title>
<link rel="stylesheet" href="style.css">

<style id="site-logo-global-css">
.site-brand-bar{width:100%;background:#0d47a1;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:64px;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;position:relative;z-index:1000;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.site-brand-bar img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff;flex:0 0 auto}
.site-brand-bar .site-brand-title{font-size:1.12rem;font-weight:800;line-height:1.2}
@media(max-width:600px){.site-brand-bar{padding:7px 10px;min-height:58px}.site-brand-bar img{width:42px;height:42px}.site-brand-bar .site-brand-title{font-size:.98rem}}
</style>

</head>
<body>
<div class="site-brand-bar"><img src="MPPSC-MCQ-Hub-Logo.png" alt="MPPSC MCQ Hub Logo"><div class="site-brand-title">MPPSC MCQ Hub</div></div>


<div class="box">
<h1>20 प्रश्न टेस्ट – 2</h1>

<div id="quiz"></div>

<button id="submitBtn" onclick="submitQuiz()">टेस्ट जमा करें</button>

<div id="scoreBox"></div>
</div>

<script src="questions2.js"></script>

<script>
const quiz=document.getElementById("quiz");
const letters=["A","B","C","D"];

questions.forEach((q,i)=>{
  let h=`<div class="qbox" id="q${i}">
  <h3>प्रश्न ${i+1}: ${q.q}</h3>`;

  q.o.forEach((o,j)=>{
    h+=`<label class="opt" id="q${i}o${j}">
      <input type="radio" name="q${i}" value="${j}">
      <span><b>${letters[j]}.</b> ${o}</span>
    </label>`;
  });

  h+=`<div class="exp" id="e${i}"></div></div>`;
  quiz.innerHTML+=h;
});

function submitQuiz(){
  let score=0;

  questions.forEach((q,i)=>{
    let sel=document.querySelector(`input[name=q${i}]:checked`);
    let user=sel?+sel.value:-1;

    q.o.forEach((_,j)=>{
      const lab=document.getElementById(`q${i}o${j}`);
      lab.classList.remove("correct","wrong");

      if(j===q.a) lab.classList.add("correct");
      if(j===user && user!==q.a) lab.classList.add("wrong");

      lab.querySelector("input").disabled=true;
    });

    if(user===q.a) score++;

    document.getElementById(`e${i}`).innerHTML=
    `<b>सही उत्तर:</b> ${q.o[q.a]}<br><b>व्याख्या:</b> ${q.e}`;
  });

  document.getElementById("submitBtn").style.display="none";

  document.getElementById("scoreBox").innerHTML=
  `<div class="result">
     <h2>${localStorage.getItem("student")||"Student"}</h2>
     <h1>स्कोर: ${score}/20</h1>
   </div>`;

  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
</script>

</body>
</html>
