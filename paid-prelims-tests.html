<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPPSC Prelims 100 Test Series</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #eef4ff; font-family: 'Segoe UI', sans-serif; color: #333; line-height: 1.5; padding: 20px; }
        
        .lock-container { text-align: center; margin: 100px auto; max-width: 400px; background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #eaeaea; }
        .lock-container h2 { color: #b91c1c; margin-bottom: 15px; font-weight: bold; }
        .lock-container input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; text-align: center; }
        .lock-container button { background-color: #0d47a1; color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        .lock-container button:hover { background-color: #0a3980; }
        .error-msg { color: #dc2626; font-weight: bold; margin-top: 10px; display: none; }

        #protected-content { display: none; max-width: 1200px; margin: 0 auto; }
        .header-section { text-align: center; margin: 20px auto 40px auto; max-width: 800px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #eaeaea; }
        .header-section h1 { color: #b91c1c; font-size: 2rem; font-weight: 900; margin-bottom: 10px; }
        .header-section p { color: #555; font-size: 1.1rem; font-weight: 600; }
        
        .tests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .test-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: space-between; min-height: 180px; transition: transform 0.2s; }
        .test-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
        .test-number { font-size: 1.2rem; font-weight: 800; color: #1e293b; margin-bottom: 5px; }
        .test-info { font-size: 0.85rem; color: #666; margin-bottom: 10px; font-weight: 600; }
        .status-badge { font-size: 0.85rem; padding: 3px 10px; border-radius: 12px; font-weight: bold; display: inline-block; margin-bottom: 12px; }
        .status-live { color: #059669; background: #ecfdf5; }
        .status-soon { color: #7c2d12; background: #fff7ed; }
        
        .btn-action { display: block; width: 100%; padding: 10px 0; border-radius: 6px; font-weight: 600; font-size: 0.95rem; text-decoration: none; text-align: center; margin-top: 10px; }
        .btn-open-test { background-color: #0d47a1; color: white; }
        .btn-open-test:hover { background-color: #0a3980; }
        .btn-disabled { background-color: #e2e8f0; color: #94a3b8; pointer-events: none; border: none; }
        .btn-back { display: inline-block; margin-bottom: 20px; color: #0d47a1; text-decoration: none; font-weight: bold; font-size: 1rem; }
    </style>
</head>
<body>

    <!-- पासवर्ड लॉक स्क्रीन बॉक्स -->
    <div id="lock-screen" class="lock-container">
        <h2>🔒 Paid Course Lock</h2>
        <p style="margin-bottom: 15px; color: #666; font-weight: 600;">आगे बढ़ने के लिए प्रीलिम्स एक्सेस पासवर्ड डालें:</p>
        <input type="password" id="password-input" placeholder="यहाँ पासवर्ड टाइप करें...">
        <button onclick="checkPassword()">पेज अनलॉक करें</button>
        <div id="error" class="error-msg">गलत पासवर्ड! कृपया सही पासवर्ड डालें।</div>
    </div>

    <!-- पासवर्ड के बाद दिखने वाला असली कंटेंट -->
    <div id="protected-content">
        <div><a href="index.html" class="btn-back">← मुख्य पेज पर जाएं</a></div>
        <div class="header-section">
            <h1>MPPSC 2027 - Paid Prelims 100 Tests</h1>
            <p>🎯 किसी भी टेस्ट पर क्लिक करके उसका ऑनलाइन क्विज़ और PDF डाउनलोड पेज खोलें</p>
        </div>
        <div class="tests-grid" id="prelimsTestsGrid"></div>
    </div>

    <script>
        const CORRECT_PASSWORD = "mppsc2027";

        function checkPassword() {
            if (document.getElementById("password-input").value === CORRECT_PASSWORD) {
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("protected-content").style.display = "block";
                renderPaidTests();
            } else {
                document.getElementById("error").style.display = "block";
                document.getElementById("password-input").value = "";
            }
        }

        document.getElementById("password-input").addEventListener("keyup", function(e) {
            if (e.key === "Enter") checkPassword();
        });

        function renderPaidTests() {
            const grid = document.getElementById("prelimsTestsGrid");
            grid.innerHTML = "";
            
            let storedData = {};
            try {
                let local = localStorage.getItem('mppsc_paid_prelims_tests');
                if(local) storedData = JSON.parse(local);
            } catch(e) {}

            const unitNames = {
                1: "भारत का इतिहास", 2: "म.प्र. का इतिहास", 3: "भारत का भूगोल", 
                4: "म.प्र. का भूगोल", 5: "संवैधानिक व्यवस्था", 6: "अर्थव्यवस्था", 
                7: "विज्ञान व पर्यावरण", 8: "करंट अफेयर्स", 9: "ICT", 10: "म.प्र. जनजातियां"
            };

            let html = "";
            let globalTestCounter = 1;

            // 10 यूनिट और हर यूनिट में 10 टेस्ट = कुल 100 टेस्ट
            for (let u = 1; u <= 10; u++) {
                let unitData = storedData[u] || {};
                for (let t = 1; t <= 10; t++) {
                    // सुधार: यदि यह पहला टेस्ट (globalTestCounter === 1) है, तो इसे हमेशा एक्टिव रखें
                    let hasData = (globalTestCounter === 1) || (unitData[t] ? true : false);
                    
                    let targetUrl = `paid-prelims-test-${globalTestCounter}.html`;
                    
                    let badge = hasData ? '<span class="status-badge status-live">● Active Now</span>' : '<span class="status-badge status-soon">⏳ Coming Soon</span>';
                    let actionBtn = hasData ? `<a href="${targetUrl}" class="btn-action btn-open-test">Open Test Page</a>` : `<a href="#" class="btn-action btn-disabled">Locked</a>`;

                    html += `
                        <div class="test-card">
                            <div>
                                <div class="test-number">Mock Test - ${globalTestCounter}</div>
                                <div class="test-info">Unit ${u}: ${unitNames[u]} (Test ${t})</div>
                                ${badge}
                            </div>
                            <div>
                                ${actionBtn}
                            </div>
                        </div>
                    `;
                    globalTestCounter++;
                }
            }
            grid.innerHTML = html;
        }
    </script>
</body>
</html>
