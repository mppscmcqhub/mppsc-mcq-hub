<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MPPSC MCQ Hub - Student Login</title>


<style>

/* =========================================================
   BASIC
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f4f7fc;

    min-height:100vh;
}


/* =========================================================
   SITE LOGO BAR
   ========================================================= */

.mppsc-site-logo-bar{

    width:100%;

    background:#0d47a1;

    color:#fff;

    min-height:64px;

    padding:8px 16px;

    display:flex;

    align-items:center;

    gap:12px;

    box-shadow:
        0 2px 7px rgba(0,0,0,.12);
}


.mppsc-site-logo-bar img{

    width:48px;

    height:48px;

    object-fit:cover;

    border-radius:50%;

    background:#fff;

    padding:2px;

    flex:0 0 auto;
}


.mppsc-site-name{

    font-size:18px;

    font-weight:700;

    line-height:1.2;
}


/* =========================================================
   LOGIN PAGE
   ========================================================= */

.login-page{

    min-height:
        calc(100vh - 64px);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:
        30px 15px 40px;
}


/* =========================================================
   LOGIN CONTAINER
   ========================================================= */

.login-container{

    background:#fff;

    padding:
        35px 30px;

    border-radius:12px;

    box-shadow:
        0 4px 25px rgba(0,0,0,.10);

    width:100%;

    max-width:380px;

    text-align:center;

    border-top:
        5px solid #082b57;
}


/* =========================================================
   TITLES
   ========================================================= */

.logo-title{

    color:#082b57;

    font-size:24px;

    font-weight:bold;

    margin-bottom:5px;
}


.sub-title{

    color:#667085;

    font-size:13px;

    margin-bottom:25px;
}


/* =========================================================
   FORM
   ========================================================= */

.form-group{

    text-align:left;

    margin-bottom:15px;
}


.form-group label{

    font-weight:bold;

    display:block;

    margin-bottom:5px;

    font-size:13px;

    color:#333;
}


input{

    width:100%;

    padding:11px;

    border:
        1px solid #ccc;

    border-radius:6px;

    font-size:14px;
}


input:focus{

    border-color:#147dcc;

    outline:none;

    box-shadow:
        0 0 0 2px rgba(20,125,204,.10);
}


/* =========================================================
   BUTTON
   ========================================================= */

button{

    width:100%;

    padding:12px;

    background:#082b57;

    color:#fff;

    border:none;

    border-radius:6px;

    cursor:pointer;

    font-size:16px;

    font-weight:bold;

    margin-top:10px;
}


button:hover{

    background:#051d3b;
}


button:disabled{

    opacity:.65;

    cursor:not-allowed;
}


/* =========================================================
   SWITCH LINK
   ========================================================= */

.switch-link{

    color:#147dcc;

    cursor:pointer;

    display:block;

    margin-top:20px;

    font-size:13px;

    font-weight:bold;
}


.switch-link:hover{

    text-decoration:underline;
}


/* =========================================================
   ERROR
   ========================================================= */

.error-alert{

    color:#d32f2f;

    font-size:13px;

    font-weight:bold;

    margin-top:10px;

    display:none;

    background:#ffebee;

    padding:8px;

    border-radius:4px;

    border-left:
        4px solid #d32f2f;
}


/* =========================================================
   SUCCESS
   ========================================================= */

.success-alert{

    color:#087f23;

    font-size:13px;

    font-weight:bold;

    margin-top:10px;

    display:none;

    background:#e8f5e9;

    padding:8px;

    border-radius:4px;

    border-left:
        4px solid #087f23;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:600px){

    .mppsc-site-logo-bar{

        min-height:56px;

        padding:
            6px 10px;
    }


    .mppsc-site-logo-bar img{

        width:42px;

        height:42px;
    }


    .mppsc-site-name{

        font-size:15px;
    }


    .login-page{

        min-height:
            calc(100vh - 56px);

        padding:
            20px 10px 30px;
    }


    .login-container{

        padding:
            30px 20px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     SITE LOGO
     ========================================================= -->

<div class="mppsc-site-logo-bar">

    <img
        src="MPPSC-MCQ-Hub-Logo.png"
        alt="MPPSC MCQ Hub Logo"
    >

    <div class="mppsc-site-name">
        MPPSC MCQ Hub V14
    </div>

</div>



<div class="login-page">


<!-- =========================================================
     LOGIN SECTION
     ========================================================= -->

<div
    class="login-container"
    id="login-section"
>


    <div class="logo-title">
        MPPSC MCQ Hub
    </div>


    <div class="sub-title">
        Paid Student Portal Login
    </div>



    <!-- USERNAME -->

    <div class="form-group">

        <label>
            यूजर आईडी (मोबाइल नंबर):
        </label>

        <input
            type="text"
            id="login-user"
            inputmode="numeric"
            maxlength="10"
            autocomplete="username"
            placeholder="10 अंकों का मोबाइल नंबर"
        >

    </div>



    <!-- PASSWORD -->

    <div class="form-group">

        <label>
            पासवर्ड:
        </label>

        <input
            type="password"
            id="login-pass"
            autocomplete="current-password"
            placeholder="अपना पासवर्ड दर्ज करें"
        >

    </div>



    <!-- ERROR -->

    <div
        class="error-alert"
        id="login-error"
    >
        गलत मोबाइल नंबर या पासवर्ड!
    </div>



    <!-- LOGIN BUTTON -->

    <button
        id="login-button"
        type="button"
        onclick="handleStudentLogin()"
    >
        लॉगिन करें
    </button>



    <!-- CHANGE PASSWORD -->

    <span
        class="switch-link"
        onclick="toggleSections(false)"
    >
        🔐 पासवर्ड बदलें
    </span>


</div>



<!-- =========================================================
     CHANGE PASSWORD SECTION
     ========================================================= -->

<div
    class="login-container"
    id="change-section"
    style="display:none;"
>


    <div class="logo-title">
        पासवर्ड बदलें
    </div>


    <div class="sub-title">
        नया Permanent Password सेट करें
    </div>



    <!-- USERNAME -->

    <div class="form-group">

        <label>
            पंजीकृत मोबाइल नंबर:
        </label>

        <input
            type="text"
            id="change-user"
            inputmode="numeric"
            maxlength="10"
            autocomplete="username"
            placeholder="10 अंकों का मोबाइल नंबर"
        >

    </div>



    <!-- OLD PASSWORD -->

    <div class="form-group">

        <label>
            पुराना पासवर्ड:
        </label>

        <input
            type="password"
            id="old-pass"
            autocomplete="current-password"
            placeholder="SMS वाला पासवर्ड"
        >

    </div>



    <!-- NEW PASSWORD -->

    <div class="form-group">

        <label>
            नया पासवर्ड:
        </label>

        <input
            type="password"
            id="new-pass"
            autocomplete="new-password"
            placeholder="नया पासवर्ड"
        >

    </div>



    <!-- ERROR -->

    <div
        class="error-alert"
        id="change-error"
    >
        विवरण मैच नहीं हुआ!
    </div>



    <!-- SUCCESS -->

    <div
        class="success-alert"
        id="change-success"
    >
        पासवर्ड सफलतापूर्वक बदल दिया गया।
    </div>



    <!-- UPDATE BUTTON -->

    <button
        type="button"
        onclick="handlePasswordChange()"
        style="background:#147dcc;"
    >
        Update Password
    </button>



    <!-- BACK -->

    <span
        class="switch-link"
        onclick="toggleSections(true)"
    >
        ⬅ वापस Login
    </span>


</div>

</div>



<script>


/* =========================================================
   MPPSC MCQ HUB V14
   STUDENT LOGIN SYSTEM
   ========================================================= */


/* =========================================================
   STORAGE KEYS
   ========================================================= */

const AUTH_KEY =
    "mppsc_student_authenticated";

const COURSE_KEY =
    "mppsc_student_course";

const USERNAME_KEY =
    "mppsc_student_username";

const STUDENTS_KEY =
    "mppsc_students";



/* =========================================================
   CLEAR OLD / CONFLICTING SESSION
   ========================================================= */

function clearStudentSession(){

    /*
       नया unified session
       sessionStorage में रहेगा।
    */

    sessionStorage.removeItem(
        AUTH_KEY
    );

    sessionStorage.removeItem(
        COURSE_KEY
    );

    sessionStorage.removeItem(
        USERNAME_KEY
    );


    /*
       पुराने system का localStorage
       session भी हटाएँ।
    */

    localStorage.removeItem(
        "mppsc_student_session"
    );

}



/* =========================================================
   PAGE SWITCH
   ========================================================= */

function toggleSections(showLogin){

    document.getElementById(
        "login-error"
    ).style.display =
        "none";


    document.getElementById(
        "change-error"
    ).style.display =
        "none";


    document.getElementById(
        "change-success"
    ).style.display =
        "none";


    document.getElementById(
        "login-section"
    ).style.display =
        showLogin
            ? "block"
            : "none";


    document.getElementById(
        "change-section"
    ).style.display =
        showLogin
            ? "none"
            : "block";

}



/* =========================================================
   READ STUDENT DATABASE
   ========================================================= */

function getStudents(){

    let users = [];

    try{

        const raw =
            localStorage.getItem(
                STUDENTS_KEY
            );


        if(raw){

            users =
                JSON.parse(raw);

        }

    }

    catch(error){

        console.error(
            "❌ Student database error:",
            error
        );

        users = [];

    }


    if(!Array.isArray(users)){

        users = [];

    }


    return users;

}



/* =========================================================
   SAVE STUDENT DATABASE
   ========================================================= */

function saveStudents(users){

    localStorage.setItem(
        STUDENTS_KEY,
        JSON.stringify(users)
    );

}



/* =========================================================
   NORMALIZE COURSE
   ========================================================= */

function normalizeCourse(value){

    return String(
        value || ""
    )
    .trim()
    .toLowerCase();

}



/* =========================================================
   STUDENT LOGIN
   ========================================================= */

function handleStudentLogin(){


    const user =
        document.getElementById(
            "login-user"
        ).value.trim();


    const pass =
        document.getElementById(
            "login-pass"
        ).value;


    const errorBox =
        document.getElementById(
            "login-error"
        );


    const loginButton =
        document.getElementById(
            "login-button"
        );


    errorBox.style.display =
        "none";


    /* =====================================================
       BASIC VALIDATION
       ===================================================== */

    if(!user || !pass){

        alert(
            "कृपया मोबाइल नंबर और पासवर्ड भरें!"
        );

        return;

    }


    if(!/^\d{10}$/.test(user)){

        alert(
            "कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें!"
        );

        return;

    }


    /*
       पुराने session को पहले साफ करें।
    */

    clearStudentSession();


    /*
       Button temporarily disable
    */

    loginButton.disabled =
        true;


    loginButton.innerText =
        "Login हो रहा है...";


    try{


        /* =================================================
           STUDENT DATABASE
           ================================================= */

        const users =
            getStudents();


        console.log(
            "Total students:",
            users.length
        );


        /* =================================================
           FIND USER
           ================================================= */

        const foundUser =
            users.find(function(u){

                if(!u){

                    return false;

                }


                const storedUsername =
                    String(
                        u.username || ""
                    ).trim();


                const storedPassword =
                    String(
                        u.password || ""
                    );


                const active =
                    u.active !== false;


                return (

                    storedUsername === user &&

                    storedPassword === pass &&

                    active

                );

            });


        /* =================================================
           INVALID LOGIN
           ================================================= */

        if(!foundUser){

            errorBox.style.display =
                "block";


            loginButton.disabled =
                false;


            loginButton.innerText =
                "लॉगिन करें";


            return;

        }


        /* =================================================
           COURSE
           ================================================= */

        const course =
            normalizeCourse(
                foundUser.type
            );


        console.log(
            "Student course:",
            course
        );


        /* =================================================
           VALID COURSE CHECK
           ================================================= */

        if(

            course !== "prelims" &&

            course !== "mains"

        ){

            alert(
                "❌ आपके account में कोई valid course assign नहीं है।\n\nAdmin से संपर्क करें।"
            );


            loginButton.disabled =
                false;


            loginButton.innerText =
                "लॉगिन करें";


            return;

        }


        /* =================================================
           CREATE UNIFIED SESSION
           ================================================= */

        sessionStorage.setItem(
            AUTH_KEY,
            "true"
        );


        sessionStorage.setItem(
            COURSE_KEY,
            course
        );


        sessionStorage.setItem(
            USERNAME_KEY,
            String(
                foundUser.username
            )
        );


        /*
           पुराने localStorage session को
           जानबूझकर नहीं बनाया जा रहा।
        */

        localStorage.removeItem(
            "mppsc_student_session"
        );


        /* =================================================
           VERIFY SESSION
           ================================================= */

        const verifyAuth =
            sessionStorage.getItem(
                AUTH_KEY
            ) === "true";


        const verifyCourse =
            normalizeCourse(
                sessionStorage.getItem(
                    COURSE_KEY
                )
            );


        const verifyUsername =
            String(
                sessionStorage.getItem(
                    USERNAME_KEY
                ) || ""
            ).trim();


        console.log(
            "Session Auth:",
            verifyAuth
        );


        console.log(
            "Session Course:",
            verifyCourse
        );


        console.log(
            "Session Username:",
            verifyUsername
        );


        /* =================================================
           FINAL SESSION CHECK
           ================================================= */

        if(

            !verifyAuth ||

            !verifyUsername ||

            verifyCourse !== course

        ){

            clearStudentSession();


            alert(
                "❌ Login session बनाने में समस्या हुई। कृपया दोबारा प्रयास करें।"
            );


            loginButton.disabled =
                false;


            loginButton.innerText =
                "लॉगिन करें";


            return;

        }


        /* =================================================
           SUCCESS MESSAGE
           ================================================= */

        alert(

            "🎉 Login सफल!\n\n" +

            "Student: " +

            verifyUsername +

            "\n\nCourse: " +

            (
                course === "mains"
                    ? "MAINS"
                    : "PRELIMS"
            )

        );


        /* =================================================
           COURSE REDIRECT
           ================================================= */

        if(course === "mains"){

            window.location.replace(
                "mains-600.html"
            );

        }

        else{

            window.location.replace(
                "prelims.html"
            );

        }


    }

    catch(error){

        console.error(
            "❌ Login error:",
            error
        );


        clearStudentSession();


        alert(
            "❌ Login में technical error आया। कृपया दोबारा प्रयास करें।"
        );


        loginButton.disabled =
            false;


        loginButton.innerText =
            "लॉगिन करें";

    }

}



/* =========================================================
   CHANGE PASSWORD
   ========================================================= */

function handlePasswordChange(){


    const user =
        document.getElementById(
            "change-user"
        ).value.trim();


    const oldPass =
        document.getElementById(
            "old-pass"
        ).value;


    const newPass =
        document.getElementById(
            "new-pass"
        ).value;


    const errorBox =
        document.getElementById(
            "change-error"
        );


    const successBox =
        document.getElementById(
            "change-success"
        );


    errorBox.style.display =
        "none";


    successBox.style.display =
        "none";


    /* =====================================================
       VALIDATION
       ===================================================== */

    if(

        !user ||

        !oldPass ||

        !newPass

    ){

        alert(
            "कृपया सभी विवरण भरें!"
        );

        return;

    }


    if(!/^\d{10}$/.test(user)){

        alert(
            "कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें!"
        );

        return;

    }


    if(newPass.length < 4){

        alert(
            "नया पासवर्ड कम से कम 4 अक्षरों/अंकों का होना चाहिए!"
        );

        return;

    }


    /* =====================================================
       STUDENT DATABASE
       ===================================================== */

    const users =
        getStudents();


    /* =====================================================
       FIND USER
       ===================================================== */

    const userIndex =
        users.findIndex(function(u){

            if(!u){

                return false;

            }


            return (

                String(
                    u.username || ""
                ).trim() === user &&

                String(
                    u.password || ""
                ) === oldPass &&

                u.active !== false

            );

        });


    /* =====================================================
       USER NOT FOUND
       ===================================================== */

    if(userIndex === -1){

        errorBox.style.display =
            "block";

        return;

    }


    /* =====================================================
       UPDATE PASSWORD
       ===================================================== */

    users[userIndex].password =
        newPass;


    saveStudents(
        users
    );


    /* =====================================================
       SUCCESS
       ===================================================== */

    successBox.style.display =
        "block";


    document.getElementById(
        "login-user"
    ).value =
        user;


    document.getElementById(
        "login-pass"
    ).value =
        "";


    document.getElementById(
        "change-user"
    ).value =
        "";


    document.getElementById(
        "old-pass"
    ).value =
        "";


    document.getElementById(
        "new-pass"
    ).value =
        "";


    setTimeout(function(){

        toggleSections(
            true
        );

    },1200);

}



/* =========================================================
   ENTER KEY
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&

            document.getElementById(
                "login-section"
            ).style.display !== "none"
        ){

            handleStudentLogin();

        }

    }
);



/* =========================================================
   PAGE LOAD
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        /*
           Login page पर आने पर
           पुराने course session को साफ रखें।
        */

        clearStudentSession();


        console.log(
            "===================================="
        );

        console.log(
            "🔐 MPPSC STUDENT LOGIN READY"
        );

        console.log(
            "===================================="
        );

    }
);

</script>


</body>

</html>
