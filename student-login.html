<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login · MPPSC MCQ Hub</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#edf3ff;color:#102a43}.top{background:#082b57;color:#fff;padding:16px 20px;font-weight:800;font-size:19px}.box{max-width:430px;margin:55px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 28px #0002}.box h1{margin-top:0}.box input{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #ccd6e3;border-radius:9px;box-sizing:border-box;font-size:16px}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#0d47a1;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.err{color:#c62828;font-weight:bold;min-height:24px;margin:5px 0}.note{font-size:13px;color:#667085;line-height:1.5}.links{text-align:center;margin-top:18px}.links a{color:#0d47a1;font-weight:700;text-decoration:none}</style></head>
<body><div class="top">🎓 MPPSC MCQ Hub — Student Login</div><div class="box"><h1>Student Login</h1><p>Admin द्वारा payment approve होने के बाद मिला Mobile और Password दर्ज करें।</p><label>Mobile Number</label><input id="u" inputmode="numeric" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर"><label>Password</label><input id="p" type="password" placeholder="MPPSC-XXXX"><div id="err" class="err"></div><button class="btn" onclick="login()">🔓 Login</button><div class="links"><a href="payment.html?type=prelims">PRELIMS ₹99</a> &nbsp; | &nbsp; <a href="payment.html?type=mains">MAINS ₹199</a></div><p class="note">Payment भेजने के बाद Admin verification आवश्यक है। Verification से पहले course access नहीं मिलेगा।</p></div>
<script>function login(){
const u=document.getElementById('u').value.trim();
const p=document.getElementById('p').value.trim();
const users=JSON.parse(localStorage.getItem('mppsc_students')||'[]');
const user=users.find(x=>String(x.username||'').trim()===u && String(x.password||'').trim()===p && x.active!==false);
if(!user){document.getElementById('err').textContent='Mobile या Password गलत है, या payment अभी approve नहीं हुआ है।';return;}
user.courses=Array.from(new Set((Array.isArray(user.courses)?user.courses:(user.type?[user.type]:[])).map(c=>String(c).toLowerCase()).filter(c=>c==='prelims'||c==='mains')));
localStorage.setItem('mppsc_current_student',JSON.stringify(user));
location.href='student-dashboard.html';
}document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(new URLSearchParams(location.search).get('submitted'))document.getElementById('err').style.color='#2e7d32',document.getElementById('err').textContent='✓ Payment request भेज दी गई है। Admin approval के बाद login करें।';</script></body></html>
