<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Student Login</title>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<script src='js/supabase.js'></script><script src='js/auth.js'></script>
<style>body{font-family:Arial;background:#0d47a1;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}.box{background:#fff;color:#000;padding:25px;border-radius:12px;width:320px}input,button{width:100%;padding:10px;margin:8px 0}button{background:#0d47a1;color:#fff;border:0}</style></head>
<body><div class='box'><h2>Student Login</h2><input id=e placeholder='Email'><input id=p type=password placeholder='Password'><button onclick="login(e.value,p.value)">Login</button><button onclick="location='register.html'">Create Account</button></div></body></html>
