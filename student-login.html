<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MPPSC MCQ Hub - Student Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fc;
  min-height:100vh;
}

/* =========================
   HEADER
========================= */

.mppsc-site-logo-bar{
  width:100%;
  background:#0d47a1;
  color:#fff;
  min-height:64px;
  padding:8px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 7px rgba(0,0,0,.12);
}

.mppsc-site-logo-bar img{
  width:48px;
  height:48px;
  object-fit:cover;
  border-radius:50%;
  background:#fff;
  padding:2px;
}

.mppsc-site-name{
  font-size:18px;
  font-weight:700;
}

/* =========================
   LOGIN PAGE
========================= */

.login-page{
  min-height:calc(100vh - 64px);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px 15px 40px;
}

.login-container{
  background:#fff;
  padding:35px 30px;
  border-radius:12px;
  box-shadow:0 4px 25px rgba(0,0,0,.10);
  width:100%;
  max-width:380px;
  text-align:center;
  border-top:5px solid #082b57;
}

.logo-title{
  color:#082b57;
  font-size:24px;
  font-weight:bold;
  margin-bottom:5px;
}

.sub-title{
  color:#667085;
  font-size:13px;
  margin-bottom:25px;
}

.course-badge{
  display:inline-block;
  background:#eaf2fb;
  color:#082b57;
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:18px;
}

/* =========================
   COURSE SELECTOR
========================= */

#course-selector{
  display:none;
  margin-bottom:18px;
}

#course-selector-title{
  font-size:13px;
  font-weight:700;
  color:#444;
  margin-bottom:10px;
}

/* =========================
   FORM
========================= */

.form-group{
  width:100%;
  text-align:left;
  margin-bottom:15px;
  display:block !important;
}

.form-group label{
  font-weight:bold;
  display:block !important;
  width:100%;
  margin-bottom:6px;
  font-size:13px;
  color:#333;
}

/* =========================
   LOGIN INPUTS
   FORCE VISIBLE
========================= */

.form-group input,
#login-user,
#login-pass,
#change-user,
#old-pass,
#new-pass{
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;

  width:100% !important;
  height:44px !important;
  min-height:44px !important;

  padding:10px 12px !important;

  border:1px solid #777 !important;
  border-radius:6px !important;

  background:#ffffff !important;
  color:#111111 !important;

  font-family:Arial,Helvetica,sans-serif !important;
  font-size:14px !important;
  line-height:22px !important;

  outline:none !important;
  box-shadow:none !important;
}

.form-group input::placeholder{
  color:#888 !important;
  opacity:1 !important;
}

.form-group input:focus{
  border-color:#147dcc !important;
  box-shadow:0 0 0 2px rgba(20,125,204,.12) !important;
}

/* =========================
   BUTTON
========================= */

button{
  width:100%;
  min-height:44px;
  padding:12px;

  background:#082b57;
  color:#fff;

  border:none;
  border-radius:6px;

  cursor:pointer;

  font-size:16px;
  font-weight:bold;

  margin-top:10px;
}

button:hover{
  background:#051d3b;
}

#course-selector button{
  margin-top:0;
}

#course-selector .prelims-btn{
  background:#cf2e2e;
  margin-bottom:8px;
}

#course-selector .prelims-btn:hover{
  background:#a92323;
}

#course-selector .mains-btn{
  background:#147dcc;
}

#course-selector .mains-btn:hover{
  background:#0d5e99;
}

/* =========================
   LINKS
========================= */

.switch-link{
  color:#147dcc;
  cursor:pointer;
  display:block;
  margin-top:20px;
  font-size:13px;
  font-weight:bold;
}

/* =========================
   ALERTS
========================= */

.error-alert{
  color:#d32f2f;
  font-size:13px;
  font-weight:bold;

  margin-top:10px;

  display:none;

  background:#ffebee;

  padding:8px;

  border-radius:4px;

  border-left:4px solid #d32f2f;

  text-align:left;
}

.success-alert{
  color:#087f23;
  font-size:13px;
  font-weight:bold;

  margin-top:10px;

  display:none;

  background:#e8f5e9;

  padding:8px;

  border-radius:4px;

  border-left:4px solid #087f23;

  text-align:left;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .mppsc-site-logo-bar{
    min-height:56px;
    padding:6px 10px;
  }

  .mppsc-site-logo-bar img{
    width:42px;
    height:42px;
  }

  .mppsc-site-name{
    font-size:15px;
  }

  .login-page{
    min-height:calc(100vh - 56px);
    padding:20px 10px 30px;
  }

  .login-container{
    padding:28px 20px;
  }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<div class="mppsc-site-logo-bar">

  <img
    src="MPPSC-MCQ-Hub-Logo.png"
    alt="MPPSC MCQ Hub Logo"
  >

  <div class="mppsc-site-name">
    MPPSC MCQ Hub V14
  </div>

</div>


<!-- =========================
     LOGIN PAGE
========================= -->

<div class="login-page">

  <div
    class="login-container"
    id="login-section"
  >

    <div class="logo-title">
      MPPSC MCQ Hub
    </div>

    <div class="sub-title">
      Paid Student Portal Login
    </div>

    <div
      class="course-badge"
      id="course-badge"
    >
      Course Login
    </div>


    <!-- =========================
         COURSE SELECTOR
    ========================= -->

    <div id="course-selector">

      <div id="course-selector-title">
        पहले Course चुनें:
      </div>

      <button
        type="button"
        class="prelims-btn"
        onclick="selectCourse('prelims')"
      >
        PRELIMS Login
      </button>

      <button
        type="button"
        class="mains-btn"
        onclick="selectCourse('mains')"
      >
        MAINS Login
      </button>

    </div>


    <!-- =========================
         USER ID
    ========================= -->

    <div
      class="form-group"
      id="user-group"
    >

      <label for="login-user">
        यूजर आईडी (मोबाइल नंबर):
      </label>

      <input
        type="text"
        id="login-user"
        name="login-user"
        inputmode="numeric"
        maxlength="10"
        autocomplete="username"
        placeholder="10 अंकों का मोबाइल नंबर"
        style="
          display:block !important;
          visibility:visible !important;
          opacity:1 !important;
        "
      >

    </div>


    <!-- =========================
         PASSWORD
    ========================= -->

    <div
      class="form-group"
      id="password-group"
    >

      <label for="login-pass">
        पासवर्ड:
      </label>

      <input
        type="password"
        id="login-pass"
        name="login-pass"
        autocomplete="current-password"
        placeholder="अपना पासवर्ड दर्ज करें"
        style="
          display:block !important;
          visibility:visible !important;
          opacity:1 !important;
        "
      >

    </div>


    <!-- =========================
         LOGIN ERROR
    ========================= -->

    <div
      class="error-alert"
      id="login-error"
    ></div>


    <!-- =========================
         LOGIN BUTTON
    ========================= -->

    <button
      id="login-button"
      type="button"
      onclick="handleStudentLogin()"
    >
      लॉगिन करें
    </button>


    <!-- =========================
         CHANGE PASSWORD
    ========================= -->

    <span
      class="switch-link"
      onclick="toggleSections(false)"
    >
      🔐 पासवर्ड बदलें
    </span>

  </div>


  <!-- =========================
       CHANGE PASSWORD SECTION
  ========================= -->

  <div
    class="login-container"
    id="change-section"
    style="display:none;"
  >

    <div class="logo-title">
      पासवर्ड बदलें
    </div>

    <div class="sub-title">
      नया Permanent Password सेट करें
    </div>


    <div class="form-group">

      <label for="change-user">
        पंजीकृत मोबाइल नंबर:
      </label>

      <input
        type="text"
        id="change-user"
        inputmode="numeric"
        maxlength="10"
        placeholder="10 अंकों का मोबाइल नंबर"
      >

    </div>


    <div class="form-group">

      <label for="old-pass">
        पुराना पासवर्ड:
      </label>

      <input
        type="password"
        id="old-pass"
        placeholder="SMS वाला पासवर्ड"
      >

    </div>


    <div class="form-group">

      <label for="new-pass">
        नया पासवर्ड:
      </label>

      <input
        type="password"
        id="new-pass"
        placeholder="नया पासवर्ड"
      >

    </div>


    <div
      class="error-alert"
      id="change-error"
    >
      विवरण मैच नहीं हुआ!
    </div>


    <div
      class="success-alert"
      id="change-success"
    >
      पासवर्ड सफलतापूर्वक बदल दिया गया।
    </div>


    <button
      type="button"
      onclick="handlePasswordChange()"
      style="background:#147dcc;"
    >
      Update Password
    </button>


    <span
      class="switch-link"
      onclick="toggleSections(true)"
    >
      ⬅ वापस Login
    </span>

  </div>

</div>


<script>
"use strict";

/* ==========================================
   COURSE FROM URL
========================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

let requestedCourse =
  String(
    params.get("course") || ""
  )
  .trim()
  .toLowerCase();


/* ==========================================
   UPDATE COURSE UI
========================================== */

function updateCourseUI(){

  const selector =
    document.getElementById(
      "course-selector"
    );

  const badge =
    document.getElementById(
      "course-badge"
    );

  const userGroup =
    document.getElementById(
      "user-group"
    );

  const passwordGroup =
    document.getElementById(
      "password-group"
    );

  const loginButton =
    document.getElementById(
      "login-button"
    );

  const userInput =
    document.getElementById(
      "login-user"
    );

  const passInput =
    document.getElementById(
      "login-pass"
    );


  /* =========================
     NO COURSE
  ========================= */

  if(
    requestedCourse !== "mains" &&
    requestedCourse !== "prelims"
  ){

    badge.textContent =
      "Course Login";

    selector.style.display =
      "block";

    userGroup.style.display =
      "none";

    passwordGroup.style.display =
      "none";

    loginButton.style.display =
      "none";

    return;
  }


  /* =========================
     COURSE NAME
  ========================= */

  if(
    requestedCourse === "mains"
  ){

    badge.textContent =
      "MAINS Student Login";

  }else{

    badge.textContent =
      "PRELIMS Student Login";
  }


  /* =========================
     SHOW LOGIN FORM
  ========================= */

  selector.style.display =
    "none";

  userGroup.style.display =
    "block";

  passwordGroup.style.display =
    "block";

  loginButton.style.display =
    "block";


  /* =========================
     FORCE INPUT VISIBLE
  ========================= */

  userInput.style.display =
    "block";

  userInput.style.visibility =
    "visible";

  userInput.style.opacity =
    "1";

  userInput.style.width =
    "100%";

  userInput.style.height =
    "44px";


  passInput.style.display =
    "block";

  passInput.style.visibility =
    "visible";

  passInput.style.opacity =
    "1";

  passInput.style.width =
    "100%";

  passInput.style.height =
    "44px";
}


/* ==========================================
   SELECT COURSE
========================================== */

function selectCourse(course){

  if(
    course !== "mains" &&
    course !== "prelims"
  ){

    return;
  }


  requestedCourse =
    course;


  const url =
    new URL(
      window.location.href
    );


  url.searchParams.set(
    "course",
    course
  );


  window.history.replaceState(
    {},
    "",
    url.toString()
  );


  updateCourseUI();
}


/* ==========================================
   INITIALIZE
========================================== */

updateCourseUI();


/* ==========================================
   CLEAR SESSION
========================================== */

function clearStudentSession(){

  sessionStorage.removeItem(
    "mppsc_student_authenticated"
  );

  sessionStorage.removeItem(
    "mppsc_student_course"
  );

  sessionStorage.removeItem(
    "mppsc_student_username"
  );
}


/* ==========================================
   LOGIN / PASSWORD CHANGE SWITCH
========================================== */

function toggleSections(
  showLogin
){

  document.getElementById(
    "login-error"
  ).style.display =
    "none";

  document.getElementById(
    "change-error"
  ).style.display =
    "none";

  document.getElementById(
    "change-success"
  ).style.display =
    "none";


  document.getElementById(
    "login-section"
  ).style.display =
    showLogin
      ? "block"
      : "none";


  document.getElementById(
    "change-section"
  ).style.display =
    showLogin
      ? "none"
      : "block";
}


/* ==========================================
   GET USERS
========================================== */

function getUsers(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          "mppsc_students"
        ) || "[]"
      );


    return Array.isArray(data)
      ? data
      : [];

  }catch(e){

    console.error(
      "Student database error:",
      e
    );

    return [];
  }
}


/* ==========================================
   STUDENT LOGIN
========================================== */

function handleStudentLogin(){

  const user =
    document
      .getElementById(
        "login-user"
      )
      .value
      .trim();


  const pass =
    document
      .getElementById(
        "login-pass"
      )
      .value;


  const errorBox =
    document.getElementById(
      "login-error"
    );


  errorBox.style.display =
    "none";


  /* =========================
     COURSE CHECK
  ========================= */

  if(
    requestedCourse !== "mains" &&
    requestedCourse !== "prelims"
  ){

    errorBox.textContent =
      "❌ पहले PRELIMS या MAINS Course चुनें।";

    errorBox.style.display =
      "block";

    return;
  }


  /* =========================
     EMPTY FIELD CHECK
  ========================= */

  if(
    !user ||
    !pass
  ){

    errorBox.textContent =
      "कृपया मोबाइल नंबर और पासवर्ड भरें!";

    errorBox.style.display =
      "block";

    return;
  }


  clearStudentSession();


  const users =
    getUsers();


  /* =========================
     EXACT COURSE LOGIN
     
     Username
     Password
     Course
     Active
     
     चारों check होंगे।
  ========================= */

  const foundUser =
    users.find(
      function(u){

        const username =
          String(
            u.username || ""
          )
          .trim();


        const password =
          String(
            u.password || ""
          );


        const type =
          String(
            u.type || ""
          )
          .trim()
          .toLowerCase();


        return (
          username === user &&
          password === pass &&
          type === requestedCourse &&
          u.active !== false
        );

      }
    );


  /* =========================
     LOGIN FAILED
  ========================= */

  if(!foundUser){

    errorBox.textContent =
      "❌ गलत " +
      (
        requestedCourse === "mains"
          ? "MAINS"
          : "PRELIMS"
      ) +
      " मोबाइल नंबर या पासवर्ड!";

    errorBox.style.display =
      "block";

    return;
  }


  /* =========================
     LOGIN SUCCESS
  ========================= */

  sessionStorage.setItem(
    "mppsc_student_authenticated",
    "true"
  );


  sessionStorage.setItem(
    "mppsc_student_course",
    requestedCourse
  );


  sessionStorage.setItem(
    "mppsc_student_username",
    String(
      foundUser.username
    )
  );


  /* =========================
     REDIRECT
  ========================= */

  if(
    requestedCourse === "mains"
  ){

    window.location.replace(
      "mains-600.html"
    );

  }else{

    window.location.replace(
      "prelims.html"
    );
  }
}


/* ==========================================
   CHANGE PASSWORD
========================================== */

function handlePasswordChange(){

  const user =
    document
      .getElementById(
        "change-user"
      )
      .value
      .trim();


  const oldPass =
    document
      .getElementById(
        "old-pass"
      )
      .value;


  const newPass =
    document
      .getElementById(
        "new-pass"
      )
      .value;


  const errorBox =
    document.getElementById(
      "change-error"
    );


  const successBox =
    document.getElementById(
      "change-success"
    );


  errorBox.style.display =
    "none";

  successBox.style.display =
    "none";


  /* =========================
     EMPTY CHECK
  ========================= */

  if(
    !user ||
    !oldPass ||
    !newPass
  ){

    errorBox.textContent =
      "कृपया सभी विवरण भरें!";

    errorBox.style.display =
      "block";

    return;
  }


  /* =========================
     PASSWORD LENGTH
  ========================= */

  if(
    newPass.length < 4
  ){

    errorBox.textContent =
      "नया पासवर्ड कम से कम 4 अक्षरों/अंकों का होना चाहिए!";

    errorBox.style.display =
      "block";

    return;
  }


  const users =
    getUsers();


  /* =========================
     FIND USER
  ========================= */

  const userIndex =
    users.findIndex(
      function(u){

        return (
          String(
            u.username || ""
          )
          .trim()
          === user &&

          String(
            u.password || ""
          )
          === oldPass &&

          u.active !== false &&

          (
            requestedCourse === "" ||

            String(
              u.type || ""
            )
            .trim()
            .toLowerCase()
            === requestedCourse
          )
        );

      }
    );


  /* =========================
     USER NOT FOUND
  ========================= */

  if(
    userIndex === -1
  ){

    errorBox.textContent =
      "❌ मोबाइल नंबर, पुराने पासवर्ड या course का मिलान नहीं हुआ!";

    errorBox.style.display =
      "block";

    return;
  }


  /* =========================
     UPDATE PASSWORD
  ========================= */

  users[userIndex].password =
    newPass;


  localStorage.setItem(
    "mppsc_students",
    JSON.stringify(
      users
    )
  );


  successBox.textContent =
    "पासवर्ड सफलतापूर्वक बदल दिया गया।";

  successBox.style.display =
    "block";


  document.getElementById(
    "login-user"
  ).value =
    user;


  document.getElementById(
    "login-pass"
  ).value =
    "";


  setTimeout(
    function(){

      toggleSections(true);

    },
    1200
  );
}


/* ==========================================
   ENTER KEY LOGIN
========================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      document.getElementById(
        "login-section"
      ).style.display !== "none"
    ){

      handleStudentLogin();
    }

  }
);
</script>

</body>
</html>
