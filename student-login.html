<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub - Student Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f7fc;min-height:100vh}
.mppsc-site-logo-bar{width:100%;background:#0d47a1;color:#fff;min-height:64px;padding:8px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 7px rgba(0,0,0,.12)}
.mppsc-site-logo-bar img{width:48px;height:48px;object-fit:cover;border-radius:50%;background:#fff;padding:2px}
.mppsc-site-name{font-size:18px;font-weight:700}
.login-page{min-height:calc(100vh - 64px);display:flex;justify-content:center;align-items:center;padding:30px 15px 40px}
.login-container{background:#fff;padding:35px 30px;border-radius:12px;box-shadow:0 4px 25px rgba(0,0,0,.10);width:100%;max-width:380px;text-align:center;border-top:5px solid #082b57}
.logo-title{color:#082b57;font-size:24px;font-weight:bold;margin-bottom:5px}
.sub-title{color:#667085;font-size:13px;margin-bottom:25px}
.form-group{text-align:left;margin-bottom:15px}
.form-group label{font-weight:bold;display:block;margin-bottom:5px;font-size:13px;color:#333}
input{width:100%;padding:11px;border:1px solid #ccc;border-radius:6px;font-size:14px}
input:focus{border-color:#147dcc;outline:none}
button{width:100%;padding:12px;background:#082b57;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px;font-weight:bold;margin-top:10px}
button:hover{background:#051d3b}
.switch-link{color:#147dcc;cursor:pointer;display:block;margin-top:20px;font-size:13px;font-weight:bold}
.error-alert{color:#d32f2f;font-size:13px;font-weight:bold;margin-top:10px;display:none;background:#ffebee;padding:8px;border-radius:4px;border-left:4px solid #d32f2f}
.success-alert{color:#087f23;font-size:13px;font-weight:bold;margin-top:10px;display:none;background:#e8f5e9;padding:8px;border-radius:4px;border-left:4px solid #087f23}
@media(max-width:600px){.mppsc-site-logo-bar{min-height:56px;padding:6px 10px}.mppsc-site-logo-bar img{width:42px;height:42px}.mppsc-site-name{font-size:15px}.login-page{min-height:calc(100vh - 56px);padding:20px 10px 30px}}
</style>
</head>
<body>
<div class="mppsc-site-logo-bar">
<img src="MPPSC-MCQ-Hub-Logo.png" alt="MPPSC MCQ Hub Logo">
<div class="mppsc-site-name">MPPSC MCQ Hub V14</div>
</div>
<div class="login-page">
<div class="login-container" id="login-section">
<div class="logo-title">MPPSC MCQ Hub</div>
<div class="sub-title">Paid Student Portal Login</div>
<div class="form-group"><label>यूजर आईडी (मोबाइल नंबर):</label><input type="text" id="login-user" inputmode="numeric" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर"></div>
<div class="form-group"><label>पासवर्ड:</label><input type="password" id="login-pass" placeholder="अपना पासवर्ड दर्ज करें"></div>
<div class="error-alert" id="login-error">गलत मोबाइल नंबर या पासवर्ड!</div>
<button onclick="handleStudentLogin()">लॉगिन करें</button>
<span class="switch-link" onclick="toggleSections(false)">🔐 पासवर्ड बदलें</span>
</div>
<div class="login-container" id="change-section" style="display:none;">
<div class="logo-title">पासवर्ड बदलें</div>
<div class="sub-title">नया Permanent Password सेट करें</div>
<div class="form-group"><label>पंजीकृत मोबाइल नंबर:</label><input type="text" id="change-user" inputmode="numeric" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर"></div>
<div class="form-group"><label>पुराना पासवर्ड:</label><input type="password" id="old-pass" placeholder="SMS वाला पासवर्ड"></div>
<div class="form-group"><label>नया पासवर्ड:</label><input type="password" id="new-pass" placeholder="नया पासवर्ड"></div>
<div class="error-alert" id="change-error">विवरण मैच नहीं हुआ!</div>
<div class="success-alert" id="change-success">पासवर्ड सफलतापूर्वक बदल दिया गया।</div>
<button onclick="handlePasswordChange()" style="background:#147dcc;">Update Password</button>
<span class="switch-link" onclick="toggleSections(true)">⬅ वापस Login</span>
</div>
</div>
<script>
"use strict";
function clearStudentSession(){
sessionStorage.removeItem("mppsc_student_authenticated");
sessionStorage.removeItem("mppsc_student_course");
sessionStorage.removeItem("mppsc_student_username");
}
function toggleSections(showLogin){
document.getElementById("login-error").style.display="none";
document.getElementById("change-error").style.display="none";
document.getElementById("change-success").style.display="none";
document.getElementById("login-section").style.display=showLogin?"block":"none";
document.getElementById("change-section").style.display=showLogin?"none":"block";
}
function getStudents(){
try{return JSON.parse(localStorage.getItem("mppsc_students")||"[]")||[];}
catch(e){console.error("Student database error:",e);return [];}
}
function handleStudentLogin(){
const user=document.getElementById("login-user").value.trim();
const pass=document.getElementById("login-pass").value;
const errorBox=document.getElementById("login-error");
errorBox.style.display="none";
if(!user||!pass){alert("कृपया मोबाइल नंबर और पासवर्ड भरें!");return;}
clearStudentSession();
const users=getStudents();
const foundUser=users.find(function(u){
return String(u.username||"").trim()===user&&String(u.password||"")===pass&&u.active!==false;
});
if(!foundUser){errorBox.style.display="block";return;}
const course=String(foundUser.type||"").trim().toLowerCase();
if(course!=="prelims"&&course!=="mains"){alert("❌ आपके account में कोई valid course assign नहीं है। Admin से संपर्क करें।");return;}
sessionStorage.setItem("mppsc_student_authenticated","true");
sessionStorage.setItem("mppsc_student_course",course);
sessionStorage.setItem("mppsc_student_username",String(foundUser.username||user));
alert("🎉 Login सफल!\n\nCourse: "+(course==="mains"?"MAINS":"PRELIMS"));
window.location.replace(course==="mains"?"mains-600.html":"prelims.html");
}
function handlePasswordChange(){
const user=document.getElementById("change-user").value.trim();
const oldPass=document.getElementById("old-pass").value;
const newPass=document.getElementById("new-pass").value;
const errorBox=document.getElementById("change-error");
const successBox=document.getElementById("change-success");
errorBox.style.display="none";successBox.style.display="none";
if(!user||!oldPass||!newPass){alert("कृपया सभी विवरण भरें!");return;}
if(newPass.length<4){alert("नया पासवर्ड कम से कम 4 अक्षरों/अंकों का होना चाहिए!");return;}
const users=getStudents();
const userIndex=users.findIndex(function(u){
return String(u.username||"").trim()===user&&String(u.password||"")===oldPass&&u.active!==false;
});
if(userIndex===-1){errorBox.style.display="block";return;}
users[userIndex].password=newPass;
localStorage.setItem("mppsc_students",JSON.stringify(users));
successBox.style.display="block";
document.getElementById("login-user").value=user;
document.getElementById("login-pass").value="";
setTimeout(function(){toggleSections(true)},1200);
}
document.addEventListener("keydown",function(event){
if(event.key==="Enter"&&document.getElementById("login-section").style.display!=="none")handleStudentLogin();
});
</script>
</body>
</html>
