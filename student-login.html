<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPPSC Portal - Student Login</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;font-family:Arial,Helvetica,sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#0d47a1,#eaf1ff);
    }
    .card{
      width:min(430px,92vw);background:#fff;border-radius:18px;padding:30px;
      box-shadow:0 15px 45px rgba(0,0,0,.18);
    }
    .logo{display:block;margin:0 auto 12px;width:72px;height:72px;border-radius:50%;object-fit:cover}
    h1{text-align:center;color:#0d47a1;margin:8px 0 3px;font-size:25px}
    .sub{text-align:center;color:#666;margin:0 0 24px;font-size:14px}
    label{display:block;font-weight:700;margin:12px 0 6px;color:#222}
    input{
      width:100%;padding:13px 14px;border:1px solid #ccc;border-radius:10px;
      font-size:16px;outline:none;
    }
    input:focus{border-color:#0d47a1;box-shadow:0 0 0 3px rgba(13,71,161,.10)}
    button{
      width:100%;padding:13px;border:0;border-radius:10px;font-size:16px;
      font-weight:700;cursor:pointer;margin-top:18px;
    }
    .login{background:#0d47a1;color:#fff}
    .signup{background:#f2f5fa;color:#0d47a1}
    .msg{margin-top:14px;padding:10px;border-radius:8px;display:none;font-size:14px}
    .info{background:#eef5ff;color:#164b88}
    .error{background:#ffecec;color:#a40000}
    .success{background:#ecfff1;color:#137333}
    .back{text-align:center;margin-top:18px}
    .back a{color:#0d47a1;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="mppsc-logo.jpg" alt="MPPSC">
    <h1>Student Login</h1>
    <p class="sub">MPPSC Portal • Paid Course Access</p>

    <label for="email">Email / ई-मेल</label>
    <input id="email" type="email" placeholder="student@example.com" autocomplete="email">

    <label for="password">Password / पासवर्ड</label>
    <input id="password" type="password" placeholder="Enter password" autocomplete="current-password">

    <button class="login" id="loginBtn">🔐 Login / लॉगिन</button>
    <button class="signup" id="signupBtn">📝 Create Account / नया खाता</button>

    <div id="msg" class="msg"></div>

    <div class="back"><a href="index.html">← Back to Home / होम</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ====== अपने Supabase Project की values यहाँ डालें ======
    const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY";
    // =====================================================

    const msg = document.getElementById("msg");
    const email = document.getElementById("email");
    const password = document.getElementById("password");

    function showMsg(text, type="info"){
      msg.textContent = text;
      msg.className = "msg " + type;
      msg.style.display = "block";
    }

    if (
      SUPABASE_URL.includes("PASTE_") ||
      SUPABASE_ANON_KEY.includes("PASTE_")
    ) {
      showMsg("Supabase URL और Anon Key डालने के बाद login चालू होगा।", "info");
    }

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    document.getElementById("signupBtn").addEventListener("click", async () => {
      const e = email.value.trim();
      const p = password.value;

      if (!e || !p) return showMsg("Email और password भरें।", "error");
      if (p.length < 6) return showMsg("Password कम से कम 6 characters का रखें।", "error");

      const { error } = await supabaseClient.auth.signUp({
        email: e,
        password: p,
        options: {
          emailRedirectTo: window.location.origin + "/student-login.html"
        }
      });

      if (error) return showMsg(error.message, "error");
      showMsg("Account बन गया। Email verification माँगी जाए तो email verify करें, फिर login करें।", "success");
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const e = email.value.trim();
      const p = password.value;

      if (!e || !p) return showMsg("Email और password भरें।", "error");

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: e,
        password: p
      });

      if (error) return showMsg(error.message, "error");

      showMsg("Login successful. Paid course access check किया जा रहा है...", "success");

      // अभी केवल login के बाद page खोल रहा है.
      // Payment verification को secure बनाने के लिए इस redirect से पहले
      // आपकी Supabase payment/access table या Edge Function से paid status check करें.
      setTimeout(() => {
        window.location.href = "prelims-paid.html";
      }, 700);
    });
  </script>
</body>
</html>
