<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MPPSC MCQ Hub - Student Login</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fc;
  min-height:100vh;
}


/* =====================================================
   TOP HEADER
===================================================== */

.mppsc-site-logo-bar{
  width:100%;
  background:#0d47a1;
  color:#fff;

  min-height:64px;

  padding:8px 16px;

  display:flex;
  align-items:center;

  gap:12px;

  box-shadow:0 2px 7px rgba(0,0,0,.12);
}

.mppsc-site-logo-bar img{
  width:48px;
  height:48px;

  object-fit:cover;

  border-radius:50%;

  background:#fff;

  padding:2px;
}

.mppsc-site-name{
  font-size:18px;
  font-weight:700;
}


/* =====================================================
   LOGIN PAGE
===================================================== */

.login-page{

  min-height:calc(100vh - 64px);

  display:flex;

  justify-content:center;
  align-items:center;

  padding:30px 15px 40px;
}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-container{

  background:#fff;

  padding:35px 30px;

  border-radius:12px;

  box-shadow:
    0 4px 25px rgba(0,0,0,.10);

  width:100%;

  max-width:380px;

  text-align:center;

  border-top:5px solid #082b57;
}


/* =====================================================
   TITLE
===================================================== */

.logo-title{

  color:#082b57;

  font-size:24px;

  font-weight:bold;

  margin-bottom:5px;
}

.sub-title{

  color:#667085;

  font-size:13px;

  margin-bottom:20px;
}


/* =====================================================
   COURSE BADGE
===================================================== */

.course-badge{

  display:inline-block;

  background:#eaf2fb;

  color:#082b57;

  padding:7px 14px;

  border-radius:20px;

  font-size:13px;

  font-weight:bold;

  margin-bottom:22px;
}


/* =====================================================
   FORM
===================================================== */

.form-group{

  width:100%;

  text-align:left;

  margin-bottom:15px;

  display:block !important;
}

.form-group label{

  font-weight:bold;

  display:block !important;

  margin-bottom:6px;

  font-size:13px;

  color:#333;
}


/* =====================================================
   INPUTS
===================================================== */

.form-group input,
#login-user,
#login-pass,
#change-user,
#old-pass,
#new-pass{

  display:block !important;

  visibility:visible !important;

  opacity:1 !important;

  width:100% !important;

  height:44px !important;

  min-height:44px !important;

  padding:10px 12px !important;

  border:1px solid #b8c0cc !important;

  border-radius:6px !important;

  background:#ffffff !important;

  color:#222222 !important;

  font-family:Arial,Helvetica,sans-serif !important;

  font-size:14px !important;

  outline:none;

  box-shadow:none;
}

.form-group input::placeholder{

  color:#888 !important;

  opacity:1 !important;
}

.form-group input:focus{

  border-color:#147dcc !important;

  box-shadow:
    0 0 0 2px rgba(20,125,204,.12) !important;
}


/* =====================================================
   LOGIN BUTTON
===================================================== */

button{

  width:100%;

  min-height:44px;

  padding:12px;

  background:#082b57;

  color:#fff;

  border:none;

  border-radius:6px;

  cursor:pointer;

  font-size:16px;

  font-weight:bold;

  margin-top:10px;
}

button:hover{

  background:#051d3b;
}


/* =====================================================
   COURSE COLORS
===================================================== */

.prelims-theme{

  border-top-color:#cf2e2e;
}

.prelims-theme .course-badge{

  background:#ffebee;

  color:#b71c1c;
}

.prelims-theme #login-button{

  background:#cf2e2e;
}

.prelims-theme #login-button:hover{

  background:#a92323;
}


.mains-theme{

  border-top-color:#147dcc;
}

.mains-theme .course-badge{

  background:#e3f2fd;

  color:#0d5e99;
}

.mains-theme #login-button{

  background:#147dcc;
}

.mains-theme #login-button:hover{

  background:#0d5e99;
}


/* =====================================================
   CHANGE PASSWORD LINK
===================================================== */

.switch-link{

  color:#147dcc;

  cursor:pointer;

  display:block;

  margin-top:20px;

  font-size:13px;

  font-weight:bold;
}

.switch-link:hover{

  text-decoration:underline;
}


/* =====================================================
   ALERTS
===================================================== */

.error-alert{

  color:#d32f2f;

  font-size:13px;

  font-weight:bold;

  margin-top:10px;

  display:none;

  background:#ffebee;

  padding:8px;

  border-radius:4px;

  border-left:4px solid #d32f2f;

  text-align:left;
}

.success-alert{

  color:#087f23;

  font-size:13px;

  font-weight:bold;

  margin-top:10px;

  display:none;

  background:#e8f5e9;

  padding:8px;

  border-radius:4px;

  border-left:4px solid #087f23;

  text-align:left;
}


/* =====================================================
   INVALID COURSE MESSAGE
===================================================== */

.invalid-course{

  color:#b71c1c;

  background:#ffebee;

  border-left:4px solid #d32f2f;

  padding:12px;

  border-radius:5px;

  font-size:13px;

  line-height:1.6;

  text-align:left;

  margin-top:10px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .mppsc-site-logo-bar{

    min-height:56px;

    padding:6px 10px;
  }

  .mppsc-site-logo-bar img{

    width:42px;

    height:42px;
  }

  .mppsc-site-name{

    font-size:15px;
  }

  .login-page{

    min-height:calc(100vh - 56px);

    padding:20px 10px 30px;
  }

  .login-container{

    padding:28px 20px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="mppsc-site-logo-bar">

  <img
    src="MPPSC-MCQ-Hub-Logo.png"
    alt="MPPSC MCQ Hub Logo"
  >

  <div class="mppsc-site-name">
    MPPSC MCQ Hub V14
  </div>

</div>


<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<div class="login-page">


  <!-- ===================================================
       LOGIN SECTION
  ==================================================== -->

  <div
    class="login-container"
    id="login-section"
  >

    <div class="logo-title">
      MPPSC MCQ Hub
    </div>

    <div class="sub-title">
      Paid Student Portal Login
    </div>


    <!-- COURSE BADGE -->

    <div
      class="course-badge"
      id="course-badge"
    >
      Course Login
    </div>


    <!-- =================================================
         INVALID COURSE MESSAGE
    ================================================== -->

    <div
      class="invalid-course"
      id="invalid-course"
      style="display:none;"
    >

      यह Student Login केवल Paid Course के माध्यम से
      खोलें।<br><br>

      <b>PRELIMS</b> के लिए PRELIMS Student Login खोलें।<br>

      <b>MAINS</b> के लिए MAINS Student Login खोलें।

    </div>


    <!-- =================================================
         USER ID
    ================================================== -->

    <div
      class="form-group"
      id="user-group"
    >

      <label for="login-user">
        यूजर आईडी (मोबाइल नंबर):
      </label>

      <input
        type="text"
        id="login-user"
        inputmode="numeric"
        maxlength="10"
        autocomplete="username"
        placeholder="10 अंकों का मोबाइल नंबर"
      >

    </div>


    <!-- =================================================
         PASSWORD
    ================================================== -->

    <div
      class="form-group"
      id="password-group"
    >

      <label for="login-pass">
        पासवर्ड:
      </label>

      <input
        type="password"
        id="login-pass"
        autocomplete="current-password"
        placeholder="अपना पासवर्ड दर्ज करें"
      >

    </div>


    <!-- =================================================
         ERROR
    ================================================== -->

    <div
      class="error-alert"
      id="login-error"
    ></div>


    <!-- =================================================
         LOGIN BUTTON
    ================================================== -->

    <button
      id="login-button"
      type="button"
      onclick="handleStudentLogin()"
    >
      लॉगिन करें
    </button>


    <!-- =================================================
         CHANGE PASSWORD
    ================================================== -->

    <span
      class="switch-link"
      onclick="toggleSections(false)"
    >
      🔐 पासवर्ड बदलें
    </span>

  </div>



  <!-- ===================================================
       CHANGE PASSWORD SECTION
  ==================================================== -->

  <div
    class="login-container"
    id="change-section"
    style="display:none;"
  >

    <div class="logo-title">
      पासवर्ड बदलें
    </div>

    <div class="sub-title">
      नया Permanent Password सेट करें
    </div>


    <!-- COURSE DISPLAY -->

    <div
      class="course-badge"
      id="change-course-badge"
    >
      Course
    </div>


    <!-- =================================================
         MOBILE
    ================================================== -->

    <div class="form-group">

      <label for="change-user">
        पंजीकृत मोबाइल नंबर:
      </label>

      <input
        type="text"
        id="change-user"
        inputmode="numeric"
        maxlength="10"
        placeholder="10 अंकों का मोबाइल नंबर"
      >

    </div>


    <!-- =================================================
         OLD PASSWORD
    ================================================== -->

    <div class="form-group">

      <label for="old-pass">
        पुराना पासवर्ड:
      </label>

      <input
        type="password"
        id="old-pass"
        placeholder="SMS वाला पासवर्ड"
      >

    </div>


    <!-- =================================================
         NEW PASSWORD
    ================================================== -->

    <div class="form-group">

      <label for="new-pass">
        नया पासवर्ड:
      </label>

      <input
        type="password"
        id="new-pass"
        placeholder="नया पासवर्ड"
      >

    </div>


    <!-- =================================================
         ERROR
    ================================================== -->

    <div
      class="error-alert"
      id="change-error"
    ></div>


    <!-- =================================================
         SUCCESS
    ================================================== -->

    <div
      class="success-alert"
      id="change-success"
    ></div>


    <!-- =================================================
         UPDATE BUTTON
    ================================================== -->

    <button
      type="button"
      onclick="handlePasswordChange()"
      style="background:#147dcc;"
    >
      Update Password
    </button>


    <!-- =================================================
         BACK LOGIN
    ================================================== -->

    <span
      class="switch-link"
      onclick="toggleSections(true)"
    >
      ⬅ वापस Login
    </span>

  </div>


</div>



<script>

"use strict";


/* =====================================================
   GET COURSE FROM URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


let requestedCourse =
  String(
    params.get("course") || ""
  )
  .trim()
  .toLowerCase();


/* =====================================================
   COURSE UI
===================================================== */

function updateCourseUI(){

  const loginSection =
    document.getElementById(
      "login-section"
    );

  const badge =
    document.getElementById(
      "course-badge"
    );

  const invalidCourse =
    document.getElementById(
      "invalid-course"
    );

  const userGroup =
    document.getElementById(
      "user-group"
    );

  const passwordGroup =
    document.getElementById(
      "password-group"
    );

  const loginButton =
    document.getElementById(
      "login-button"
    );

  const changeBadge =
    document.getElementById(
      "change-course-badge"
    );


  /* ===================================================
     INVALID / MISSING COURSE
  =================================================== */

  if(
    requestedCourse !== "prelims" &&
    requestedCourse !== "mains"
  ){

    badge.textContent =
      "Course Login";

    invalidCourse.style.display =
      "block";

    userGroup.style.display =
      "none";

    passwordGroup.style.display =
      "none";

    loginButton.style.display =
      "none";

    changeBadge.textContent =
      "Course Select करें";

    return;
  }


  /* ===================================================
     PRELIMS
  =================================================== */

  if(
    requestedCourse === "prelims"
  ){

    badge.textContent =
      "PRELIMS Student Login";

    changeBadge.textContent =
      "PRELIMS Password Change";

    loginSection.classList.add(
      "prelims-theme"
    );

    loginSection.classList.remove(
      "mains-theme"
    );
  }


  /* ===================================================
     MAINS
  =================================================== */

  if(
    requestedCourse === "mains"
  ){

    badge.textContent =
      "MAINS Student Login";

    changeBadge.textContent =
      "MAINS Password Change";

    loginSection.classList.add(
      "mains-theme"
    );

    loginSection.classList.remove(
      "prelims-theme"
    );
  }


  /* ===================================================
     SHOW LOGIN FIELDS
  =================================================== */

  invalidCourse.style.display =
    "none";

  userGroup.style.display =
    "block";

  passwordGroup.style.display =
    "block";

  loginButton.style.display =
    "block";
}


/* =====================================================
   INITIAL UI
===================================================== */

updateCourseUI();


/* =====================================================
   CLEAR SESSION
===================================================== */

function clearStudentSession(){

  sessionStorage.removeItem(
    "mppsc_student_authenticated"
  );

  sessionStorage.removeItem(
    "mppsc_student_course"
  );

  sessionStorage.removeItem(
    "mppsc_student_username"
  );
}


/* =====================================================
   LOGIN / CHANGE PASSWORD SWITCH
===================================================== */

function toggleSections(
  showLogin
){

  document.getElementById(
    "login-error"
  ).style.display =
    "none";

  document.getElementById(
    "change-error"
  ).style.display =
    "none";

  document.getElementById(
    "change-success"
  ).style.display =
    "none";


  document.getElementById(
    "login-section"
  ).style.display =
    showLogin
      ? "block"
      : "none";


  document.getElementById(
    "change-section"
  ).style.display =
    showLogin
      ? "none"
      : "block";

}


/* =====================================================
   GET STUDENTS
===================================================== */

function getUsers(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          "mppsc_students"
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  }

  catch(e){

    console.error(
      "Student database error:",
      e
    );

    return [];

  }

}


/* =====================================================
   STUDENT LOGIN
===================================================== */

function handleStudentLogin(){

  const user =
    document
      .getElementById(
        "login-user"
      )
      .value
      .trim();


  const pass =
    document
      .getElementById(
        "login-pass"
      )
      .value;


  const errorBox =
    document.getElementById(
      "login-error"
    );


  errorBox.style.display =
    "none";


  /* ===================================================
     COURSE CHECK
  =================================================== */

  if(
    requestedCourse !== "prelims" &&
    requestedCourse !== "mains"
  ){

    errorBox.textContent =
      "❌ यह Login Page किसी Paid Course से नहीं जुड़ा है।";

    errorBox.style.display =
      "block";

    return;
  }


  /* ===================================================
     EMPTY CHECK
  =================================================== */

  if(
    !user ||
    !pass
  ){

    errorBox.textContent =
      "कृपया मोबाइल नंबर और पासवर्ड भरें!";

    errorBox.style.display =
      "block";

    return;
  }


  /* ===================================================
     MOBILE NUMBER CHECK
  =================================================== */

  if(
    !/^[0-9]{10}$/.test(user)
  ){

    errorBox.textContent =
      "❌ कृपया 10 अंकों का सही मोबाइल नंबर दर्ज करें।";

    errorBox.style.display =
      "block";

    return;
  }


  /* ===================================================
     CLEAR OLD SESSION
  =================================================== */

  clearStudentSession();


  /* ===================================================
     GET USERS
  =================================================== */

  const users =
    getUsers();


  /* ===================================================
     FIND USER

     COURSE + USERNAME + PASSWORD
     तीनों match होना जरूरी है।
  =================================================== */

  const foundUser =
    users.find(
      function(u){

        const username =
          String(
            u.username || ""
          )
          .trim();


        const password =
          String(
            u.password || ""
          );


        const type =
          String(
            u.type || ""
          )
          .trim()
          .toLowerCase();


        return (

          username === user &&

          password === pass &&

          type === requestedCourse &&

          u.active !== false

        );

      }
    );


  /* ===================================================
     LOGIN FAILED
  =================================================== */

  if(!foundUser){

    errorBox.textContent =
      "❌ गलत " +
      (
        requestedCourse === "mains"
          ? "MAINS"
          : "PRELIMS"
      ) +
      " मोबाइल नंबर या पासवर्ड!";

    errorBox.style.display =
      "block";

    return;
  }


  /* ===================================================
     LOGIN SUCCESS
  =================================================== */

  sessionStorage.setItem(
    "mppsc_student_authenticated",
    "true"
  );


  sessionStorage.setItem(
    "mppsc_student_course",
    requestedCourse
  );


  sessionStorage.setItem(
    "mppsc_student_username",
    String(
      foundUser.username
    )
  );


  /* ===================================================
     REDIRECT
  =================================================== */

  if(
    requestedCourse === "mains"
  ){

    window.location.replace(
      "mains-600.html"
    );

  }

  else{

    window.location.replace(
      "prelims.html"
    );

  }

}


/* =====================================================
   CHANGE PASSWORD
===================================================== */

function handlePasswordChange(){

  const user =
    document
      .getElementById(
        "change-user"
      )
      .value
      .trim();


  const oldPass =
    document
      .getElementById(
        "old-pass"
      )
      .value;


  const newPass =
    document
      .getElementById(
        "new-pass"
      )
      .value;


  const errorBox =
    document.getElementById(
      "change-error"
    );


  const successBox =
    document.getElementById(
      "change-success"
    );


  errorBox.style.display =
    "none";

  successBox.style.display =
    "none";


  /* ===================================================
     COURSE CHECK
  =================================================== */

  if(
    requestedCourse !== "prelims" &&
    requestedCourse !== "mains"
  ){

    errorBox.textContent =
      "❌ Course निर्धारित नहीं है।";

    errorBox.style.display =
      "block";

    return;
  }


  /* ===================================================
     EMPTY CHECK
  =================================================== */

  if(
    !user ||
    !oldPass ||
    !newPass
  ){

    errorBox.textContent =
      "कृपया सभी विवरण भरें!";

    errorBox.style.display =
      "block";

    return;
  }


  /* ===================================================
     MOBILE CHECK
  =================================================== */

  if(
    !/^[0-9]{10}$/.test(user)
  ){

    errorBox.textContent =
      "❌ कृपया 10 अंकों का सही मोबाइल नंबर दर्ज करें।";

    errorBox.style.display =
      "block";

    return;
  }


  /* ===================================================
     NEW PASSWORD LENGTH
  =================================================== */

  if(
    newPass.length < 4
  ){

    errorBox.textContent =
      "नया पासवर्ड कम से कम 4 अक्षरों/अंकों का होना चाहिए!";

    errorBox.style.display =
      "block";

    return;
  }


  /* ===================================================
     GET USERS
  =================================================== */

  const users =
    getUsers();


  /* ===================================================
     FIND USER

     COURSE भी match होना जरूरी है।
  =================================================== */

  const userIndex =
    users.findIndex(
      function(u){

        const username =
          String(
            u.username || ""
          )
          .trim();


        const password =
          String(
            u.password || ""
          );


        const type =
          String(
            u.type || ""
          )
          .trim()
          .toLowerCase();


        return (

          username === user &&

          password === oldPass &&

          type === requestedCourse &&

          u.active !== false

        );

      }
    );


  /* ===================================================
     USER NOT FOUND
  =================================================== */

  if(
    userIndex === -1
  ){

    errorBox.textContent =
      "❌ मोबाइल नंबर, पुराने पासवर्ड या Course का मिलान नहीं हुआ!";

    errorBox.style.display =
      "block";

    return;
  }


  /* ===================================================
     UPDATE PASSWORD
  =================================================== */

  users[userIndex].password =
    newPass;


  localStorage.setItem(
    "mppsc_students",
    JSON.stringify(users)
  );


  /* ===================================================
     SUCCESS
  =================================================== */

  successBox.textContent =
    (
      requestedCourse === "mains"
        ? "MAINS"
        : "PRELIMS"
    ) +
    " का पासवर्ड सफलतापूर्वक बदल दिया गया।";


  successBox.style.display =
    "block";


  /* ===================================================
     CLEAR OLD PASSWORD
  =================================================== */

  document.getElementById(
    "old-pass"
  ).value = "";


  document.getElementById(
    "new-pass"
  ).value = "";


  /* ===================================================
     GO BACK LOGIN
  =================================================== */

  setTimeout(
    function(){

      toggleSections(true);

    },
    1500
  );

}


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&

      document.getElementById(
        "login-section"
      ).style.display !== "none"
    ){

      handleStudentLogin();

    }

  }
);

</script>

</body>
</html>
