<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MPPSC MCQ Hub - Student Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f5fb;
      min-height: 100vh;
      color: #123;
    }

    /* HEADER */
    .header {
      height: 75px;
      background: #124fa3;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-weight: bold;
      font-size: 15px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 10px;
      border: 2px solid white;
      background: #c00;
    }

    /* LOGIN AREA */
    .page {
      min-height: calc(100vh - 75px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 330px;
      background: white;
      border-radius: 10px;
      padding: 22px 20px 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
      border-top: 4px solid #123b70;
    }

    .title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #123b70;
      margin-bottom: 3px;
    }

    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-bottom: 14px;
    }

    /* COURSE BADGE */
    .course-badge {
      width: fit-content;
      margin: 0 auto 15px;
      padding: 5px 13px;
      border-radius: 20px;
      background: #eef4ff;
      color: #123b70;
      font-size: 12px;
      font-weight: bold;
    }

    .course-badge.prelims {
      color: #d62828;
      background: #fff0f0;
    }

    .course-badge.mains {
      color: #1677bd;
      background: #eef7ff;
    }

    .course-heading {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    /* FORM */
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #222;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #9aa9bd;
      border-radius: 5px;
      background: #eaf2ff;
      font-size: 14px;
      margin-bottom: 13px;
      outline: none;
    }

    input:focus {
      border-color: #1465bd;
      background: white;
    }

    .login-btn {
      width: 100%;
      border: none;
      border-radius: 5px;
      padding: 11px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 3px;
    }

    .login-btn.prelims {
      background: #d62828;
    }

    .login-btn.prelims:hover {
      background: #b91f1f;
    }

    .login-btn.mains {
      background: #167fc5;
    }

    .login-btn.mains:hover {
      background: #106ba7;
    }

    .error {
      display: none;
      background: #ffe7e7;
      border-left: 4px solid #d62828;
      color: #b00000;
      padding: 10px;
      margin-bottom: 13px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.5;
    }

    .success {
      display: none;
      background: #e7f8ec;
      border-left: 4px solid #199447;
      color: #11652f;
      padding: 10px;
      margin-bottom: 13px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.5;
    }

    .forgot {
      text-align: center;
      margin-top: 13px;
      font-size: 12px;
      color: #086bb5;
    }

    /* INVALID COURSE */
    .invalid-course {
      text-align: center;
      color: #b00000;
      background: #fff0f0;
      border: 1px solid #f1b5b5;
      padding: 15px;
      border-radius: 7px;
      font-size: 13px;
      line-height: 1.6;
    }

    .back-btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: #124fa3;
      color: white;
      padding: 10px;
      border-radius: 5px;
      margin-top: 12px;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .header {
        height: 65px;
      }

      .logo {
        width: 42px;
        height: 42px;
      }

      .page {
        min-height: calc(100vh - 65px);
      }

      .login-box {
        max-width: 350px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <img
      src="MPPSC-MCQ-Hub-Logo.png"
      class="logo"
      onerror="this.style.display='none'"
      alt="MPPSC Logo"
    >
    <span>MPPSC MCQ Hub V14</span>
  </div>


  <!-- PAGE -->
  <div class="page">

    <div class="login-box">

      <div class="title">
        MPPSC MCQ Hub
      </div>

      <div class="subtitle">
        Paid Student Portal Login
      </div>


      <!-- LOGIN FORM -->
      <div id="loginSection">

        <div id="courseBadge" class="course-badge">
          Course Login
        </div>

        <div id="courseHeading" class="course-heading">
          Login
        </div>

        <div id="errorBox" class="error"></div>

        <div id="successBox" class="success"></div>


        <form id="loginForm">

          <label for="username">
            यूजर आईडी (मोबाइल नंबर):
          </label>

          <input
            type="text"
            id="username"
            autocomplete="username"
            placeholder="अपना मोबाइल नंबर डालें"
            required
          >


          <label for="password">
            पासवर्ड:
          </label>

          <input
            type="password"
            id="password"
            autocomplete="current-password"
            placeholder="पासवर्ड डालें"
            required
          >


          <button
            type="submit"
            id="loginButton"
            class="login-btn"
          >
            Login
          </button>

        </form>


        <div class="forgot">
          🔐 पासवर्ड भूलें
        </div>

      </div>


      <!-- INVALID COURSE -->
      <div id="invalidSection" style="display:none;">

        <div class="invalid-course">
          यह Student Login केवल Paid Course के माध्यम से खोला जा सकता है।<br><br>

          कृपया Homepage पर वापस जाकर अपना सही Paid Course चुनें।
        </div>

        <a href="index.html" class="back-btn">
          🏠 Homepage पर जाएँ
        </a>

      </div>

    </div>

  </div>


<script>

  /* =========================================================
     COURSE DETECT
     ========================================================= */

  const params = new URLSearchParams(window.location.search);

  const course = (params.get("course") || "").toLowerCase().trim();


  const courseBadge = document.getElementById("courseBadge");
  const courseHeading = document.getElementById("courseHeading");
  const loginButton = document.getElementById("loginButton");

  const loginSection = document.getElementById("loginSection");
  const invalidSection = document.getElementById("invalidSection");

  const errorBox = document.getElementById("errorBox");
  const successBox = document.getElementById("successBox");


  /* =========================================================
     COURSE UI
     ========================================================= */

  if (course === "prelims") {

    courseBadge.textContent = "PRELIMS Paid Course";
    courseBadge.className = "course-badge prelims";

    courseHeading.textContent = "PRELIMS Login";

    loginButton.textContent = "PRELIMS Login";
    loginButton.className = "login-btn prelims";

  }

  else if (course === "mains") {

    courseBadge.textContent = "MAINS Paid Course";
    courseBadge.className = "course-badge mains";

    courseHeading.textContent = "MAINS Login";

    loginButton.textContent = "MAINS Login";
    loginButton.className = "login-btn mains";

  }

  else {

    /*
      Direct student-login.html खोलने पर
      कोई PRELIMS/MAINS option नहीं दिखेगा।
    */

    loginSection.style.display = "none";
    invalidSection.style.display = "block";

  }


  /* =========================================================
     LOGIN
     ========================================================= */

  document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    if (course !== "prelims" && course !== "mains") {
      return;
    }


    const username =
      document.getElementById("username").value.trim();

    const password =
      document.getElementById("password").value;


    errorBox.style.display = "none";
    successBox.style.display = "none";


    if (!username || !password) {

      errorBox.textContent =
        "कृपया यूजर आईडी और पासवर्ड दोनों भरें।";

      errorBox.style.display = "block";

      return;
    }


    /* =======================================================
       STUDENT DATABASE
       localStorage key:
       mppsc_students
       ======================================================= */

    let students = [];

    try {

      students =
        JSON.parse(
          localStorage.getItem("mppsc_students") || "[]"
        );

      if (!Array.isArray(students)) {
        students = [];
      }

    } catch (error) {

      students = [];

    }


    /* =======================================================
       FIND STUDENT
       ======================================================= */

    const student = students.find(function(s) {

      if (!s) return false;

      const studentUsername =
        String(s.username || "").trim();

      const studentPassword =
        String(s.password || "");

      const studentType =
        String(s.type || "").toLowerCase().trim();


      return (

        studentUsername === username &&

        studentPassword === password &&

        studentType === course &&

        s.active !== false

      );

    });


    /* =======================================================
       INVALID LOGIN
       ======================================================= */

    if (!student) {

      errorBox.textContent =
        course === "prelims"
          ? "PRELIMS की यूजर आईडी या पासवर्ड गलत है। कृपया PRELIMS Course का ही Login इस्तेमाल करें।"
          : "MAINS की यूजर आईडी या पासवर्ड गलत है। कृपया MAINS Course का ही Login इस्तेमाल करें।";

      errorBox.style.display = "block";

      return;
    }


    /* =======================================================
       SAVE SESSION
       ======================================================= */

    localStorage.setItem(
      "mppsc_student_authenticated",
      "true"
    );

    localStorage.setItem(
      "mppsc_student_course",
      course
    );

    localStorage.setItem(
      "mppsc_student_username",
      username
    );

    localStorage.setItem(
      "mppsc_student_session",
      JSON.stringify({
        username: username,
        course: course,
        loginTime: new Date().toISOString()
      })
    );


    /* =======================================================
       SUCCESS
       ======================================================= */

    successBox.textContent =
      course === "prelims"
        ? "PRELIMS Login सफल। PRELIMS Course खोला जा रहा है..."
        : "MAINS Login सफल। MAINS Course खोला जा रहा है...";

    successBox.style.display = "block";


    /* =======================================================
       COURSE-SPECIFIC REDIRECT
       ======================================================= */

    setTimeout(function() {

      if (course === "prelims") {

        window.location.href = "prelims.html";

      }

      else if (course === "mains") {

        window.location.href = "mains-600.html";

      }

    }, 500);

  });

</script>

</body>
</html>
