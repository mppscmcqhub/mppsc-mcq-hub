<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MPPSC MCQ Hub - Student Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f3f7fd;
    min-height:100vh;
}

/* ================= HEADER ================= */

.header{
    height:52px;
    background:#1452a4;
    color:white;
    display:flex;
    align-items:center;
    padding:0 14px;
    font-weight:bold;
    font-size:14px;
}

.logo{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#d71920;
    border:2px solid white;
    margin-right:8px;
}

/* ================= CENTER ================= */

.login-wrapper{
    min-height:calc(100vh - 52px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* ================= CARD ================= */

.login-card{
    width:100%;
    max-width:330px;
    background:white;
    border-radius:8px;
    padding:20px;
    box-shadow:0 5px 18px rgba(0,0,0,0.12);
    border-top:3px solid #123d78;
}

/* ================= TITLE ================= */

.title{
    text-align:center;
    color:#123d78;
    font-size:18px;
    font-weight:bold;
    margin-bottom:3px;
}

.subtitle{
    text-align:center;
    color:#666;
    font-size:11px;
    margin-bottom:15px;
}

/* ================= COURSE ================= */

.course-badge{
    display:block;
    width:max-content;
    margin:0 auto 15px;
    padding:6px 14px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
}

.course-badge.prelims{
    background:#ffe5e5;
    color:#d92727;
}

.course-badge.mains{
    background:#e1efff;
    color:#147ac2;
}

/* ================= LABEL ================= */

label{
    display:block;
    font-size:13px;
    margin-bottom:5px;
    color:#333;
}

/* ================= INPUT ================= */

input{
    width:100%;
    padding:10px;
    border:1px solid #b9c9df;
    border-radius:5px;
    background:#eef4fd;
    margin-bottom:13px;
    font-size:14px;
    outline:none;
}

input:focus{
    border-color:#1452a4;
}

/* ================= LOGIN BUTTON ================= */

.login-btn{
    width:100%;
    border:none;
    padding:11px;
    border-radius:5px;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn.prelims{
    background:#d92727;
}

.login-btn.mains{
    background:#167fc4;
}

.login-btn:disabled{
    background:#ccc !important;
    cursor:not-allowed;
}

/* ================= MESSAGE ================= */

.message{
    display:none;
    margin-bottom:12px;
    padding:10px;
    border-radius:5px;
    font-size:12px;
    line-height:1.5;
}

.message.error{
    display:block;
    background:#ffe9e9;
    color:#c62828;
    border:1px solid #ffb5b5;
}

.message.success{
    display:block;
    background:#e8f7e8;
    color:#237a23;
    border:1px solid #a8dca8;
}

/* ================= HOME ================= */

.home-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#1452a4;
    color:white;
    padding:10px;
    border-radius:5px;
    margin-top:12px;
    font-size:13px;
    font-weight:bold;
}

/* ================= LOADING ================= */

.loading{
    opacity:.7;
    pointer-events:none;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <div class="logo"></div>

    <div>
        MPPSC MCQ Hub V14
    </div>

</div>


<div class="login-wrapper">

    <div class="login-card">

        <div class="title">
            MPPSC MCQ Hub
        </div>

        <div class="subtitle">
            Paid Student Portal Login
        </div>


        <!-- COURSE BADGE -->
        <div id="courseBadge" class="course-badge">
            Course Login
        </div>


        <!-- MESSAGE -->
        <div id="message" class="message"></div>


        <!-- LOGIN FORM -->
        <form id="loginForm">

            <label>
                मोबाइल नंबर:
            </label>

            <input
                type="tel"
                id="mobile"
                placeholder="मोबाइल नंबर दर्ज करें"
                maxlength="10"
                inputmode="numeric"
                autocomplete="username"
                required
            >


            <label>
                पासवर्ड:
            </label>

            <input
                type="password"
                id="password"
                placeholder="पासवर्ड दर्ज करें"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                id="loginButton"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <a href="index.html" class="home-btn">
            🏠 Homepage पर जाएँ
        </a>

    </div>

</div>


<script>

/* ==================================================
   COURSE DETECTION
================================================== */

const params = new URLSearchParams(
    window.location.search
);

const course = params.get("course");


/* ==================================================
   ELEMENTS
================================================== */

const badge =
    document.getElementById("courseBadge");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const loginForm =
    document.getElementById("loginForm");

const mobileInput =
    document.getElementById("mobile");

const passwordInput =
    document.getElementById("password");


/* ==================================================
   MESSAGE FUNCTION
================================================== */

function showMessage(text, type){

    message.className =
        "message " + type;

    message.textContent = text;
}


/* ==================================================
   INVALID COURSE
================================================== */

if(course !== "prelims" && course !== "mains"){

    /*
       Direct student-login.html खोलने पर
       कोई course login नहीं दिखेगा।
    */

    badge.textContent =
        "Course Select करें";

    loginButton.disabled = true;

    showMessage(
        "कृपया Homepage से PRELIMS या MAINS Paid Course चुनकर Login करें।",
        "error"
    );

}


/* ==================================================
   PRELIMS
================================================== */

if(course === "prelims"){

    badge.textContent =
        "PRELIMS Login";

    badge.className =
        "course-badge prelims";

    loginButton.textContent =
        "PRELIMS Login";

    loginButton.className =
        "login-btn prelims";

}


/* ==================================================
   MAINS
================================================== */

if(course === "mains"){

    badge.textContent =
        "MAINS Login";

    badge.className =
        "course-badge mains";

    loginButton.textContent =
        "MAINS Login";

    loginButton.className =
        "login-btn mains";

}


/* ==================================================
   LOGIN
================================================== */

loginForm.addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        /* Course जरूरी है */

        if(course !== "prelims" &&
           course !== "mains"){

            showMessage(
                "कृपया पहले Homepage से अपना Course चुनें।",
                "error"
            );

            return;
        }


        const mobile =
            mobileInput.value.trim();

        const password =
            passwordInput.value.trim();


        /* Mobile validation */

        if(!/^[0-9]{10}$/.test(mobile)){

            showMessage(
                "कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें।",
                "error"
            );

            return;
        }


        /* Password validation */

        if(!password){

            showMessage(
                "कृपया पासवर्ड दर्ज करें।",
                "error"
            );

            return;
        }


        /* Loading */

        loginButton.disabled = true;

        loginButton.textContent =
            "Login हो रहा है...";


        try{

            /*
            ==================================================
            STUDENT DATABASE
            ==================================================

            Admin panel में students इसी key पर
            save किए गए हैं:
            
            mppsc_students
            */

            const students =
                JSON.parse(
                    localStorage.getItem(
                        "mppsc_students"
                    ) || "[]"
                );


            /*
            ==================================================
            EXACT COURSE LOGIN
            ==================================================

            PRELIMS:
            type = "prelims"

            MAINS:
            type = "mains"

            इसलिए दूसरे course का password
            दूसरे course में काम नहीं करेगा।
            */

            const student =
                students.find(function(s){

                    return (

                        String(s.username || "").trim()
                        === mobile

                        &&

                        String(s.password || "")
                        === password

                        &&

                        String(s.type || "")
                        .toLowerCase()
                        === course

                        &&

                        s.active !== false

                    );

                });


            /* ===============================
               WRONG LOGIN
            =============================== */

            if(!student){

                showMessage(
                    course === "prelims"
                    ? "PRELIMS का मोबाइल नंबर या पासवर्ड गलत है।"
                    : "MAINS का मोबाइल नंबर या पासवर्ड गलत है।",
                    "error"
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    course === "prelims"
                    ? "PRELIMS Login"
                    : "MAINS Login";

                return;
            }


            /* ==================================================
               CORRECT LOGIN
            ================================================== */

            const session = {

                username:
                    student.username,

                mobile:
                    student.username,

                name:
                    student.name || "",

                type:
                    course,

                course:
                    course,

                authenticated:
                    true,

                loginTime:
                    new Date().toISOString()

            };


            /*
            ==================================================
            SESSION SAVE
            ==================================================
            */

            sessionStorage.setItem(
                "mppsc_student_session",
                JSON.stringify(session)
            );

            sessionStorage.setItem(
                "mppsc_student_authenticated",
                "true"
            );

            sessionStorage.setItem(
                "paidStudentCourse",
                course
            );

            sessionStorage.setItem(
                "studentMobile",
                mobile
            );


            /* ===============================
               SUCCESS
            =============================== */

            showMessage(
                course === "prelims"
                ? "PRELIMS Login सफल।"
                : "MAINS Login सफल।",
                "success"
            );


            /*
            ==================================================
            COURSE-SPECIFIC REDIRECT
            ==================================================
            */

            setTimeout(function(){

                if(course === "prelims"){

                    window.location.href =
                        "prelims.html";

                }
                else if(course === "mains"){

                    window.location.href =
                        "mains-600.html";

                }

            }, 500);


        }
        catch(error){

            console.error(
                "Student Login Error:",
                error
            );


            showMessage(
                "Login में तकनीकी समस्या हुई। कृपया दोबारा प्रयास करें।",
                "error"
            );


            loginButton.disabled = false;

            loginButton.textContent =
                course === "prelims"
                ? "PRELIMS Login"
                : "MAINS Login";

        }

    }
);

</script>

</body>
</html>
