
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub - Unit 1 Test 2</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f0f2f5;color:#222}
header{background:#185795;color:white;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-size:20px;font-weight:bold}
.actions{display:flex;gap:8px;align-items:center}
button{border:0;border-radius:5px;padding:10px 14px;cursor:pointer;font-weight:bold;font-size:14px}
.timer{background:#c71919;color:white;font-size:18px;min-width:85px;text-align:center}
.back{background:#087cf0;color:white}
.pdf{background:#ffc107;color:#111}
.submit{background:#209d49;color:white}
main{max-width:1100px;margin:16px auto;padding:0 12px}
.heading,.question,.result{background:white;border:1px solid #ddd;border-radius:6px;padding:16px;margin-bottom:14px}
.heading h2{margin:0;font-size:21px}
#notice{background:#fff0c2;color:#704d00;padding:16px;border-radius:6px;margin-bottom:14px;line-height:1.7}
.question h3{font-size:17px;line-height:1.65;margin:0 0 12px}
.option{display:block;padding:11px;margin:7px 0;border:1px solid #ddd;border-radius:5px;cursor:pointer;line-height:1.5}
.option:hover{background:#f4f8ff}
.option input{margin-right:8px}
.option.correct{background:#d8f5df;border-color:#249544}
.option.wrong{background:#ffe0e0;border-color:#d22}
.explanation{display:none;background:#f1f7ff;border-left:4px solid #185795;padding:12px;margin-top:12px;line-height:1.7}
.result{display:none;line-height:1.8}
.bottom-actions{text-align:center;margin:20px 0}
#bankError{display:none}
@media print{
header,.bottom-actions{display:none!important}
body{background:white}
main{max-width:none}
.question{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="brand">🔴 MPPSC MCQ Hub</div>
  <div class="actions">
    <div class="timer" id="timer">60:00</div>
    <button class="back" onclick="goBack()">← Back</button>
    <button class="pdf" onclick="window.print()">🖨 PDF / Print</button>
  </div>
</header>

<main>
  <section class="heading">
    <h2>Unit 1 — Test 2</h2>
    <p>MPPSC Prelims Practice Test | 50 Questions | समय: 60 मिनट</p>
  </section>

  <div id="notice">
    प्रश्न लोड किए जा रहे हैं... / Loading questions...
  </div>

  <div id="questions"></div>

  <section id="result" class="result"></section>

  <div class="bottom-actions">
    <button class="back" onclick="goBack()">← Back</button>
    <button class="submit" id="submitBtn" onclick="submitTest()">✓ Submit Test</button>
  </div>
</main>

<!-- questionBank.js का सही path -->
<script src="../../../questionBank.js"></script>

<script>
(function(){
  const notice = document.getElementById("notice");
  const container = document.getElementById("questions");
  const bank = window.questionBank;
  const questions = bank && bank.unit1 && bank.unit1.test2;

  if (!Array.isArray(questions) || questions.length === 0) {
    notice.innerHTML =
      "<strong>प्रश्न नहीं मिले!</strong><br>" +
      "questionBank.js में window.questionBank.unit1.test2 का डेटा नहीं मिला।<br>" +
      "50 प्रश्नों वाली JavaScript कोडिंग को index.html में नहीं, मुख्य questionBank.js फ़ाइल में रखें।";
    return;
  }

  notice.textContent = "सभी प्रश्नों के उत्तर चुनें। Submit Test दबाने पर स्कोर और व्याख्याएँ दिखाई देंगी।";
  const letters = ["A","B","C","D"];
  let submitted = false;

  questions.forEach(function(q, i){
    const card = document.createElement("section");
    card.className = "question";
    const title = document.createElement("h3");
    title.textContent = (i + 1) + ". " + q.question;
    card.appendChild(title);

    (q.options || []).forEach(function(option, j){
      const label = document.createElement("label");
      label.className = "option";
      const input = document.createElement("input");
      input.type = "radio";
      input.name = "question_" + i;
      input.value = letters[j];
      const text = document.createElement("span");
      text.textContent = option;
      label.appendChild(input);
      label.appendChild(text);
      card.appendChild(label);
    });

    const exp = document.createElement("div");
    exp.className = "explanation";
    exp.id = "explanation_" + i;
    exp.textContent = "व्याख्या / Explanation: " + (q.explanation || "व्याख्या उपलब्ध नहीं है।");
    card.appendChild(exp);
    container.appendChild(card);
  });

  window.submitTest = function(){
    if (submitted) return;
    submitted = true;
    clearInterval(timerInterval);

    let score = 0;
    let attempted = 0;

    questions.forEach(function(q, i){
      const card = container.children[i];
      const selected = card.querySelector('input[name="question_' + i + '"]:checked');
      const correct = String(q.answer || "").trim().charAt(0).toUpperCase();

      if (selected) {
        attempted++;
        if (selected.value === correct) score++;
      }

      card.querySelectorAll(".option").forEach(function(label){
        const input = label.querySelector("input");
        input.disabled = true;
        if (input.value === correct) label.classList.add("correct");
        if (selected && input === selected && selected.value !== correct) {
          label.classList.add("wrong");
        }
      });

      document.getElementById("explanation_" + i).style.display = "block";
    });

    const result = document.getElementById("result");
    result.style.display = "block";
    result.innerHTML =
      "<h2>आपका परिणाम / Your Result</h2>" +
      "<p><strong>कुल प्रश्न / Total Questions:</strong> " + questions.length + "</p>" +
      "<p><strong>उत्तर दिए / Attempted:</strong> " + attempted + "</p>" +
      "<p><strong>सही उत्तर / Correct:</strong> " + score + "</p>" +
      "<p><strong>गलत या छोड़े / Wrong or Unanswered:</strong> " + (questions.length - score) + "</p>" +
      "<h3>स्कोर / Score: " + score + " / " + questions.length + "</h3>";

    document.getElementById("submitBtn").disabled = true;
    result.scrollIntoView({behavior:"smooth"});
  };

  let remaining = 60 * 60;
  const timerDisplay = document.getElementById("timer");
  const timerInterval = setInterval(function(){
    if (submitted) return;
    remaining--;
    const min = Math.floor(remaining / 60);
    const sec = remaining % 60;
    timerDisplay.textContent =
      String(min).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
    if (remaining <= 0) {
      window.submitTest();
      alert("समय समाप्त! आपका टेस्ट सबमिट कर दिया गया है।");
    }
  }, 1000);

  window.goBack = function(){
    if (history.length > 1) history.back();
    else location.href = "../../../index.html";
  };
})();
</script>
</body>
</html>
