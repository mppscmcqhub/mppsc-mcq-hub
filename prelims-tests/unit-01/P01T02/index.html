
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPPSC MCQ Hub - Unit 1 Test 2</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f0f2f5;color:#222}
header{background:#185795;color:white;min-height:58px;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:19px}
.logo{width:36px;height:36px;border-radius:50%;object-fit:contain;background:white;border:2px solid #ddd}
.fallback{display:none;width:36px;height:36px;border-radius:50%;background:#d71920;color:white;align-items:center;justify-content:center;font-weight:bold}
.actions{display:flex;align-items:center;gap:7px}
button{border:0;border-radius:5px;padding:10px 13px;cursor:pointer;font-weight:bold}
.timer{background:#c71919;color:white;min-width:74px;text-align:center;padding:7px;font-weight:bold}
.back{background:#087cf0;color:white}
.pdf{background:#ffc107;color:#111}
.submit{background:#209d49;color:white}
main{max-width:1100px;margin:14px auto;padding:0 12px}
.heading,.question,.result{background:white;border:1px solid #ddd;border-radius:6px;padding:14px;margin-bottom:12px}
.heading h2{font-size:21px;margin:0 0 8px}
.heading p{margin:0;line-height:1.6}
#notice{display:none;background:#fff0c2;color:#704d00;border-radius:5px;padding:12px;margin-bottom:12px;line-height:1.6}
.question h3{font-size:17px;line-height:1.65;margin:0 0 12px}
.option{display:block;padding:10px;margin:7px 0;border:1px solid #ddd;border-radius:5px;cursor:pointer;line-height:1.55}
.option:hover{background:#f4f8ff}
.option input{margin-right:8px}
.correct{background:#d8f5df!important;border-color:#249544!important}
.wrong{background:#ffe0e0!important;border-color:#d22!important}
.explanation{display:none;background:#f1f7ff;border-left:4px solid #185795;padding:12px;margin-top:10px;line-height:1.7}
.result{display:none;line-height:1.8}
.bottom{text-align:center;padding:8px 0 18px}
@media(max-width:520px){
 .brand{font-size:16px}
 header{padding:9px}
 button{padding:9px}
 .heading h2{font-size:19px}
}
@media print{
 header,.bottom{display:none!important}
 body{background:white}
 main{max-width:none}
 .question{break-inside:avoid}
 .explanation{display:block!important}
}
</style>
</head>

<body>
<header>
  <div class="brand">
    <img class="logo" src="../../../mppsc-logo.jpg" alt="MPPSC Logo"
      onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'">
    <span class="fallback">M</span>
    <span>MPPSC MCQ Hub</span>
  </div>
  <div class="actions">
    <span class="timer" id="timer">60:00</span>
    <button class="back" onclick="goBack()">← Back</button>
    <button class="pdf" onclick="window.print()">▣ PDF / Print</button>
  </div>
</header>

<main>
  <section class="heading">
    <h2>Unit 1 — Test 2</h2>
    <p>MPPSC Prelims Practice Test | 50 Questions | समय: 60 मिनट</p>
  </section>

  <div id="notice"></div>
  <div id="questions"></div>
  <section id="result" class="result"></section>

  <div class="bottom" id="bottom">
    <button class="back" onclick="goBack()">← Back</button>
    <button class="submit" id="submitBtn" onclick="submitTest()">✓ Submit Test</button>
  </div>
</main>

<script src="../../../questionBank.js"></script>

<script>
(function(){
  const notice=document.getElementById("notice");
  const container=document.getElementById("questions");
  const bank=window.questionBank;
  const questions=bank && bank.unit1 && bank.unit1.test2;
  let submitted=false;
  let timerInterval;

  if(!Array.isArray(questions)||questions.length===0){
    notice.style.display="block";
    notice.innerHTML=
      "<strong>प्रश्नों का डेटा नहीं मिला।</strong><br>"+
      "मुख्य questionBank.js फ़ाइल में window.questionBank.unit1.test2 के अंदर प्रश्न जोड़ें।";
    document.getElementById("bottom").style.display="none";
    return;
  }

  notice.style.display="none";

  const letters=["A","B","C","D"];

  questions.forEach(function(q,i){
    const card=document.createElement("section");
    card.className="question";

    const title=document.createElement("h3");
    title.textContent=(i+1)+". "+q.question;
    card.appendChild(title);

    (q.options||[]).forEach(function(opt,j){
      const label=document.createElement("label");
      label.className="option";

      const input=document.createElement("input");
      input.type="radio";
      input.name="question_"+i;
      input.value=letters[j];

      const span=document.createElement("span");
      span.textContent=opt;

      label.appendChild(input);
      label.appendChild(span);
      card.appendChild(label);
    });

    const explanation=document.createElement("div");
    explanation.className="explanation";
    explanation.id="explanation_"+i;
    explanation.textContent="व्याख्या / Explanation: "+(q.explanation||"व्याख्या उपलब्ध नहीं है।");
    card.appendChild(explanation);
    container.appendChild(card);
  });

  window.submitTest=function(){
    if(submitted)return;
    submitted=true;
    clearInterval(timerInterval);

    let score=0,attempted=0;

    questions.forEach(function(q,i){
      const card=container.children[i];
      const selected=card.querySelector('input[name="question_'+i+'"]:checked');
      const correct=String(q.answer||"").trim().charAt(0).toUpperCase();

      if(selected){
        attempted++;
        if(selected.value===correct)score++;
      }

      card.querySelectorAll(".option").forEach(function(label){
        const input=label.querySelector("input");
        input.disabled=true;
        if(input.value===correct)label.classList.add("correct");
        if(selected&&input===selected&&selected.value!==correct)
          label.classList.add("wrong");
      });

      document.getElementById("explanation_"+i).style.display="block";
    });

    const result=document.getElementById("result");
    result.style.display="block";
    result.innerHTML=
      "<h2>परिणाम / Your Result</h2>"+
      "<p>कुल प्रश्न / Total Questions: "+questions.length+"</p>"+
      "<p>उत्तर दिए / Attempted: "+attempted+"</p>"+
      "<p>सही उत्तर / Correct: "+score+"</p>"+
      "<p>गलत या छोड़े / Wrong or Unanswered: "+(questions.length-score)+"</p>"+
      "<h3>स्कोर / Score: "+score+" / "+questions.length+"</h3>";

    document.getElementById("submitBtn").disabled=true;
    result.scrollIntoView({behavior:"smooth"});
  };

  let remaining=3600;
  timerInterval=setInterval(function(){
    if(submitted)return;
    remaining--;
    document.getElementById("timer").textContent=
      String(Math.floor(remaining/60)).padStart(2,"0")+":"+
      String(remaining%60).padStart(2,"0");

    if(remaining<=0){
      window.submitTest();
      alert("समय समाप्त! टेस्ट सबमिट हो गया।");
    }
  },1000);

  window.goBack=function(){
    if(history.length>1)history.back();
    else location.href="../../../index.html";
  };
})();
</script>
</body>
</html>
