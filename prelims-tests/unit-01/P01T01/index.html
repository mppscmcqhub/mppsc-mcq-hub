<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub - Unit 1 Test 1 (Part 1)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#172033}
body{background:#eef2f7}
header{background:#164f86;color:white;padding:12px 8px;text-align:center}
main{width:100%;max-width:900px;margin:0 auto;padding:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
button{border:0;border-radius:6px;padding:11px 14px;font-size:15px;font-weight:bold;cursor:pointer}
.back{background:#555;color:white}
.print{background:#137c55;color:white}
.submit{background:#b91c1c;color:white}
.timer{background:#fff3cd;border:1px solid #e1c66a;padding:10px;border-radius:7px;font-weight:bold;text-align:center;margin:8px 0}
.question{background:white;border:1px solid #d5dce5;border-radius:7px;margin:12px 0;padding:15px;box-shadow:0 1px 3px #0000000b}
.qtitle{font-weight:bold;line-height:1.65;margin-bottom:12px}
.option{display:block;padding:10px 12px;margin:8px 0;border:1px solid #d5dce5;border-radius:6px;line-height:1.5;cursor:pointer;background:#fff}
.option input{margin-right:10px;accent-color:#164f86}
.option.correct{background:#d8f5df!important;border-color:#218838;color:#145523;font-weight:bold}
.option.wrong{background:#ffe0e0!important;border-color:#c62828;color:#8c1515}
.explanation{display:none;background:#f0f7ff;border-left:4px solid #164f86;padding:12px;margin-top:12px;line-height:1.65;font-size:14px}
#result{display:none;background:white;border:2px solid #164f86;border-radius:8px;padding:20px;margin:15px 0;text-align:center;font-size:20px;font-weight:bold}
</style>
</head>
<body>
<header>
  <h1>MPPSC MCQ Hub</h1>
  <p>Unit 1 — Test 1 (Part 1) | प्राचीन भारतीय ज्ञान परंपरा, भारतवर्ष और वेद</p>
</header>
<main>
  <div class="toolbar">
    <button class="back" onclick="window.history.back()">← Back</button>
    <button class="print" onclick="window.print()">Print</button>
    <button class="submit" onclick="submitTest()">Submit Test</button>
  </div>
  <div class="timer">⏱ समय / Time Remaining: <span id="time">30:00</span></div>
  <div id="result"></div>
  <div id="quiz"></div>
</main>

<script>

  {

    o: ["जम्बूद्वीप", "भारतवर्ष", "आर्यावर्त", "ब्रह्मर्षि देश"], a: 1, e: "विष्णु पुराण के इस श्लोक के अनुसार समुद्र के उत्तर और हिमालय के दक्षिण में जो भूभाग स्थित है, उसका नाम भारतवर्ष है।"
  },
  {

  },
  {

    o: ["पुष्करद्वीप", "क्रौंचद्वीप", "जम्बूद्वीप", "शाकद्वीप"], a: 2, e: "प्राचीन बौद्ध एवं जैन ग्रंथों तथा पुराणों में भारतवर्ष को 'जम्बूद्वीप' का दक्षिणी भाग बताया गया है।"
  },
  {

    o: ["वितस्ता", "परुष्णी (रावी)", "असिकनी", "शतुद्रि"], a: 1, e: "दशराज्ञ युद्ध परुष्णी (आधुनिक रावी) नदी के तट पर राजा सुदास और दस राजाओं के संघ के बीच लड़ा गया था।"

  {

  {

  },
  {
    q: "ऋग्वेद में 'अघन्या' (न मारने योग्य) शब्द का प्रयोग किस पशु के लिए किया गया है?",
    o: ["घोड़ा", "गाय", "हाथी", "बैल"], a: 1, e: "वैदिक काल में गाय को अत्यंत पवित्र माना जाता था। इसे 'अघन्या' अर्थात् वध न करने योग्य घोषित किया गया था।"

  {

    o: ["इंद्र", "अग्नि", "वरुण", "सोम"], a: 2, e: "वरुण देवता को ऋग्वेद में 'ऋतस्य गोपा' (ऋत का रक्षक) कहा गया है।"
  },
  {
    q: "ऋग्वेद के किस मण्डल को पूर्णतः 'सोम' देवता को समर्पित किया गया है?",
    o: ["सातवां मण्डल", "आठवां मण्डल", "नवम मण्डल", "दसवां मण्डल"], a: 2, e: "ऋग्वेद के नवम मण्डल के सभी 114 सूक्त वनस्पति के देवता 'सोम' को समर्पित हैं।"

function renderQuiz() {
  var container = document.getElementById('quiz');
  var html = '';
  for (var i = 0; i < questions.length; i++) {
    var q = questions[i];
    html += '<div class="question">';
    html += '  <div class="qtitle">' + (i + 1) + '. ' + q.q + '</div>';
    for (var j = 0; j < q.o.length; j++) {
      html += '  <label class="option" id="label_' + i + '_' + j + '">';
      html += '    <input type="radio" name="q_' + i + '" value="' + j + '"> ' + q.o[j];
      html += '  </label>';
    }
    html += '  <div class="explanation" id="exp_' + i + '"><b>व्याख्या:</b> ' + q.e + '</div>';
    html += '</div>';
  }
  container.innerHTML = html;
}

function submitTest() {
  var score = 0;
  for (var i = 0; i < questions.length; i++) {
    var checked = document.querySelector('input[name="q_' + i + '"]:checked');
document.getElementById('exp_' + i).style.display = 'block';
document.getElementById('label_' + i + '' + questions[i].a).classList.add('correct');
if (checked && parseInt(checked.value) === questions[i].a) {
score++;
} else if (checked) {
document.getElementById('label' + i + '_' + checked.value).classList.add('wrong');
}
}
var result = document.getElementById('result');
result.style.display = 'block';
result.innerHTML = 'परीक्षा परिणाम: ' + score + ' / ' + questions.length;
}
renderQuiz();
