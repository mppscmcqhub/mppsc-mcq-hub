<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub - Unit 1 Test 1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#172033}
body{background:#eef2f7}
header{background:#164f86;color:white;padding:12px 8px;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:10px}
header h1{font-size:21px;margin:3px 0}
header p{margin:5px 0;font-size:14px}
main{width:100%;max-width:none;margin:0 auto;padding:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
button{border:0;border-radius:6px;padding:11px 14px;font-size:15px;font-weight:bold;cursor:pointer}
.back{background:#555;color:white}
.print{background:#137c55;color:white}
.submit{background:#b91c1c;color:white}
.timer{background:#fff3cd;border:1px solid #e1c66a;padding:10px;border-radius:7px;font-weight:bold;text-align:center;margin:8px 0}
.instructions{background:white;border:1px solid #d9e1eb;border-radius:7px;padding:10px;margin:8px 0;font-size:14px;line-height:1.6}
.question{background:white;border:1px solid #d5dce5;border-radius:7px;margin:8px 0;padding:12px;box-shadow:0 1px 3px #0000000b}
.qtitle{font-weight:bold;line-height:1.65;margin-bottom:10px}
.option{display:block;padding:9px 10px;margin:6px 0;border:1px solid #d5dce5;border-radius:6px;line-height:1.5;cursor:pointer;background:#fff}
.option input{margin-right:8px;accent-color:#164f86}
.option.correct{background:#d8f5df!important;border-color:#218838;color:#145523}
.option.wrong{background:#ffe0e0!important;border-color:#c62828;color:#8c1515}
.explanation{display:none;background:#f0f7ff;border-left:4px solid #164f86;padding:10px;margin-top:10px;line-height:1.65}
#result{display:none;background:white;border:2px solid #164f86;border-radius:8px;padding:16px;margin:12px 0;text-align:center}
#result h2{margin-top:0;color:#164f86}
#result .score{font-size:25px;font-weight:bold}
footer{text-align:center;padding:14px 5px;color:#526174;font-size:13px}
@media print{
body{background:white}
header,.toolbar,.timer,.instructions,footer,#submitBtn{display:none!important}
main{padding:0}
.question{box-shadow:none;break-inside:avoid}
.explanation{display:block!important}
.option{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>MPPSC MCQ Hub</h1>
  </div>
  <p>Unit 1 — Test 1 | प्राचीन भारतीय ज्ञान परंपरा, भारतवर्ष और वेद</p>
</header>
<main>
  <div class="toolbar">
    <button class="back" onclick="goBack()">← Back</button>
    <button class="print" onclick="window.print()">PDF / Print</button>
    <button class="submit" id="submitBtn" onclick="submitTest()">Submit Test</button>
  </div>
  <div class="timer">⏱ समय / Time Remaining: <span id="time">60:00</span></div>
  <div class="instructions">
    <b>निर्देश / Instructions:</b> सभी प्रश्न हल करें। सबमिट करने के बाद व्याख्या दिखाई देगी।
  </div>
  <div id="result"></div>
  <div id="quiz"></div>
</main>
<script>
var questions = [
  {q:"विष्णु पुराण में वर्णित प्रसिद्ध श्लोक 'उत्तरं यत्समुद्रस्य हिमाद्रेश्चैव दक्षिणम्' में किसे परिभाषित किया गया है?", o:["जम्बूद्वीप", "भारतवर्ष", "आर्यावर्त", "ब्रह्मर्षि देश"], a:1, e:"समुद्र के उत्तर और हिमालय के दक्षिण में स्थित भूभाग का नाम भारतवर्ष है।"},
  {q:"अभिलेखीय साक्ष्यों के अनुसार, 'भारतवर्ष' शब्द का सर्वप्रथम लिखित उल्लेख किस प्राचीन अभिलेख में मिलता है?", o:["अशोक का अभिलेख", "खारवेल का हाथीगुम्फा अभिलेख", "रुद्रदामन का जूनागढ़", "प्रयाग प्रशस्ति"], a:1, e:"कलिंग राजा खारवेल के हाथीगुम्फा अभिलेख में 'भरधवरस' शब्द मिलता है।"},
  {q:"बौद्ध ब्रह्मांड विज्ञान के अनुसार, भारत को किस विशाल द्वीप का हिस्सा माना गया है?", o:["पुष्करद्वीप", "क्रौंचद्वीप", "जम्बूद्वीप", "शाकद्वीप"], a:2, e:"पुराणों और बौद्ध साहित्य में भारतवर्ष को जम्बूद्वीप का हिस्सा बताया गया है।"},
  {q:"ऋग्वेद के अनुसार, 'दशराज्ञ युद्ध' (दस राजाओं का युद्ध) निम्नलिखित में से किस नदी के तट पर लड़ा गया था?", o:["वितस्ता", "परुष्णी (रावी)", "असिकनी", "शतुद्रि"], a:1, e:"दशराज्ञ युद्ध परुष्णी (रावी) नदी के तट पर राजा सुदास और दस राजाओं के बीच हुआ।"},
  {q:"वैदिक ज्ञान परंपरा में 'श्रुति' साहित्य के अंतर्गत किसे शामिल नहीं किया जाता है?", o:["संहिता", "ब्राह्मण ग्रंथ", "उपनिषद", "वेदांग"], a:3, e:"वेदांग 'स्मृति' के भाग हैं, श्रुति के अंतर्गत संहिता, ब्राह्मण, आरण्यक और उपनिषद आते हैं।"},
  {q:"चारों वेदों में से किस वेद को 'भारतीय संगीत और कला का मूल जनक' माना जाता है?", o:["ऋग्वेद", "सामवेद", "यजुर्वेद", "अथर्ववेद"], a:1, e:"सामवेद को भारतीय शास्त्रीय संगीत का मूल जनक माना जाता है।"},
  {q:"आयुर्वेद, जो चिकित्सा शास्त्र से संबंधित है, को पारंपरिक रूप से किस वेद का 'उपवेद' माना जाता है?", o:["ऋग्वेद", "सामवेद", "यजुर्वेद", "अथर्ववेद"], a:0, e:"आयुर्वेद को ऋग्वेद का उपवेद माना जाता है।"},
  {q:"प्रसिद्ध 'गायत्री मंत्र' का उल्लेख ऋग्वेद के किस मण्डल में किया गया है?", o:["द्वितीय मण्डल", "तृतीय मण्डल", "सप्तम मण्डल", "नवम मण्डल"], a:1, e:"गायत्री मंत्र ऋग्वेद के तृतीय मण्डल में है, इसके रचयिता विश्वामित्र हैं।"},
  {q:"ऋग्वेद के किस सूक्त में पहली बार चारों वर्णों (ब्राह्मण, क्षत्रिय, वैश्य, शूद्र) की उत्पत्ति का उल्लेख मिलता है?", o:["नासदीय सूक्त", "पुरुष सूक्त", "विवाह सूक्त", "नदी सूक्त"], a:1, e:"ऋग्वेद के 10वें मण्डल के पुरुष सूक्त में चारों वर्णों का एक साथ उल्लेख है।"},
  {q:"यज्ञों के नियम, विधान तथा कर्मकांडों का संकलन गद्य और पद्य दोनों रूपों में किस वेद में मिलता है?", o:["ऋग्वेद", "सामवेद", "यजुर्वेद", "अथर्ववेद"], a:2, e:"यजुर्वेद गद्य और पद्य दोनों रूपों में उपलब्ध एकमात्र कर्मकांडीय वेद है।"},
  {q:"अथर्ववेद का उच्चारण करने वाले मुख्य पुरोहित को प्राचीन काल में क्या कहा जाता था?", o:["होता", "उद्गाता", "अध्वर्यु", "ब्रह्मा"], a:3, e:"अथर्ववेद के पुरोहित को 'ब्रह्मा' कहा जाता था जो यज्ञ का निरीक्षण करते थे।"},
  {q:"गोपथ ब्राह्मण निम्नलिखित में से किस वेद का एकमात्र उपलब्ध ब्राह्मण ग्रंथ है?", o:["ऋग्वेद", "सामवेद", "यजुर्वेद", "अथर्ववेद"], a:3, e:"गोपथ ब्राह्मण अथर्ववेद का एकमात्र ब्राह्मण ग्रंथ है।"},
  {q:"प्राचीन भारतीय गणित और ज्यामिति (Geometry) के बीज किस वैदिक साहित्य में पाए जाते हैं?", o:["शूल्ब सूत्र", "गृह्य सूत्र", "धर्म सूत्र", "श्रोत सूत्र"], a:0, e:"शूल्ब सूत्र में वेदियों को मापने के नियम हैं, जो रेखागणित का प्राचीनतम स्रोत हैं।"},
  {q:"वेदों के कठिन शब्दों और उनके अर्थों की व्याख्या करने के लिए रचित 'निरुक्त' के प्रणेता कौन हैं?", o:["महर्षि पाणिनि", "महर्षि यास्क", "पिंगल मुनि", "लगध मुनि"], a:1, e:"निरुक्त भाषा विज्ञान और व्युत्पत्ति से संबंधित है, जिसके रचयिता महर्षि यास्क हैं।"},
  {q:"प्रसिद्ध दार्शनिक सिद्धांत 'अहं ब्रह्मास्मि' और 'तत्त्वमसि' का मूल स्रोत निम्नलिखित में से क्या है?", o:["संहिता", "ब्राह्मण ग्रंथ", "उपनिषद", "पुराण"], a:2, e:"उपनिषदों (वेदांत) में आत्मा और ब्रह्म की एकता के गंभीर दार्शनिक सिद्धांत मिलते हैं।"},
  {q:"सामवेद का उपवेद निम्नलिखित में से कौन सा माना जाता है?", o:["धनुर्वेद", "गंधर्ववेद", "शिल्पवेद", "आयुर्वेद"], a:1, e:"सामवेद का उपवेद गंधर्ववेद है, जो संगीत कला से संबंधित है।"},
  {q:"ऋग्वेद में 'अघन्या' (न मारने योग्य) शब्द का प्रयोग किस पशु के लिए किया गया है?", o:["घोड़ा", "गाय", "हाथी", "बैल"], a:1, e:"वैदिक काल में गाय को 'अघन्या' अर्थात् न मारने योग्य माना गया था।"},
  {q:"भारतीय ब्रह्मांडीय और नैतिक व्यवस्था के मूल सिद्धांत 'ऋत' (Rta) का नियामक किस देवता को माना गया है?", o:["इंद्र", "अग्नि", "वरुण", "सोम"], a:2, e:"वरुण देवता को ऋग्वेद में 'ऋतस्य गोपा' (ऋत का रक्षक) कहा गया है।"},
  {q:"ऋग्वेद के किस मण्डल को पूर्णतः 'सोम' देवता को समर्पित किया गया है?", o:["सातवां मण्डल", "आठवां मण्डल", "नवम मण्डल", "दसवां मण्डल"], a:2, e:"ऋग्वेद का नवम मण्डल पूर्णतः सोम देवता को समर्पित है।"},
  {q:"वेदांगों की कुल संख्या कितनी है, जो वेदों को शुद्ध समझने के लिए सहायक अंग हैं?", o:["चार", "छह", "आठ", "बारह"], a:1, e:"वेदांग 6 हैं: शिक्षा, कल्प, व्याकरण, निरुक्त, छंद और ज्योतिष।"},
  {q:"किस उपनिषद से भारत का राष्ट्रीय आदर्श वाक्य 'सत्यमेव जयते' लिया गया है?", o:["कठोपनिषद", "मुण्डकोपनिषद", "छान्दोग्य उपनिषद", "माण्डूक्य उपनिषद"], a:1, e:"'सत्यमेव जयते' वाक्य मुण्डकोपनिषद से लिया गया है।"},
  {q:"प्राचीन भारतीय ज्ञान परंपरा में 'वेदांत' शब्द का प्रयोग किसके लिए किया जाता है?", o:["ब्राह्मण ग्रंथ", "आरण्यक", "उपनिषद", "वेदांग"], a:2, e:"उपनिषद वेदों के अंतिम भाग हैं, इसलिए इन्हें 'वेदांत' कहा जाता है।"},
  {q:"वैदिक काल में 'सभा' और 'समिति' को किस प्रजातांत्रिक संस्था या देवता की 'दो पुत्रियाँ' कहा गया है?", o:["प्रजापति", "मनु", "इंद्र", "भरत"], a:0, e:"अथर्ववेद में सभा और समिति को प्रजापति की दो पुत्रियाँ कहा गया है।"},
  {q:"यजुर्वेद के मंत्रों का पाठ कर यज्ञ संपन्न कराने वाले पुरोहित को क्या कहा जाता था?", o:["होता", "अध्वर्यु", "उद्गाता", "पुरोहित"], a:1, e:"यजुर्वेद के कर्मकांडों को संपन्न कराने वाले पुरोहित को 'अध्वर्यु' कहते थे।"},
  {q:"विश्व का प्राचीनतम लिखित ग्रंथ किसे माना जाता है, जो मानव जाति का प्रथम दस्तावेज है?", o:["अथर्ववेद", "ऋग्वेद", "जेंद अवेस्ता", "श्रीमद्भगवद्गीता"], a:1, e: "ऋग्वेद मानव इतिहास का प्राचीनतम उपलब्ध लिखित ग्रंथ है।"}
];

function renderQuiz() {
  var container = document.getElementById('quiz');
  if(!container) return;
  var html = '';
  for (var i = 0; i < questions.length; i++) {
    var q = questions[i];
    html += '<div class="question">';
    html += '  <div class="qtitle">' + (i + 1) + '. ' + q.q + '</div>';
    for (var j = 0; j < q.o.length; j++) {
      html += '  <label class="option" id="label_' + i + '_' + j + '">';
      html += '    <input type="radio" name="q_' + i + '" value="' + j + '"> ' + q.o[j];
      html += '  </label>';
    }
    html += '  <div class="explanation" id="exp_' + i + '"><b>व्याख्या:</b> ' + q.e + '</div>';
    html += '</div>';
  }
  container.innerHTML = html;
}

function submitTest() {
  var score = 0;
  for (var i = 0; i < questions.length; i++) {
    var checked = document.querySelector('input[name="q_' + i + '"]:checked');
    document.getElementById('exp_' + i).style.display = 'block';
    document.getElementById('label_' + i + '_' + questions[i].a).classList.add('correct');
    if (checked && parseInt(checked.value) === questions[i].a) {
      score++;
    } else if (checked) {
document.getElementById('label_' + i + '_' + checked.value).classList.add('wrong');
}
}
var result = document.getElementById('result');
result.style.display = 'block';
result.innerHTML = 'परीक्षा परिणाम / Test Result' + score + ' / ' + questions.length + '';
window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goBack() { window.history.back(); }
var timeInSeconds = 60 * 60;
var timerElement = document.getElementById('time');
var countdown = setInterval(function() {
var minutes = Math.floor(timeInSeconds / 60);
var seconds = timeInSeconds % 60;
seconds = seconds < 10 ? '0' + seconds : seconds;
minutes = minutes < 10 ? '0' + minutes : minutes;
if (timerElement) { timerElement.textContent = minutes + ':' + seconds; }
if (timeInSeconds <= 0) { clearInterval(countdown); submitTest(); }
timeInSeconds--;
}, 1000);
renderQuiz();
