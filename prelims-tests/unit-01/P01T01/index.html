o:["मध्यकालीन और औपनिवेशिक काल के ऐतिहासिक उल्लेख / Medieval and colonial-period historical references","केवल वैदिक संहिताओं के मूल नाम / Original names of Vedic Samhitas only","दक्षिण भारतीय समुद्री साम्राज्यों के अभिलेख / Inscriptions of southern maritime empires","आधुनिक अंतरिक्ष अनुसंधान / Modern space research"],

const container=document.getElementById("questions");
questions.forEach((q,i)=>{
 const article=document.createElement("article");
 article.className="question";
 article.innerHTML=`
 <p class="qtitle"><span class="qnumber">Q${i+1}.</span> ${q.q}</p>
 <div class="options">${q.o.map((op,j)=>`
 <label class="option" id="opt-${i}-${j}">
 <input type="radio" name="q${i}" value="${j}">
 <span><b>${"ABCD"[j]}.</b> ${op}</span></label>`).join("")}</div>
 <div class="explanation" id="exp-${i}">
 <strong>सही उत्तर / Correct Answer:</strong> ${"ABCD"[q.a]}. ${q.o[q.a]}<br>
 <strong>व्याख्या / Explanation:</strong> ${q.e}
 </div>`;
 container.appendChild(article);
});

let remaining=3600;
let submitted=false;
const timerEl=document.getElementById("timer");
function tick(){
 if(submitted)return;
 timerEl.textContent=`समय / Time: ${String(Math.floor(remaining/60)).padStart(2,"0")}:${String(remaining%60).padStart(2,"0")}`;
 if(remaining<=0){submitTest(true);return;}
 remaining--;
}
tick();
const timerInterval=setInterval(tick,1000);

function submitTest(auto){
 if(submitted)return;
 if(!auto&&!confirm("क्या आप टेस्ट जमा करना चाहते हैं? / Are you sure you want to submit?"))return;
 submitted=true;
 clearInterval(timerInterval);
 let correct=0,wrong=0,unanswered=0;
 questions.forEach((q,i)=>{
  const selected=document.querySelector(`input[name="q${i}"]:checked`);
  if(!selected)unanswered++;
  else if(Number(selected.value)===q.a)correct++;
  else wrong++;
  q.o.forEach((_,j)=>{
   const label=document.getElementById(`opt-${i}-${j}`);
   const radio=label.querySelector("input");
   radio.disabled=true;
   if(j===q.a)label.classList.add("correct");
   if(selected&&Number(selected.value)===j&&j!==q.a)label.classList.add("wrong");
  });
  document.getElementById("exp-"+i).style.display="block";
 });
 const percent=(correct/questions.length*100).toFixed(2);
 const result=document.getElementById("result");
 result.style.display="block";
 result.innerHTML=`
 <h2>${auto?"समय समाप्त / Time Over":"टेस्ट परिणाम / Test Result"}</h2>
 <div class="stats">
 <div class="stat"><strong>${correct}</strong>सही / Correct</div>
 <div class="stat"><strong>${wrong}</strong>गलत / Wrong</div>
 <div class="stat"><strong>${unanswered}</strong>छोड़े / Unanswered</div>
 <div class="stat"><strong>${percent}%</strong>प्रतिशत / Percentage</div>
 </div>
 <p><strong>स्कोर / Score:</strong> ${correct} / ${questions.length}</p>
 <p>हरे रंग में सही उत्तर, लाल रंग में चुना गया गलत उत्तर और प्रत्येक प्रश्न की व्याख्या दिखाई गई है। / Correct answers are green, selected wrong answers are red, and explanations are shown for every question.</p>`;
 document.getElementById("submitBtn").disabled=true;
 document.getElementById("bottomSubmit").disabled=true;
 result.scrollIntoView({behavior:"smooth",block:"start"});
}
</script>
