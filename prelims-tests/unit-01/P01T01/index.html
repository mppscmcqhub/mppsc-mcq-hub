<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPPSC अभ्यास प्रश्नोत्तरी (Quiz)</title>
    <!-- PDF जनरेट करने के लिए लाइब्रेरी -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-submit { background-color: #2ecc71; color: white; }
        .btn-submit:hover { background-color: #27ae60; }
        .btn-pdf { background-color: #e74c3c; color: white; }
        .btn-pdf:hover { background-color: #c0392b; }
        .btn-toggle-exp { background-color: #3498db; color: white; margin-top: 10px; }
        .btn-toggle-exp:hover { background-color: #2980b9; }

        .question-block {
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #ccc;
        }
        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c3e50;
            white-space: pre-line;
            margin-bottom: 15px;
        }
        .options-list {
            list-style-type: none;
            padding: 0;
        }
        .option-item {
            background: #f9f9f9;
            padding: 12px 15px;
            margin: 8px 0;
            border-left: 4px solid #3498db;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option-item:hover { background: #f0f0f0; }
        
        /* ऑप्शन सेलेक्ट होने पर */
        .option-item.selected {
            background-color: #dae7f5;
            border-left-color: #2980b9;
            font-weight: bold;
        }

        /* व्याख्या और रिजल्ट पैनल */
        .answer-panel {
            display: none; /* शुरू में छुपा रहेगा, सबमिट या बटन क्लिक पर दिखेगा */
            margin-top: 12px;
            padding: 15px;
            background-color: #e8f8f5;
            border-left: 4px solid #2ecc71;
            border-radius: 4px;
        }
        .ans-title { font-weight: bold; color: #27ae60; margin-bottom: 5px; }
        .exp-text { font-size: 0.95rem; color: #555; line-height: 1.5; }

        #result-box {
            display: none;
            background: #f1c40f;
            color: #2c3e50;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-content">
    <h1>MPPSC अभ्यास प्रश्नोत्तरी (Quiz)</h1>
    
    <!-- स्कोर दिखाने के लिए बॉक्स -->
    <div id="result-box"></div>

    <!-- सबमिट और पीडीएफ बटन्स -->
    <div class="action-buttons">
        <button class="btn btn-submit" onclick="submitQuiz()">टेस्ट सबमिट करें (Submit)</button>
        <button class="btn btn-pdf" onclick="downloadPDF()">PDF डाउनलोड करें</button>
    </div>

    <!-- सवाल यहाँ लोड होंगे -->
    <div id="quiz-box"></div>
</div>

<script>
// आपका प्रश्न डेटा
window.questions = [
  {
    question: "1. भारतीय संविधान के अनुच्छेद 262 के तहत गठित होने वाले 'नदी जल विवाद न्यायाधिकरणों' (River Water Disputes Tribunals) के क्षेत्राधिकार के संदर्भ में कौन-सा संवैधानिक उपबंध सत्य है?\n\nUnder Article 262 of the Indian Constitution, which constitutional provision is TRUE regarding the jurisdiction of River Water Disputes Tribunals established by Parliament?",
    options: ["A", "B", "C", "D"], // नोट: यहाँ मैंने शॉर्ट किया है, आप अपने पूरे ऑप्शंस डाल लें
    optionsText: [
      "A. न्यायाधिकरण के निर्णयों के विरुद्ध केवल संबंधित राज्यों के उच्च न्यायालयों में अपील की जा सकती है। / An appeal against the decisions of the tribunal can be made only in the High Courts of the concerned states.",
      "B. संसद विधि द्वारा यह उपबंध कर सकती है कि उच्चतम न्यायालय या कोई अन्य न्यायालय ऐसे किसी विवाद के संबंध में क्षेत्राधिकार का प्रयोग नहीं करेगा। / Parliament may by law provide that neither the Supreme Court nor any other court shall exercise jurisdiction in respect of any such dispute.",
      "C. इन न्यायाधिकरणों के सभी वित्तीय खर्चों का वहन पूर्णतः भारत के राष्ट्रपति के विवेकाधीन कोष से होता है। / All financial expenses of these tribunals are borne entirely by the discretionary fund of the President of India.",
      "D. इस न्यायाधिकरण की शक्तियां पूरी तरह से केंद्रीय प्रशासनिक अधिकरण (CAT) के अधीन विनियमित होती हैं। / The powers of this tribunal are completely regulated under the Central Administrative Tribunal (CAT)."
    ],
    answer: "B",
    explanation: "अनुच्छेद 262(2) के अनुसार, संसद कानून बनाकर यह व्यवस्था दे सकती है कि अंतर-राज्यीय नदी जल विवादों के संदर्भ में न तो सर्वोच्च न्यायालय और न ही कोई अन्य न्यायालय किसी भी प्रकार के क्षेत्राधिकार का प्रयोग करेगा।"
  },
  {
    question: "2. मध्य प्रदेश में प्रशासनिक जवाबदेही और सुशासन को सुदृढ़ करने के लिए 'मध्य प्रदेश लोक सेवाओं के प्रदान की गारंटी अधिनियम' किस वर्ष लागू किया गया था और ऐसा करने वाला मध्य प्रदेश देश का कौन-सा राज्य बना?\n\nTo strengthen administrative accountability and good governance, in which year was the 'Madhya Pradesh Public Services Guarantee Act' enacted, and what was MP's national rank in implementing such legislation?",
    options: ["A", "B", "C", "D"],
    optionsText: [
      "A. वर्ष 1993; प्रथम राज्य / Year 1993; First state",
      "B. वर्ष 2005; द्वितीय राज्य / Year 2005; Second state",
      "C. वर्ष 2010; देश का पहला राज्य (First State in India) / Year 2010; First State in India",
      "D. वर्ष 2018; तृतीय राज्य / Year 2018; Third state"
    ],
    answer: "C",
    explanation: "मध्य प्रदेश लोक सेवाओं के प्रदान की गारंटी अधिनियम, 2010 को राज्य में 18 अगस्त 2010 को लागू किया गया था। नागरिकों को नियत समय सीमा में लोक सेवाएं प्रदान करने की कानूनी गारंटी देने वाला मध्य प्रदेश देश का पहला राज्य बना था।"
  }
];

const quizBox = document.getElementById('quiz-box');
let userAnswers = {};

// क्विज़ रेंडर करना
window.questions.forEach((q, qIndex) => {
    let optionsHtml = '';
    q.optionsText.forEach((optText, oIndex) => {
        const optLetter = q.options[oIndex];
        optionsHtml += `<li class="option-item" id="q-${qIndex}-opt-${optLetter}" onclick="selectOption(${qIndex}, '${optLetter}')">${optText}</li>`;
    });

    const qBlock = document.createElement('div');
    qBlock.className = 'question-block';
    qBlock.innerHTML = `
        <div class="question-text">${q.question}</div>
        <ul class="options-list">${optionsHtml}</ul>
        <button class="btn btn-toggle-exp" onclick="toggleAnswer(${qIndex})">व्याख्या देखें / छुपायें</button>
        <div class="answer-panel" id="ans-${qIndex}">
            <div class="ans-title">सही उत्तर: ${q.answer}</div>
            <div class="exp-text"><strong>व्याख्या:</strong> ${q.explanation}</div>
        </div>
    `;
    quizBox.appendChild(qBlock);
});

// ऑप्शन सेलेक्ट करने का फंक्शन
function selectOption(qIndex, optLetter) {
    // पुराने सिलेक्शन को हटाना
    window.questions[qIndex].options.forEach(letter => {
        document.getElementById(`q-${qIndex}-opt-${letter}`).classList.remove('selected');
    });
    // नए सिलेक्शन को जोड़ना
    document.getElementById(`q-${qIndex}-opt-${optLetter}`).classList.add('selected');
    userAnswers[qIndex] = optLetter;
}

// उत्तर देखने/छुपाने का फंक्शन
function toggleAnswer(index) {
    const panel = document.getElementById(`ans-${index}`);
    panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
}

// टेस्ट सबमिट करने का फंक्शन
function submitQuiz() {
    let score = 0;
    window.questions.forEach((q, index) => {
        // सभी व्याख्याओं को एक साथ खोल देना
        document.getElementById(`ans-${index}`).style.display = 'block';
        
        // स्कोर चेक करना
        if (userAnswers[index] === q.answer) {
            score++;
        }
    });

    // रिजल्ट बॉक्स दिखाना
    const resultBox = document.getElementById('result-box');
    resultBox.style.display = 'block';
    resultBox.innerHTML = `आपका स्कोर: ${score} / ${window.questions.length}`;
    window.scrollTo({top: 0, behavior: 'smooth'});
}

// PDF डाउनलोड करने का फंक्शन
function downloadPDF() {
    const element = document.getElementById('quiz-content');
    
    // PDF डाउनलोड के समय बटन छुपाना ताकि वे PDF में न आएं
    const buttons = document.querySelectorAll('.btn');
    buttons.forEach(btn => btn.style.display = 'none');

    const opt = {
        margin:       10,
        filename:     'MPPSC_Quiz.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save().then(() => {
        // PDF बनने के बाद बटन्स को वापस दिखाना
        buttons.forEach(btn => btn.style.display = 'inline-block');
    });
}
</script>

</body>
</html>
