const root=document.getElementById("questions");
let submitted=false;
let remaining=3600;
let timerInterval;

questions.forEach((q,i)=>{
 const card=document.createElement("section");
 card.className="question";

 const title=document.createElement("h3");
 title.textContent=(i+1)+". "+q.q;
 card.appendChild(title);

 q.o.forEach((opt,j)=>{
  const label=document.createElement("label");
  label.className="option";

  const input=document.createElement("input");
  input.type="radio";
  input.name="q"+i;
  input.value=j;

  const text=document.createElement("span");
  text.textContent=String.fromCharCode(65+j)+". "+opt;

  label.appendChild(input);
  label.appendChild(text);
  card.appendChild(label);
 });

 const exp=document.createElement("div");
 exp.className="explanation";
 exp.textContent="सही उत्तर / Correct Answer: "+
   String.fromCharCode(65+q.a)+". "+q.o[q.a]+
   "\nव्याख्या / Explanation: "+q.e;

 card.appendChild(exp);
 root.appendChild(card);
});

function submitTest(){
 if(submitted)return;

 if(remaining>0){
  const unanswered=questions.filter((q,i)=>
   !root.children[i].querySelector("input:checked")
  ).length;

  if(unanswered && !confirm(
   unanswered+" प्रश्न बाकी हैं। क्या टेस्ट जमा करना चाहते हैं?"
  ))return;
 }

 submitted=true;
 clearInterval(timerInterval);

 let score=0,attempted=0;

 questions.forEach((q,i)=>{
  const card=root.children[i];
  const selected=card.querySelector("input:checked");

  if(selected){
   attempted++;
   if(Number(selected.value)===q.a)score++;
  }

  card.querySelectorAll(".option").forEach(label=>{
   const input=label.querySelector("input");
   input.disabled=true;

   if(Number(input.value)===q.a)label.classList.add("correct");

   if(selected && input===selected &&
      Number(selected.value)!==q.a){
    label.classList.add("wrong");
   }
  });

  card.querySelector(".explanation").style.display="block";
 });

 const result=document.getElementById("result");
 result.style.display="block";
 result.replaceChildren();

 const heading=document.createElement("h2");
 heading.textContent="टेस्ट परिणाम / Test Result";
 result.appendChild(heading);

 [
  "कुल प्रश्न / Total Questions: "+questions.length,
  "हल किए / Attempted: "+attempted,
  "सही उत्तर / Correct: "+score,
  "गलत उत्तर / Incorrect: "+(attempted-score),
  "अनुत्तरित / Unanswered: "+(questions.length-attempted),
  "स्कोर / Your Score: "+score+" / "+questions.length,
  "प्रतिशत / Percentage: "+(score/questions.length*100).toFixed(2)+"%"
 ].forEach(line=>{
  const p=document.createElement("p");
  p.textContent=line;
  result.appendChild(p);
 });

 document.getElementById("submitBtn").disabled=true;
 document.getElementById("submitBtn").textContent="✓ Test Submitted";
 result.scrollIntoView({behavior:"smooth"});
}

function updateTimer(){
 document.getElementById("timer").textContent=
  String(Math.floor(remaining/60)).padStart(2,"0")+":"+
  String(remaining%60).padStart(2,"0");
}

timerInterval=setInterval(()=>{
 if(submitted)return;
 remaining--;
 updateTimer();

 if(remaining<=0){
  remaining=0;
  updateTimer();
  submitTest();
 }
},1000);

function goBack(){
 if(history.length>1)history.back();
 else location.href="../../../index.html";
}
</script>
