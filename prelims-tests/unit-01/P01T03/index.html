<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;

  color:#222;
  background:#f0f2f5;
}

header{
  width:100%;
  background:#185795;
  color:white;
  padding:10px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.brand{
  font-weight:bold;
  font-size:20px;
  display:flex;
  align-items:center;
  gap:9px;
}

.logo{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:contain;
  background:white;
}

.actions{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:5px;
  padding:10px 12px;
  font-weight:bold;
  cursor:pointer;
}

.timer{
  background:#c71919;
  color:white;
  min-width:75px;
  text-align:center;
  padding:10px;
  border-radius:5px;
}

.back{background:#087cf0;color:white}
.pdf{background:#ffc107;color:#111}
.submit{background:#209d49;color:white;font-size:17px}
button:disabled{opacity:.65;cursor:not-allowed}

/* Full-width content: side margins removed */
main{
  width:100%;
  max-width:none;
  margin:0;
  padding:10px;
}

.panel,.question,.result{
  width:100%;
  background:white;
  border:1px solid #ddd;
  border-radius:6px;
  padding:14px;
  margin:0 0 12px;
}

.panel h2{margin:0 0 8px}

.panel p{
  margin:7px 0;
  line-height:1.6;
}

.question h3{
  font-size:17px;
  line-height:1.7;
  margin:0 0 12px;
  overflow-wrap:anywhere;
}

.option{
  display:block;
  width:100%;
  padding:10px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:5px;
  cursor:pointer;
  line-height:1.7;
  overflow-wrap:anywhere;
}

.option:hover{background:#f3f7ff}

.option input{
  margin-right:9px;
  vertical-align:middle;
}

.correct{
  background:#d8f5df!important;
  border-color:#249544!important;
}

.wrong{
  background:#ffe0e0!important;
  border-color:#d22!important;
}

.explanation{
  display:none;
  margin-top:10px;
  padding:12px;
  background:#eef5ff;
  border-left:4px solid #185795;
  line-height:1.8;
  white-space:pre-line;
  overflow-wrap:anywhere;
}

.bottom{
  width:100%;
  text-align:center;
  padding:12px 0 24px;
}

.bottom button{margin:4px}

.result{
  display:none;
  line-height:1.8;
  overflow-wrap:anywhere;
}

@media(max-width:520px){
  header{padding:9px}
  .brand{font-size:16px}
  .logo{width:32px;height:32px}
  .actions{width:100%;justify-content:flex-start}
  .actions button{padding:9px}
  main{padding:5px}
  .panel,.question,.result{padding:11px}
  .question h3{font-size:16px}
  .option{padding:9px}
}

@media print{
  header,.bottom{display:none!important}
  body{background:white}
  main{padding:0}
  .panel,.question,.result{break-inside:avoid}
  .explanation{display:block!important}
}
</style>
</head>

const root=document.getElementById("questions");
const letters=["A","B","C","D"];
let submitted=false;
let remaining=3600;
let timerInterval;

questions.forEach((q,i)=>{
  const card=document.createElement("section");
  card.className="question";

  const title=document.createElement("h3");
  title.textContent=(i+1)+". "+q.question;
  card.appendChild(title);

  q.options.forEach((opt,j)=>{
    const label=document.createElement("label");
    label.className="option";

    const input=document.createElement("input");
    input.type="radio";
    input.name="q"+i;
    input.value=letters[j];

    const span=document.createElement("span");
    span.textContent=opt;

    label.appendChild(input);
    label.appendChild(span);
    card.appendChild(label);
  });

  const exp=document.createElement("div");
  exp.className="explanation";
  exp.textContent="सही उत्तर / Correct Answer: "+q.answer+
    "\nव्याख्या / Explanation: "+q.explanation;
  card.appendChild(exp);

  root.appendChild(card);
});

document.getElementById("submitBtn").addEventListener("click",submitTest);

function submitTest(){
  if(submitted)return;

  if(remaining>0){
    const unanswered=questions.filter((q,i)=>
      !root.children[i].querySelector('input:checked')
    ).length;

    if(unanswered>0 &&
       !confirm(unanswered+" प्रश्न अभी बाकी हैं। क्या टेस्ट जमा करना चाहते हैं?")){
      return;
    }
  }

  submitted=true;
  clearInterval(timerInterval);

  let score=0,attempted=0;

  questions.forEach((q,i)=>{
    const card=root.children[i];
    const selected=card.querySelector('input[name="q'+i+'"]:checked');

    if(selected){
      attempted++;
      if(selected.value===q.answer)score++;
    }

    card.querySelectorAll(".option").forEach(label=>{
      const input=label.querySelector("input");
      input.disabled=true;

      if(input.value===q.answer)label.classList.add("correct");

      if(selected && input===selected && selected.value!==q.answer){
        label.classList.add("wrong");
      }
    });

    card.querySelector(".explanation").style.display="block";
  });

  const result=document.getElementById("result");
  result.style.display="block";
  result.replaceChildren();

  const heading=document.createElement("h2");
  heading.textContent="टेस्ट परिणाम / Test Result";
  result.appendChild(heading);

  [
    "कुल प्रश्न / Total Questions: "+questions.length,
    "हल किए / Attempted: "+attempted,
    "सही उत्तर / Correct: "+score,
    "गलत उत्तर / Incorrect: "+(attempted-score),
    "अनुत्तरित / Unanswered: "+(questions.length-attempted),
    "स्कोर / Your Score: "+score+" / "+questions.length,
    "प्रतिशत / Percentage: "+(score/questions.length*100).toFixed(2)+"%"
  ].forEach(line=>{
    const p=document.createElement("p");
    p.textContent=line;
    result.appendChild(p);
  });

  document.getElementById("submitBtn").disabled=true;
  document.getElementById("submitBtn").textContent="✓ Test Submitted";
  result.scrollIntoView({behavior:"smooth"});
}

function updateTimer(){
  document.getElementById("timer").textContent=
    String(Math.floor(remaining/60)).padStart(2,"0")+":"+
    String(remaining%60).padStart(2,"0");
}

timerInterval=setInterval(()=>{
  if(submitted)return;

  remaining--;
  updateTimer();

  if(remaining<=0){
    remaining=0;
    updateTimer();
    submitTest();
  }
},1000);

function goBack(){
  if(history.length>1)history.back();
  else location.href="../../../index.html";
}
</script>
