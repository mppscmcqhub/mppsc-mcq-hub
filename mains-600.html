<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPPSC MCQ Hub V14 - Paid MAINS 600 Questions</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f3f6fa;color:#102a43}
.header{background:#082b57;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px}
.header img{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:cover}
.wrap{max-width:1250px;margin:20px auto;padding:0 12px}
.top,.paper{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 9px rgba(0,0,0,.06)}
.top h1{margin:0 0 6px}.top p{color:#667085}
.paper h2{margin:0 0 14px;color:#082b57}
.group-title{background:#eaf2fb;border-radius:7px;padding:9px 11px;margin:16px 0 10px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.card{background:#fff;border:1px solid #d7e1ec;border-radius:8px;padding:10px;text-align:center}
.code{font-size:11px;font-weight:800;display:block;margin-bottom:7px}
.open{display:block;background:#147dcc;color:#fff;text-decoration:none;border-radius:6px;padding:7px 3px;font-size:12px;font-weight:700}
@media(max-width:1000px){.grid{grid-template-columns:repeat(6,1fr)}}
@media(max-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="header">
  <img src="MPPSC-MCQ-Hub-Logo.png" alt="MPPSC MCQ Hub Logo">
  <strong>MPPSC MCQ Hub V14 — Paid MAINS</strong>
</header>
<main class="wrap">
  <section class="top">
    <h1>Paid Course MPPSC 2027</h1>
    <p><b>MAINS — 600 Total Questions</b> (6 Papers × 100 Questions)</p>
    <p>हर Question की अपनी अलग <code>index.html</code> file है, इसलिए आप किसी भी एक Question को अलग से edit कर सकते हैं।</p>
  </section>
  <div id="papers"></div>
</main>
<script>
const papers=[
  {name:"General Studies-I",prefix:"GS1",folder:"paper-01-general-studies-i"},
  {name:"General Studies-II",prefix:"GS2",folder:"paper-02-general-studies-ii"},
  {name:"General Studies-III",prefix:"GS3",folder:"paper-03-general-studies-iii"},
  {name:"General Studies-IV",prefix:"GS4",folder:"paper-04-general-studies-iv"},
  {name:"General Hindi & Grammar",prefix:"GH5",folder:"paper-05-general-hindi-grammar"},
  {name:"Hindi Essay Draft",prefix:"HD6",folder:"paper-06-hindi-essay-draft"}
];
const groups=[
  {marks:5,count:40},
  {marks:10,count:40},
  {marks:15,count:20}
];
let html="";
papers.forEach((p,pi)=>{
  html+=`<section class="paper"><h2>Paper ${pi+1} - ${p.name}</h2>`;
  groups.forEach(g=>{
    html+=`<div class="group-title">${g.marks} अंक वाले प्रश्न — ${g.count} Questions</div><div class="grid">`;
    for(let q=1;q<=g.count;q++){
      const code=`${p.prefix}-${g.marks}M-${String(q).padStart(3,"0")}`;
      html+=`<div class="card"><span class="code">${code}</span><a class="open" href="${p.folder}/${g.marks}-marks/${code}/index.html">Open Question</a></div>`;
    }
    html+=`</div>`;
  });
  html+=`</section>`;
});
document.getElementById("papers").innerHTML=html;
</script>
</body>
</html>
