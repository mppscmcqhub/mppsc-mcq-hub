<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPPSC MCQ Hub - Paid PRELIMS Course</title>
<style>
*{box-sizing:border-box}
/* 🔒 डिफ़ॉल्ट रूप से पूरा पेज छुपा रहेगा जब तक टोकन सत्यापित नहीं होता */
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff5f5;color:#102a43;display:none;}
.header{background:#c53030;color:#fff;padding:15px 20px;font-size:19px;font-weight:700}
.wrap{max-width:1400px;margin:22px auto;padding:0 12px}
.top{background:#fff;border-radius:12px;padding:18px 20px;margin-bottom:18px;box-shadow:0 2px 9px rgba(0,0,0,0.05);border-left: 6px solid #c53030;}
.top h1{margin:0 0 6px;font-size:24px;color:#c53030;}
.unit-sec {background:#fff;border-radius:12px;padding:16px;margin-bottom:25px;box-shadow:0 2px 9px rgba(0,0,0,0.05);border-top: 4px solid #c53030;}
.unit-sec h2{margin:0 0 14px;font-size:20px;color:#c53030;border-bottom: 2px solid #fff5f5;padding-bottom:8px;}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.card{background:#fff;border:1px solid #f56565;border-radius:7px;padding:7px;text-align:center;}
.code{font-size:11px;font-weight:700;display:block;margin-bottom:7px;}
.open-btn {display:block;background:#e53e3e;color:#fff;text-decoration:none;border-radius:6px;padding:5px 3px;font-size:11px;font-weight:bold;text-align:center;}
.open-btn:hover { background:#c53030; }
@media(max-width:1200px){.grid{grid-template-columns:repeat(6,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:550px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<!-- MPPSC MCQ Hub site header -->
<style>
  .mppsc-site-header { background:#1450a3; color:#fff; display:flex; align-items:center; gap:12px; padding:10px 16px; margin:0 0 16px 0; box-sizing:border-box; width:100%; }
  .mppsc-site-header img { width:42px; height:42px; object-fit:contain; border-radius:50%; background:#fff; }
  .mppsc-site-header .site-title { font-size:20px; font-weight:700; line-height:1.2; }
  @media (max-width:600px) { .mppsc-site-header .site-title { font-size:17px; } .mppsc-site-header img { width:36px; height:36px; } }
</style>
<header class="mppsc-site-header">
  <img src="MPPSC-MCQ-Hub-Logo.png" alt="MPPSC MCQ Hub Logo">
  <div class="site-title">MPPSC MCQ Hub V14</div>
</header>


<div class="header">🏆 MPPSC MCQ Hub — Paid PRELIMS Portal</div>
<div class="wrap">
    <div class="top">
        <h1>Paid PRELIMS Course (Active)</h1>
        <p><b>10 Units — 200 Total Practice Tests</b></p>
    </div>
    <div id="prelims-student-container"></div>
</div>

<script>
    // 🛡️ टोकन सुरक्षा जांच - यह छात्रों को डायरेक्ट या फ्री एक्सेस से रोकेगा
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        // यदि URL में ?v=mppsc2027 नहीं है, तो एक्सेस ब्लॉक करें
        if (urlParams.get('v') !== "mppsc2027") {
            alert("❌ अनधिकृत एक्सेस! कृपया पहले इस कोर्स के लिए भुगतान (Payment) करें।");
            window.location.href = "index.html";
        } else {
            // केवल भुगतान करने पर ही पेज दिखेगा
            document.body.style.display = "block";
        }
    })();

    window.onload = function() {
        buildStudentPrelims();
    };

    const prelimsUnits = ["भारत का इतिहास", "मध्यप्रदेश का इतिहास, संस्कृति एवं साहित्य", "भारत का भूगोल", "मध्यप्रदेश का भूगोल", "भारत एवं म.प्र. की संवैधानिक व्यवस्था", "भारत एवं म.प्र. की अर्थव्यवस्था", "विज्ञान, पर्यावरण एवं स्वास्थ्य", "अंतर्राष्ट्रीय, राष्ट्रीय एवं प्रादेशिक घटनाएं", "सूचना एवं संचार प्रौद्योगिकी (ICT)", "म.प्र. की जनजातियां: विरासत व लोक संस्कृति"];

    function buildStudentPrelims() {
        let html = '';
        for (let u = 1; u <= 10; u++) {
            let padU = u < 10 ? '0' + u : u;
            html += `<section class="unit-sec"><h2>Unit ${u} - ${prelimsUnits[u-1]}</h2><div class="grid">`;
            for (let t = 1; t <= 20; t++) {
                let padT = t < 10 ? '0' + t : t;
                let code = `P${padU}T${padT}`;
                html += `<div class="card"><span class="code">${code}</span><a class="open-btn" href="prelims-tests/unit-${padU}/${code}/index.html">Start Test</a></div>`;
            }
            html += `</div></section>`;
        }
        document.getElementById('prelims-student-container').innerHTML = html;
    }
</script>
</body>
</html>
