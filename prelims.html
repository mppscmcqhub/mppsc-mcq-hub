<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPPSC MCQ Hub - Paid PRELIMS Course</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#fff5f5;color:#102a43;display:none}
.header{background:#c53030;color:#fff;padding:15px 20px;font-size:19px;font-weight:700}
.wrap{max-width:1400px;margin:22px auto;padding:0 12px}
.top{background:#fff;border-radius:12px;padding:18px 20px;margin-bottom:18px;box-shadow:0 2px 9px rgba(0,0,0,.05);border-left:6px solid #c53030}
.top h1{margin:0 0 6px;font-size:24px;color:#c53030}
.unit-sec{background:#fff;border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:0 2px 9px rgba(0,0,0,.05);border-top:4px solid #c53030}
.unit-head{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid #fff5f5;padding-bottom:8px}
.unit-head h2{margin:0;font-size:20px;color:#c53030}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:12px}
.card{background:#fff;border:1px solid #f56565;border-radius:7px;padding:9px;text-align:center}
.code{font-size:11px;font-weight:700;display:block;margin-bottom:7px}
.open-btn{display:block;background:#e53e3e;color:#fff;text-decoration:none;border-radius:6px;padding:7px 3px;font-size:11px;font-weight:bold;text-align:center}
.toggle{border:0;background:#eef4ff;color:#082b57;padding:7px 10px;border-radius:6px;font-size:12px;font-weight:800;cursor:pointer}
.section-content.hidden{display:none}
@media(max-width:1200px){.grid{grid-template-columns:repeat(6,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:550px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="header">🏆 MPPSC MCQ Hub — Paid PRELIMS Portal</div>
<main class="wrap">
  <div class="top">
    <h1>Paid PRELIMS Course (Active)</h1>
    <p><b>10 Units + CET — 250 Total Practice Tests</b></p>
  </div>
  <div id="prelims-student-container"></div>
</main>

<script>
(function(){
  const REQUIRED_COURSE="prelims";
  let session=null;
  try{session=JSON.parse(localStorage.getItem("mppsc_student_session")||"null")}catch(e){}
  const allowed=sessionStorage.getItem("mppsc_student_authenticated")==="true" &&
                session && session.type===REQUIRED_COURSE;
  if(!allowed){
    alert("❌ इस Paid Course का access आपके account में नहीं है। कृपया Student Login करें।");
    window.location.replace("student-login.html");
    return;
  }
  document.body.style.display="block";

  const units=[
    "भारत का इतिहास",
    "मध्यप्रदेश का इतिहास, संस्कृति एवं साहित्य",
    "भारत का भूगोल",
    "मध्यप्रदेश का भूगोल",
    "भारत एवं म.प्र. की संवैधानिक व्यवस्था",
    "भारत एवं म.प्र. की अर्थव्यवस्था",
    "विज्ञान, पर्यावरण एवं स्वास्थ्य",
    "अंतर्राष्ट्रीय, राष्ट्रीय एवं प्रादेशिक घटनाएं",
    "सूचना एवं संचार प्रौद्योगिकी (ICT)",
    "म.प्र. की जनजातियां: विरासत व लोक संस्कृति"
  ];

  function section(title, cards){
    return `<section class="unit-sec">
      <div class="unit-head">
        <h2>${title}</h2>
        <button class="toggle" type="button" onclick="toggleSection(this)">▼ Tests छिपाएँ</button>
      </div>
      <div class="section-content"><div class="grid">${cards}</div></div>
    </section>`;
  }

  let html="";
  for(let u=1;u<=10;u++){
    let cards="";
    for(let t=1;t<=20;t++){
      const code=`P${String(u).padStart(2,"0")}T${String(t).padStart(2,"0")}`;
      cards+=`<div class="card"><span class="code">${code}</span><a class="open-btn" href="prelims-tests/unit-${String(u).padStart(2,"0")}/${code}/index.html">Start Test</a></div>`;
    }
    html+=section(`Unit ${u} — ${units[u-1]}`,cards);
  }

  let cet="";
  for(let t=1;t<=50;t++){
    const code=`CET${String(t).padStart(2,"0")}`;
    cet+=`<div class="card"><span class="code">${code}</span><a class="open-btn" href="prelims-tests/cet/${code}/index.html">Start Test</a></div>`;
  }
  html+=section("CET — 50 Tests",cet);
  document.getElementById("prelims-student-container").innerHTML=html;
})();

function toggleSection(btn){
  const content=btn.closest(".unit-sec").querySelector(".section-content");
  const hidden=content.classList.toggle("hidden");
  btn.textContent=hidden?"▶ Tests खोलें":"▼ Tests छिपाएँ";
}
</script>
</body>
</html>
