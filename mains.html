<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>MPPSC MCQ Hub V14 - Paid MAINS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f0f5ff;color:#102a43;display:none}
.site-header{min-height:64px;background:#1450a3;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px}
.site-header img{width:48px;height:48px;object-fit:cover;border-radius:50%;background:#fff;padding:2px}
.site-title{font-size:18px;font-weight:700}
.header{background:#3182ce;color:#fff;padding:10px 16px;font-size:17px;font-weight:700}
.wrap{max-width:1400px;margin:16px auto;padding:0 12px}
.top,.unit{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 2px 9px rgba(0,0,0,.07)}
.top{border-left:5px solid #3182ce}.top h1{margin:0 0 6px;color:#2b6cb0;font-size:21px}.top p{margin:5px 0;font-size:14px}
.unit{border-top:4px solid #3182ce}.unit-title{margin:0 0 10px;color:#2b6cb0;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.test{border:1px solid #90caf9;border-radius:6px;padding:5px;text-align:center}.code{display:block;font-size:10px;font-weight:700;margin-bottom:4px}.start{display:block;background:#3182ce;color:#fff;text-decoration:none;border-radius:5px;padding:5px 3px;font-size:10px;font-weight:700}
.logout{float:right;color:#fff;background:#1e4f82;text-decoration:none;padding:5px 9px;border-radius:4px;font-size:12px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(6,1fr)}}@media(max-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="site-header"><img src="my-logo.jpg" alt="MPPSC MCQ Hub Logo"><div class="site-title">MPPSC MCQ Hub V14</div></header>
<div class="header">🏆 MPPSC MCQ Hub — Paid MAINS Portal <a class="logout" href="#" id="logout">Logout</a></div>
<div class="wrap">
<div class="top"><h1>Paid MAINS Course (Active)</h1><p><b>MAINS Practice Test Portal</b></p></div>
<div id="container"></div>
</div>
<script>
"use strict";
const REQUIRED="mains";
const LOGIN="student-login.html?course=mains";
function clearSession(){["mppsc_student_authenticated","mppsc_student_course","mppsc_student_username","mppsc_student_session","paidStudentCourse","studentMobile"].forEach(k=>sessionStorage.removeItem(k));}
function validSession(){return sessionStorage.getItem("mppsc_student_authenticated")==="true" && String(sessionStorage.getItem("mppsc_student_course")||"").toLowerCase()===REQUIRED && String(sessionStorage.getItem("mppsc_student_username")||"").trim()!=="";}
(function(){
 if(!validSession()){clearSession();location.replace(LOGIN);return;}
 document.body.style.display="block";
 // Keep this section ready for the user's existing Mains test folders.
 const groups=[
  ["Mains Test Series 01","mains-tests/MT01"],["Mains Test Series 02","mains-tests/MT02"],
  ["Mains Test Series 03","mains-tests/MT03"],["Mains Test Series 04","mains-tests/MT04"],
  ["Mains Test Series 05","mains-tests/MT05"],["Mains Test Series 06","mains-tests/MT06"]
 ];
 let html="";
 groups.forEach((g,i)=>{
   html+=`<section class="unit"><h2 class="unit-title">${g[0]}</h2><div class="grid">`;
   for(let n=1;n<=10;n++){
     const code=`M${String(i+1).padStart(2,"0")}T${String(n).padStart(2,"0")}`;
     html+=`<div class="test"><span class="code">${code}</span><a class="start" href="${g[1]}/${code}/index.html">Start Test</a></div>`;
   }
   html+="</div></section>";
 });
 document.getElementById("container").innerHTML=html;
})();
document.getElementById("logout").addEventListener("click",e=>{e.preventDefault();clearSession();location.replace(LOGIN);});
</script>
</body>
</html>
