<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPPSC MCQ Hub V14 - Paid MAINS Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#102a43;display:none;} /* पासवर्ड वेरिफिकेशन तक लोड नहीं होगा */
.header{background:#082b57;color:#fff;padding:15px 20px;font-size:19px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:1400px;margin:22px auto;padding:0 12px}
.top{background:#fff;border-radius:12px;padding:18px 20px;margin-bottom:18px;box-shadow:0 2px 9px #0001}
.top h1{margin:0 0 6px;font-size:24px}.top p{margin:5px 0;color:#667085}
.paper{background:#fff;border-radius:12px;padding:16px;margin-bottom:25px;box-shadow:0 2px 9px #0001;border-top: 4px solid #147dcc;}
.paper h2{margin:0 0 14px;font-size:22px;color:#082b57;border-bottom: 2px solid #eaf2fb;padding-bottom:8px;}
.group-title{background:#eaf2fb;border-radius:7px;padding:8px 10px;margin:20px 0 10px;font-size:16px;font-weight:700;color:#082b57}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.card{background:#fff;border:1px solid #d7e1ec;border-radius:7px;padding:7px;text-align:center;transition:0.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,0.08)}
.code{font-size:11px;font-weight:700;display:block;margin-bottom:7px;color:#334e68}
.open{display:block;background:#147dcc;color:#fff;text-decoration:none;border-radius:6px;padding:5px 3px;font-size:11px;font-weight:bold}
.open:hover{background:#0b69b1}
.logout-btn{background:#d32f2f;color:white;border:none;padding:8px 16px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:14px}
@media(max-width:1200px){.grid{grid-template-columns:repeat(6,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:550px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="header">
    <span>MPPSC MCQ Hub V14 — Paid MAINS Control Panel</span>
    <button class="logout-btn" onclick="logout()">Logout Panel</button>
</div>

<div class="wrap">
    <div class="top">
        <h1>Paid Course MPPSC 2027</h1>
        <p><b>MAINS — 600 Master Practice Boxes</b></p>
        <p>सभी 6 पेपर्स के 5 अंक, 10 अंक और 15 अंक के प्रश्न अलग-अलग बॉक्सेस में विभाजित हैं।</p>
    </div>

    <!-- मुख्य कंटेनर जहाँ लूप के ज़रिए पूरे 600 बॉक्सेस लोड होंगे -->
    <div id="mains-dynamic-container"></div>
</div>

<script>
    // 🛡️ 1. एडमिन सुरक्षा लॉक और क्रेडेंशियल जांच
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('v');

        // अगर लॉगिन का टोकन यूआरएल में मैच नहीं होता है, तो एक्सेस ब्लॉक करें
        if (token !== "mppsc2027") {
            alert("❌ अनधिकृत एक्सेस! कृपया पहले एडमिन पैनल पर लॉगिन करें।");
            window.location.href = "index.html"; 
            return;
        }

        // पासवर्ड और टोकन सही होने पर कंटेंट लोड करें
        document.body.style.display = "block";
        buildMains600Boxes();
    };

    // 🔄 2. सभी 6 पेपर्स और उनके 5, 10, 15 मार्क्स के बॉक्सेस का ऑटोमैटिक जनरेटर लूप
    const papersConfig = [
        { name: "General Studies-I (इतिहास एवं भूगोल)", folder: "paper-01-general-studies-i" },
        { name: "General Studies-II (राजनीति, अर्थशास्त्र एवं समाजशास्त्र)", folder: "paper-02-general-studies-ii" },
        { name: "General Studies-III (विज्ञान, प्रौद्योगिकी एवं स्वास्थ्य)", folder: "paper-03-general-studies-iii" },
        { name: "General Studies-IV (दर्शनशास्त्र, मनोविज्ञान एवं लोक प्रशासन)", folder: "paper-04-general-studies-iv" },
        { name: "General Studies-V (सामान्य हिंदी एवं व्याकरण)", folder: "paper-05-general-studies-v" },
        { name: "General Studies-VI (हिंदी निबंध एवं प्रारूप लेखन)", folder: "paper-06-general-studies-vi" }
    ];

    function buildMains600Boxes() {
        const container = document.getElementById('mains-dynamic-container');
        let fullHtml = '';

        papersConfig.forEach((paper, index) => {
            const pNum = index + 1;
            
            fullHtml += `<section class="paper">
                <h2>Paper ${pNum} - ${paper.name}</h2>`;

            // --- 5 अंक वाले प्रश्न (Box 1 से 40) ---
            fullHtml += `<div class="group-title">5 अंक वाले प्रश्न — 40 Boxes (001 से 040)</div><div class="grid">`;
            for (let b = 1; b <= 40; b++) {
                let boxStr = b < 10 ? '00' + b : '0' + b;
                let code = `GS${pNum}-5M-${boxStr}`;
                let path = `${paper.folder}/5-marks/${code}/index.html`;
                fullHtml += `<div class="card"><span class="code">${code}</span><a class="open" href="${path}">Open</a></div>`;
            }
            fullHtml += `</div>`;

            // --- 10 अंक वाले प्रश्न (Box 41 से 80) ---
            fullHtml += `<div class="group-title">10 अंक वाले प्रश्न — 40 Boxes (041 से 080)</div><div class="grid">`;
            for (let b = 41; b <= 80; b++) {
                let boxStr = '0' + b;
                let code = `GS${pNum}-10M-${boxStr}`;
                let path = `${paper.folder}/10-marks/${code}/index.html`;
                fullHtml += `<div class="card"><span class="code">${code}</span><a class="open" href="${path}">Open</a></div>`;
            }
            fullHtml += `</div>`;

            // --- 15 अंक वाले प्रश्न (Box 81 से 100) ---
            fullHtml += `<div class="group-title">15 अंक वाले प्रश्न — 20 Boxes (081 से 100)</div><div class="grid">`;
            for (let b = 81; b <= 100; b++) {
                let boxStr = b === 100 ? '100' : '0' + b;
                let code = `GS${pNum}-15M-${boxStr}`;
                let path = `${paper.folder}/15-marks/${code}/index.html`;
                fullHtml += `<div class="card"><span class="code">${code}</span><a class="open" href="${path}">Open</a></div>`;
            }
            fullHtml += `</div>`;

            fullHtml += `</section>`;
        });

        container.innerHTML = fullHtml;
    }

    // 🔒 लॉगआउट करने के लिए
    function logout() {
        alert("आप सफलतापूर्वक लॉगआउट हो चुके हैं।");
        window.location.href = "index.html";
    }
</script>

</body>
</html>
