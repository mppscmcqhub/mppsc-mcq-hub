<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MPPSC Hub</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7fc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #004085; }
        .error { color: red; font-size: 14px; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>
    <input type="text" id="username" placeholder="Username (एडमिन नाम)">
    <input type="password" id="password" placeholder="Password (पासवर्ड)">
    <button onclick="checkLogin()">Login</button>
    <p class="error" id="error-msg">गलत Username या Password!</p>
</div>

<script>
    function checkLogin() {
        var user = document.getElementById("username").value;
        var pass = document.getElementById("password").value;

        // एडमिन यूजरनेम और पासवर्ड वेरिफिकेशन
        if(user === "admin123" && pass === "mppsc2027") {
            // ✅ यहाँ ब्राउज़र कैशे को बायपास करने के लिए वर्जन कोड लगा दिया गया है
            window.location.href = "dashboard.html?v=mppsc2027";
        } else {
            document.getElementById("error-msg").style.display = "block";
        }
    }
</script>

</body>
</html>
