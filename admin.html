<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPPSC MCQ Hub V14 - Full Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#102a43;display:none;}
.header{background:#082b57;color:#fff;padding:15px 20px;font-size:19px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:1400px;margin:22px auto;padding:0 12px}
.top{background:#fff;border-radius:12px;padding:18px 20px;margin-bottom:18px;box-shadow:0 2px 9px #0001}
.top h1{margin:0 0 6px;font-size:24px}.top p{margin:5px 0;color:#667085}
.section-main-title {font-size:24px; font-weight:800; color:#082b57; margin:40px 0 15px; padding-left:10px;}
.pre-title { border-left: 6px solid #e53e3e; }
.mains-title { border-left: 6px solid #147dcc; }
.paper, .unit-sec {background:#fff;border-radius:12px;padding:16px;margin-bottom:25px;box-shadow:0 2px 9px #0001;}
.unit-sec { border-top: 4px solid #e53e3e; }
.paper { border-top: 4px solid #147dcc; }
.paper h2, .unit-sec h2{margin:0 0 14px;font-size:20px;color:#082b57;border-bottom: 2px solid #eaf2fb;padding-bottom:8px;}
.group-title{background:#eaf2fb;border-radius:7px;padding:8px 10px;margin:20px 0 10px;font-size:15px;font-weight:700;color:#082b57}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.card{background:#fff;border:1px solid #d7e1ec;border-radius:7px;padding:7px;text-align:center;transition:0.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,0.08)}
.code{font-size:11px;font-weight:700;display:block;margin-bottom:7px;color:#334e68}
.open-btn{display:block;color:#fff;text-decoration:none;border-radius:6px;padding:5px 3px;font-size:11px;font-weight:bold;text-align:center;}
.pre-btn { background:#e53e3e; } .pre-btn:hover { background:#c53030; }
.mains-btn { background:#147dcc; } .mains-btn:hover { background:#0b69b1; }
.logout-btn{background:#d32f2f;color:white;border:none;padding:8px 16px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:14px}
@media(max-width:1200px){.grid{grid-template-columns:repeat(6,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:550px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="header">
    <span>MPPSC MCQ Hub V14 — Full Admin Master Dashboard</span>
    <button class="logout-btn" onclick="logout()">Logout Panel</button>
</div>

<div class="wrap">
    <div class="top">
        <h1>MPPSC Complete Control Board (2027)</h1>
        <p><b>Paid PRELIMS (200 Tests) + Paid MAINS (600 Boxes)</b></p>
        <p>यहाँ सभी 10 प्रीलिम्स यूनिट्स और मुख्य परीक्षा के सभी 6 पेपर्स के डेटा बॉक्सेस एक साथ लाइव हैं।</p>
    </div>

    <!-- 🔴 1. PAID PRELIMS CONTAINERS -->
    <div class="section-main-title pre-title">🏆 Paid PRELIMS — 200 Total Tests</div>
    <div id="prelims-dynamic-container"></div>

    <!-- 🔵 2. PAID MAINS CONTAINERS -->
    <div class="section-main-title mains-title">📝 Paid MAINS — 600 Total Boxes</div>
    <div id="mains-dynamic-container"></div>
</div>

<script>
    // 🛡️ सुरक्षा क्रेडेंशियल टोकन चेक
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('v');

        if (token !== "mppsc2027") {
            alert("❌ अनधिकृत एक्सेस! कृपया पहले लॉगिन करें।");
            window.location.href = "index.html"; 
            return;
        }

        document.body.style.display = "block";
        buildPrelims200Tests();
        buildMains600Boxes();
    };

    // 🔴 प्रीलिम्स 10 यूनिट्स * 20 टेस्ट्स = 200 बॉक्सेस जनरेटर लूप
    const prelimsUnits = [
        "भारत का इतिहास", "मध्यप्रदेश का इतिहास, संस्कृति एवं साहित्य", "भारत का भूगोल",
        "मध्यप्रदेश का भूगोल", "भारत एवं म.प्र. की संवैधानिक व्यवस्था", "भारत एवं म.प्र. की अर्थव्यवस्था",
        "विज्ञान, पर्यावरण एवं स्वास्थ्य", "अंतर्राष्ट्रीय, राष्ट्रीय एवं प्रादेशिक घटनाएं",
        "सूचना एवं संचार प्रौद्योगिकी (ICT)", "म.प्र. की जनजातियां: विरासत व लोक संस्कृति"
    ];

    function buildPrelims200Tests() {
        const container = document.getElementById('prelims-dynamic-container');
        let html = '';
        for (let u = 1; u <= 10; u++) {
            let padU = u < 10 ? '0' + u : u;
            html += `<section class="unit-sec">
                <h2>Unit ${u} - ${prelimsUnits[u-1]}</h2>
                <div class="grid">`;
            for (let t = 1; t <= 20; t++) {
                let padT = t < 10 ? '0' + t : t;
                let code = `P${padU}T${padT}`;
                let path = `prelims-tests/unit-${padU}/${code}/index.html`;
                html += `<div class="card"><span class="code">${code}</span><a class="open-btn pre-btn" href="${path}">Open Test</a></div>`;
            }
            html += `</div></section>`;
        }
        container.innerHTML = html;
    }

    // 🔵 मेंस 6 पेपर्स * 100 बॉक्सेस = 600 बॉक्सेस जनरेटर लूप
    const mainsPapers = [
        { name: "General Studies-I (इतिहास एवं भूगोल)", folder: "paper-01-general-studies-i" },
        { name: "General Studies-II (राजनीति, अर्थशास्त्र एवं समाजशास्त्र)", folder: "paper-02-general-studies-ii" },
        { name: "General Studies-III (विज्ञान, प्रौद्योगिकी एवं स्वास्थ्य)", folder: "paper-03-general-studies-iii" },
        { name: "General Studies-IV (दर्शनशास्त्र, मनोविज्ञान एवं लोक प्रशासन)", folder: "paper-04-general-studies-iv" },
        { name: "General Studies-V (सामान्य हिंदी एवं व्याकरण)", folder: "paper-05-general-studies-v" },
        { name: "General Studies-VI (हिंदी निबंध एवं प्रारूप लेखन)", folder: "paper-06-general-studies-vi" }
    ];

    function buildMains600Boxes() {
        const container = document.getElementById('mains-dynamic-container');
        let html = '';
        mainsPapers.forEach((paper, index) => {
            const pNum = index + 1;
            html += `<section class="paper"><h2>Paper ${pNum} - ${paper.name}</h2>`;
            
            // 5 मार्क्स
            html += `<div class="group-title">5 अंक वाले प्रश्न — 40 Boxes</div><div class="grid">`;
            for (let b = 1; b <= 40; b++) {
                let code = `GS${pNum}-5M-${b < 10 ? '00'+b : '0'+b}`;
                html += `<div class="card"><span class="code">${code}</span><a class="open-btn mains-btn" href="${paper.folder}/5-marks/${code}/index.html">Open</a></div>`;
            }
            html += `</div>`;

            // 10 मार्क्स
            html += `<div class="group-title">10 अंक वाले प्रश्न — 40 Boxes</div><div class="grid">`;
            for (let b = 41; b <= 80; b++) {
                let code = `GS${pNum}-10M-0${b}`;
                html += `<div class="card"><span class="code">${code}</span><a class="open-btn mains-btn" href="${paper.folder}/10-marks/${code}/index.html">Open</a></div>`;
            }
            html += `</div>`;

            // 15 मार्क्स
            html += `<div class="group-title">15 अंक वाले प्रश्न — 20 Boxes</div><div class="grid">`;
            for (let b = 81; b <= 100; b++) {
                let code = `GS${pNum}-15M-${b === 100 ? '100' : '0'+b}`;
                html += `<div class="card"><span class="code">${code}</span><a class="open-btn mains-btn" href="${paper.folder}/15-marks/${code}/index.html">Open</a></div>`;
            }
            html += `</div></section>`;
        });
        container.innerHTML = html;
    }

    function logout() {
        alert("सफलतापूर्वक लॉगआउट कर दिया गया है।");
        window.location.href = "index.html";
    }
</script>
</body>
</html>
