<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - 100 Tests Manager</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7fc; padding: 30px 15px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #1d3557; margin-bottom: 10px; }
        .sub-title { text-align: center; color: #555; margin-bottom: 30px; font-weight: 500; }
        
        /* यूनिट्स फ़िल्टर ग्रिड */
        .unit-filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; margin-bottom: 30px; }
        .filter-btn { padding: 10px; font-weight: bold; border: 2px solid #0d47a1; background: white; color: #0d47a1; border-radius: 6px; cursor: pointer; transition: 0.2s; text-align: center; }
        .filter-btn.active, .filter-btn:hover { background: #0d47a1; color: white; }

        /* टेस्ट डिस्प्ले लिस्ट */
        .tests-display-section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); min-height: 200px; }
        .unit-heading-title { color: #0d47a1; border-bottom: 3px solid #0d47a1; padding-bottom: 8px; margin-bottom: 20px; font-size: 1.4rem; }
        
        .test-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; background: #fafafa; margin-bottom: 10px; border-radius: 6px; flex-wrap: wrap; gap: 10px; }
        .test-info { font-weight: bold; font-size: 1.05rem; color: #333; }
        .test-actions { display: flex; gap: 10px; }
        
        .btn-link { padding: 6px 12px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.85rem; color: white; display: inline-block; }
        .bg-quiz { background-color: #0d47a1; }
        .bg-pdf { background-color: #28a745; }
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }

        /* एडमिन फॉर्म */
        .admin-form-box { background: #fffbfa; border: 2px dashed #ff9800; padding: 25px; border-radius: 12px; margin-top: 40px; text-align: left; }
        .admin-form-box h3 { color: #e65100; margin-bottom: 15px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { font-weight: bold; display: block; margin-top: 10px; color: #444; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .btn-submit { background-color: #ff9800; color: white; border: none; padding: 12px 25px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; width: 100%; }
        .btn-submit:hover { background-color: #e65100; }
        
        .back-link { display: inline-block; margin-top: 25px; color: #0d47a1; text-decoration: none; font-weight: bold; }
        @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1>MPPSC MCQ Hub - Admin Dashboard</h1>
    <div class="sub-title">📋 प्रीलिम्स 100 टेस्ट मैनेजर (हर यूनिट में 10 टेस्ट)</div>
    
    <!-- यूनिट सेलेक्ट करने के लिए बटन्स -->
    <div class="unit-filter-grid">
        <button class="filter-btn active" onclick="filterUnit(1)">Unit 1</button>
        <button class="filter-btn" onclick="filterUnit(2)">Unit 2</button>
        <button class="filter-btn" onclick="filterUnit(3)">Unit 3</button>
        <button class="filter-btn" onclick="filterUnit(4)">Unit 4</button>
        <button class="filter-btn" onclick="filterUnit(5)">Unit 5</button>
        <button class="filter-btn" onclick="filterUnit(6)">Unit 6</button>
        <button class="filter-btn" onclick="filterUnit(7)">Unit 7</button>
        <button class="filter-btn" onclick="filterUnit(8)">Unit 8</button>
        <button class="filter-btn" onclick="filterUnit(9)">Unit 9</button>
        <button class="filter-btn" onclick="filterUnit(10)">Unit 10</button>
    </div>
    
    <!-- वर्तमान यूनिट के टेस्ट यहाँ दिखेंगे -->
    <div class="tests-display-section">
        <div class="unit-heading-title" id="currentUnitTitle">Unit 1 के लाइव टेस्ट</div>
        <div id="testsContainer"></div>
    </div>

    <!-- 📥 नया टेस्ट लिंक अपडेट करने का फॉर्म -->
    <div class="admin-form-box">
        <h3>➕ नया टेस्ट जोड़ें या लिंक अपडेट करें</h3>
        
        <div class="form-grid">
            <div>
                <label>यूनिट नंबर चुनें:</label>
                <select id="testUnit">
                    <option value="1">Unit 1</option><option value="2">Unit 2</option>
                    <option value="3">Unit 3</option><option value="4">Unit 4</option>
                    <option value="5">Unit 5</option><option value="6">Unit 6</option>
                    <option value="7">Unit 7</option><option value="8">Unit 8</option>
                    <option value="9">Unit 9</option><option value="10">Unit 10</option>
                </select>
            </div>
            <div>
                <label>टेस्ट नंबर चुनें (1 से 10 तक):</label>
                <select id="testNumber">
                    <option value="1">Test 1</option><option value="2">Test 2</option>
                    <option value="3">Test 3</option><option value="4">Test 4</option>
                    <option value="5">Test 5</option><option value="6">Test 6</option>
                    <option value="7">Test 7</option><option value="8">Test 8</option>
                    <option value="9">Test 9</option><option value="10">Unit Test 10</option>
                </select>
            </div>
        </div>

        <label>ऑनलाइन क्विज़ / गूगल फॉर्म लिंक (Quiz Link):</label>
        <input type="url" id="quizLink" placeholder="https://forms.gle">

        <label>स्पेशल PDF नोट्स लिंक (Google Drive PDF Link):</label>
        <input type="url" id="pdfLink" placeholder="https://google.com">

        <button class="btn-submit" onclick="saveTestLive()">🚀 टेस्ट डेटा लाइव अपडेट करें</button>
    </div>

    <br>
    <a href="index.html" class="back-link">← वापस मुख्य वेबसाइट पर जाएँ</a>
</div>

<script>
    let selectedUnit = 1;

    document.addEventListener("DOMContentLoaded", function() {
        loadUnitTests();
    });

    function filterUnit(unitNum) {
        selectedUnit = unitNum;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('currentUnitTitle').innerText = `Unit ${unitNum} के लाइव टेस्ट`;
        loadUnitTests();
    }

    // टेस्ट डेटा स्क्रीन पर लोड करना
    function loadUnitTests() {
        const container = document.getElementById('testsContainer');
        container.innerHTML = '';
        
        let allTests = JSON.parse(localStorage.getItem('mppsc_100_tests')) || {};
        let unitTests = allTests[selectedUnit] || {};

        let hasData = false;
        
        // 1 से 10 तक के टेस्ट की रो बनाना
        for (let i = 1; i <= 10; i++) {
            if (unitTests[i]) {
                hasData = true;
                const testData = unitTests[i];
                const row = document.createElement('div');
                row.className = 'test-row';
                row.innerHTML = `
                    <div class="test-info">🎯 Test ${i} (अनलॉक है)</div>
                    <div class="test-actions">
                        ${testData.quiz ? `<a href="\${testData.quiz}" target="_blank" class="btn-link bg-quiz">🎯 Play Quiz</a>` : ''}
                        ${testData.pdf ? `<a href="\${testData.pdf}" target="_blank" class="btn-link bg-pdf">📥 PDF Notes</a>` : ''}
                        <button class="btn-delete" onclick="deleteTest(${i})">❌</button>
                    </div>
                `;
                container.appendChild(row);
            }
        }

        if (!hasData) {
            container.innerHTML = `<p style="text-align:center; color:#777; padding:20px;">इस यूनिट में अभी कोई टेस्ट लाइव नहीं किया गया है। नीचे दिए गए फॉर्म से लिंक अपडेट करें।</p>`;
        }
    }

    // नया टेस्ट डेटा सेव करना
    function saveTestLive() {
        const unit = document.getElementById('testUnit').value;
        const num = document.getElementById('testNumber').value;
        const quiz = document.getElementById('quizLink').value;
        const pdf = document.getElementById('pdfLink').value;

        if (!quiz && !pdf) {
            alert('कृपया कम से कम एक लिंक (Quiz या PDF) अवश्य डालें!');
            return;
        }

        let allTests = JSON.parse(localStorage.getItem('mppsc_100_tests')) || {};
        if (!allTests[unit]) allTests[unit] = {};
        
        allTests[unit][num] = { quiz, pdf };
        localStorage.setItem('mppsc_100_tests', JSON.stringify(allTests));

        // फॉर्म क्लियर करना
        document.getElementById('quizLink').value = '';
        document.getElementById('pdfLink').value = '';

        alert(`यूनिट ${unit} का Test ${num} सफलतापूर्वक सेव हो गया है!`);
        if (unit == selectedUnit) loadUnitTests();
    }

    // टेस्ट हटाना
    function deleteTest(testNum) {
        if (confirm(`क्या आप वाकई Test ${testNum} को हटाना चाहते हैं?`)) {
            let allTests = JSON.parse(localStorage.getItem('mppsc_100_tests')) || {};
            if (allTests[selectedUnit] && allTests[selectedUnit][testNum]) {
                delete allTests[selectedUnit][testNum];
                localStorage.setItem('mppsc_100_tests', JSON.stringify(allTests));
                loadUnitTests();
            }
        }
    }
</script>

</body>
</html>
