<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MPPSC Hub Control Panel</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7fc; padding: 30px 15px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #1d3557; margin-bottom: 25px; }
        
        .main-toggle { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .main-tab { padding: 14px 35px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; width: 45%; }
        .tab-pre { background-color: #b91c1c; color: white; opacity: 0.6; }
        .tab-main { background-color: #2563eb; color: white; opacity: 0.6; }
        .main-tab.active { opacity: 1; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 2px solid #333; }

        .section-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: none; }
        .section-box.active { display: block; }
        
        .unit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; margin-bottom: 20px; }
        .unit-btn { padding: 10px; font-weight: bold; border: 2px solid #b91c1c; background: white; color: #b91c1c; border-radius: 6px; cursor: pointer; text-align: center; }
        .unit-btn.active { background: #b91c1c; color: white; }

        .data-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; background: #fafafa; margin-bottom: 10px; border-radius: 6px; text-align: left; }
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .form-box { background: #fffbfa; border: 2px dashed #ff9800; padding: 25px; border-radius: 12px; margin-top: 30px; text-align: left; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        .btn-submit { background-color: #ff9800; color: white; border: none; padding: 12px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; }
        
        .back-link { display: inline-block; margin-top: 25px; color: #0d47a1; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>MPPSC MCQ Hub - Master Admin Dashboard</h1>
    
    <div class="main-toggle">
        <button class="main-tab tab-pre active" onclick="switchMode('pre')">🎯 PRELIMS (100 Tests)</button>
        <button class="main-tab tab-main" onclick="switchMode('main')">📚 MAINS (500 Qs)</button>
    </div>

    <!-- ================= PRELIMS SECTION ================= -->
    <div id="prelimsSection" class="section-box active">
        <div class="unit-grid">
            <button class="unit-btn pre-u-btn active" onclick="filterPreUnit(1)">Unit 1</button>
            <button class="unit-btn pre-u-btn" onclick="filterPreUnit(2)">Unit 2</button>
            <button class="unit-btn pre-u-btn" onclick="filterPreUnit(3)">Unit 3</button>
            <button class="unit-btn pre-u-btn" onclick="filterPreUnit(4)">Unit 4</button>
            <button class="unit-btn pre-u-btn" onclick="filterPreUnit(5)">Unit 5</button>
            <button class="unit-btn pre-u-btn" onclick="filterPreUnit(6)">Unit 6</button>
            <button class="unit-btn pre-u-btn" onclick="filterPreUnit(7), ">Unit 7</button>
            <button class="unit-btn pre-u-btn" onclick="filterPreUnit(8)">Unit 8</button>
            <button class="unit-btn pre-u-btn" onclick="filterPreUnit(9)">Unit 9</button>
            <button class="unit-btn pre-u-btn" onclick="filterPreUnit(10)">Unit 10</button>
        </div>
        <div id="preTestsContainer"></div>

        <div class="form-box">
            <h3 style="color:#e65100;">➕ प्रीलिम्स टेस्ट लिंक अपलोड करें</h3>
            <label>यूनिट चुनें:</label>
            <select id="preUnitSel">
                <option value="1">Unit 1</option><option value="2">Unit 2</option><option value="3">Unit 3</option><option value="4">Unit 4</option><option value="5">Unit 5</option>
                <option value="6">Unit 6</option><option value="7">Unit 7</option><option value="8">Unit 8</option><option value="9">Unit 9</option><option value="10">Unit 10</option>
            </select>
            <label>टेस्ट नंबर (1 से 10 तक):</label>
            <select id="preTestNum">
                <option value="1">Test 1</option><option value="2">Test 2</option><option value="3">Test 3</option><option value="4">Test 4</option><option value="5">Test 5</option>
                <option value="6">Test 6</option><option value="7">Test 7</option><option value="8">Test 8</option><option value="9">Test 9</option><option value="10">Test 10</option>
            </select>
            <label>ऑनलाइन क्विज़ लिंक:</label>
            <input type="url" id="preQuizUrl" placeholder="https://forms.gle">
            <label>PDF नोट्स लिंक:</label>
            <input type="url" id="prePdfUrl" placeholder="https://google.com">
            <button class="btn-submit" onclick="savePreTest()">🚀 प्रीलिम्स डेटा लाइव करें</button>
        </div>
    </div>

    <!-- ================= MAINS SECTION ================= -->
    <div id="mainsSection" class="section-box">
        <div id="mainsContainer"></div>

        <div class="form-box">
            <h3 style="color:#e65100;">➕ मुख्य परीक्षा (Mains) का नया प्रश्न जोड़ें</h3>
            <label>पेपर एवं पार्ट विवरण (जैसे: Paper-1 | Part-A):</label>
            <input type="text" id="mainsPaperTitle" placeholder="Paper-1 | Part-A (History)">
            <label>मुख्य परीक्षा का प्रश्न (Mains Question):</label>
            <textarea id="mainsQuestionText" rows="4" placeholder="यहाँ मेन्स का प्रश्न टाइप करें..."></textarea>
            <label>मॉडल उत्तर PDF लिंक (Google Drive Link):</label>
            <input type="url" id="mainsPdfUrl" placeholder="https://google.com">
            <button class="btn-submit" onclick="saveMainsQuestion()">🚀 मेन्स प्रश्न लाइव करें</button>
        </div>
    </div>

    <br>
    <a href="index.html" class="back-link">← वापस मुख्य वेबसाइट पर जाएँ</a>
</div>

<script>
    let activeMode = 'pre';
    let currentPreUnit = 1;

    document.addEventListener("DOMContentLoaded", function() {
        loadPreTests();
        loadMainsQuestions();
    });

    function switchMode(mode) {
        activeMode = mode;
        document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section-box').forEach(s => s.classList.remove('active'));
        
        if(mode === 'pre') {
            document.querySelector('.tab-pre').classList.add('active');
            document.getElementById('prelimsSection').classList.add('active');
        } else {
            document.querySelector('.tab-main').classList.add('active');
            document.getElementById('mainsSection').classList.add('active');
        }
    }

    function filterPreUnit(u) {
        currentPreUnit = u;
        document.querySelectorAll('.pre-u-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        loadPreTests();
    }

    function loadPreTests() {
        const c = document.getElementById('preTestsContainer'); c.innerHTML = '';
        let data = JSON.parse(localStorage.getItem('mppsc_100_tests')) || {};
        let unitData = data[currentPreUnit] || {};
        let found = false;

        for(let i=1; i<=10; i++) {
            if(unitData[i]) {
                found = true;
                const row = document.createElement('div'); row.className = 'data-row';
                row.innerHTML = '<div><b>🎯 Test ' + i + '</b> (लाइव है)</div><div><button class="btn-delete" onclick="deletePre(' + i + ')">❌ Delete</button></div>';
                c.appendChild(row);
            }
        }
        if(!found) c.innerHTML = '<p style="color:#777;text-align:center;">इस यूनिट में अभी कोई टेस्ट लाइव नहीं है।</p>';
    }

    function savePreTest() {
        const u = document.getElementById('preUnitSel').value;
        const n = document.getElementById('preTestNum').value;
        const quiz = document.getElementById('preQuizUrl').value;
        const pdf = document.getElementById('prePdfUrl').value;

        if(!quiz && !pdf) { alert('कोई एक लिंक ज़रूर डालें!'); return; }
        
        let data = JSON.parse(localStorage.getItem('mppsc_100_tests')) || {};
        if(!data[u]) data[u] = {};
        data[u][n] = { quiz: quiz, pdf: pdf };
        localStorage.setItem('mppsc_100_tests', JSON.stringify(data));
        
        document.getElementById('preQuizUrl').value = '';
        document.getElementById('prePdfUrl').value = '';
        alert('प्रीलिम्स टेस्ट सफलतापूर्वक सुरक्षित हो गया!');
        loadPreTests();
    }

    function deletePre(n) {
        if(confirm('Test ' + n + ' हटाएं?')) {
            let data = JSON.parse(localStorage.getItem('mppsc_100_tests')) || {};
            if(data[currentPreUnit]) delete data[currentPreUnit][n];
            localStorage.setItem('mppsc_100_tests', JSON.stringify(data));
            loadPreTests();
        }
    }

    function loadMainsQuestions() {
        const c = document.getElementById('mainsContainer'); c.innerHTML = '';
        let list = JSON.parse(localStorage.getItem('mppsc_live_notes_mains')) || [];
        if(list.length === 0) { c.innerHTML = '<p style="color:#777;text-align:center;">कोई मेन्स प्रश्न लाइव नहीं है।</p>'; return; }
        
        list.forEach((item, index) => {
