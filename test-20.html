<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>U10T20 - MPPSC Free Test</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#edf3ff;color:#111}.wrap{padding:22px 10px;max-width:1200px;margin:auto}.hero{background:#1551a5;color:#fff;border-radius:10px;padding:20px;margin:14px 0}.question{background:#fff;border:1px solid #dce3ee;border-radius:10px;padding:18px;margin:14px 0}.option{display:block;border:1px solid #ccd6e3;border-radius:8px;padding:10px;margin:7px 0;cursor:pointer}.submit,.btn{display:inline-block;background:#16a34a;color:#fff;border:0;padding:11px 18px;border-radius:8px;font-weight:800;cursor:pointer;text-decoration:none}.btn{background:#1551a5}.result{margin-top:18px;background:#ecfdf5;border:1px solid #86efac;border-radius:10px;padding:18px}.badge{display:inline-block;background:#e8f5e9;color:#16803c;padding:5px 8px;border-radius:12px;font-weight:800;font-size:11px}.site-brand-bar{width:100%;background:#0d47a1;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:64px;box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.12)}.site-brand-bar img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff}.site-brand-title{font-size:1.12rem;font-weight:800}@media(max-width:600px){.site-brand-bar{padding:7px 10px;min-height:58px}.site-brand-bar img{width:42px;height:42px}.site-brand-title{font-size:.98rem}}</style></head><body><div class="site-brand-bar"><img src="../../MPPSC-MCQ-Hub-Logo.png" alt="MPPSC MCQ Hub Logo"><div class="site-brand-title">MPPSC MCQ Hub</div></div><main class="wrap"><a class="btn" href="index.html">← Unit 10</a><div class="hero"><span class="badge">U10T20 · FREE</span><h1>Unit 10 · Test 20</h1><p style="color:#fff">20 Questions · यह FREE Prelims Test है</p></div><div id="test"></div><div id="result"></div></main><script src="../../assets/js/common.js"></script><script src="../../questions200.js"></script><script>
const TEST_CODE='U10T20';
const QUESTIONS=(window.questions||[]).map(q=>({q:q.question||q.q||'',options:q.options||q.o||[],answer:(typeof q.answer==='string'?'ABCD'.indexOf(q.answer.trim().charAt(0).toUpperCase()):Number(q.answer)),explanation:q.explanation||q.e||''})).slice(0,20);
function renderTest(){const box=document.getElementById('test');if(!QUESTIONS.length){box.innerHTML='<div class="result">इस टेस्ट का प्रश्न डेटा उपलब्ध नहीं है।</div>';return;}box.innerHTML=QUESTIONS.map((item,idx)=>'<div class="question"><h3>'+(idx+1)+'. '+item.q+'</h3>'+item.options.map((op,j)=>'<label class="option"><input type="radio" name="q'+idx+'" value="'+j+'"> '+op+'</label>').join('')+'</div>').join('')+'<button class="submit" onclick="submitTest()">Submit Test</button>';}
function submitTest(){let score=0;QUESTIONS.forEach((item,idx)=>{const s=document.querySelector('input[name="q'+idx+'"]:checked');if(s&&Number(s.value)===item.answer)score++;});markTestDone(TEST_CODE,score);document.getElementById('result').innerHTML='<div class="result"><h2>Result: '+score+' / '+QUESTIONS.length+'</h2><p>Test Code: <b>'+TEST_CODE+'</b></p><a class="btn" href="index.html">Back to Unit</a> <button class="btn" onclick="location.reload()">Retake Test</button></div>';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
renderTest();</script></body></html>
