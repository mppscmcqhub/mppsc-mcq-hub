<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard · MPPSC MCQ Hub</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#102a43}.top{background:#082b57;color:#fff;padding:14px 18px;display:flex;align-items:center}.top b{font-size:18px}.top button{margin-left:auto;border:0;background:#fff;color:#082b57;padding:8px 12px;border-radius:7px;font-weight:800;cursor:pointer}.wrap{max-width:1200px;margin:22px auto;padding:0 14px}.hero{background:#fff;padding:20px;border-radius:14px;box-shadow:0 3px 12px #0001;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 3px 12px #0001}.card h2{margin-top:0}.pre{border-top:5px solid #e53e3e}.main{border-top:5px solid #147dcc}.btn{display:inline-block;text-decoration:none;color:#fff;padding:11px 18px;border-radius:8px;font-weight:800;margin-top:10px}.pre .btn{background:#e53e3e}.main .btn{background:#147dcc}.locked{opacity:.65}.small{font-size:13px;color:#667085}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><div class="top"><b>🎓 MPPSC Student Dashboard</b><button onclick="logout()">Logout</button></div><div class="wrap"><div class="hero"><h1 id="welcome">Welcome Student</h1><p>आपके approved paid courses नीचे दिखाई देंगे।</p></div><div class="cards" id="cards"></div></div><script>(function(){const user=JSON.parse(localStorage.getItem('mppsc_current_student')||'null');if(!user){location.href='student-login.html';return;}document.getElementById('welcome').textContent='Welcome, '+user.username;const courses=Array.from(new Set((Array.isArray(user.courses)?user.courses:[]).map(c=>String(c).toLowerCase()).filter(c=>c==='prelims'||c==='mains')));const c=document.getElementById('cards');let html='';if(courses.includes('prelims'))html+='<div class="card pre"><h2>🎯 Paid PRELIMS</h2><p><b>200 Practice Tests</b><br>10 Units × 20 Tests</p><p class="small">Admin-approved PRELIMS access</p><a class="btn" href="prelims.html">Open 200 Tests</a></div>';if(courses.includes('mains'))html+='<div class="card main"><h2>📚 Paid MAINS</h2><p><b>600 Practice Boxes</b><br>6 Papers × 100 Questions</p><p class="small">Admin-approved MAINS access</p><a class="btn" href="mains-600.html">Open 600 Tests</a></div>';if(!html)html='<div class="card"><h2>⏳ Access pending</h2><p>Admin approval के बाद course यहाँ दिखाई देगा।</p></div>';c.innerHTML=html;})();function logout(){localStorage.removeItem('mppsc_current_student');location.href='student-login.html';}</script></body></html>
