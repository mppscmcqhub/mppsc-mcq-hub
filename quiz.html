<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<div class="topbar">
<a href="index.html" class="back">← Home</a>
<span id="langBadge">Hindi</span>
</div>

<h1 id="title">MPPSC Unit-10 टेस्ट</h1>
<p id="subtitle">20 प्रश्न ऑनलाइन टेस्ट</p>

<div id="quiz"></div>

<button id="submitBtn" onclick="submitQuiz()">टेस्ट जमा करें</button>

<div id="scoreBox"></div>

<button id="restartBtn" onclick="location.reload()" style="display:none">
फिर से टेस्ट करें
</button>

</div>

<script src="questions.js"></script>

<script>
const params=new URLSearchParams(location.search);
const lang=params.get("lang")==="en"?"en":"hi";

document.documentElement.lang=lang;

if(lang==="en"){
document.getElementById("title").innerText="MPPSC Unit-10 Test";
document.getElementById("subtitle").innerText="20 Questions Online Test";
document.getElementById("submitBtn").innerText="Submit Test";
document.getElementById("restartBtn").innerText="Restart Test";
document.getElementById("langBadge").innerText="English";
}else{
document.getElementById("langBadge").innerText="Hindi";
}

const quiz=document.getElementById("quiz");

questions.forEach((q,i)=>{
const box=document.createElement("div");
box.className="qbox";

const question=lang==="en"?q.qEn:q.qHi;
const options=lang==="en"?q.oEn:q.oHi;

let html=`<h3>Q${i+1}. ${question}</h3>`;

options.forEach((o,j)=>{
html+=`
<label class="opt" id="q${i}o${j}">
<input type="radio" name="q${i}" value="${j}">
<span>${o}</span>
</label>`;
});

html+=`<div id="e${i}" class="exp"></div>`;

box.innerHTML=html;
quiz.appendChild(box);
});

function submitQuiz(){

let score=0;

questions.forEach((q,i)=>{

const sel=document.querySelector(`input[name=q${i}]:checked`);
const user=sel?Number(sel.value):-1;

const options=lang==="en"?q.oEn:q.oHi;
const explain=lang==="en"?q.eEn:q.eHi;

options.forEach((_,j)=>{

const label=document.getElementById(`q${i}o${j}`);

label.classList.remove("correct","wrong");

if(j===q.a) label.classList.add("correct");

if(j===user && user!==q.a) label.classList.add("wrong");

label.querySelector("input").disabled=true;

});

if(user===q.a) score++;

document.getElementById(`e${i}`).innerHTML=
`<b>${lang==="en"?"Correct Answer":"सही उत्तर"}:</b> ${options[q.a]}<br>
<b>${lang==="en"?"Explanation":"व्याख्या"}:</b> ${explain}`;

});

document.getElementById("scoreBox").innerHTML=`
<div class="result">
<h2>${lang==="en"?"Your Score":"आपका स्कोर"}</h2>
<h1>${score}/${questions.length}</h1>
</div>`;

document.getElementById("submitBtn").style.display="none";
document.getElementById("restartBtn").style.display="inline-block";

window.scrollTo({top:0,behavior:"smooth"});
}
</script>

</body>
</html>
