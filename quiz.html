<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPPSC Quiz</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f3f3f3;
margin:0;
}
.container{
max-width:900px;
margin:auto;
padding:20px;
}
.top{
background:#082a73;
color:white;
padding:20px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}
#timer{
font-size:22px;
font-weight:bold;
background:white;
color:#082a73;
padding:8px 14px;
border-radius:8px;
}
.qbox{
background:white;
margin:18px 0;
padding:18px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.qbox h3{
margin-top:0;
}
.opt{
display:block;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
cursor:pointer;
}
.opt input{
margin-right:8px;
}
.correct{
background:#dff5df;
border-color:green;
}
.wrong{
background:#ffdede;
border-color:red;
}
.exp{
margin-top:10px;
font-size:15px;
display:none;
}
button{
background:#082a73;
color:white;
padding:14px 20px;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
}
button:hover{
background:#0d3ea6;
}
#scoreBox{
background:white;
padding:20px;
border-radius:12px;
margin-top:20px;
display:none;
}
textarea{
width:100%;
padding:12px;
border-radius:8px;
margin-top:8px;
}
</style>

</head>
<body>

<div class="container">

<div class="top">
<div>
<h2>MPPSC MCQ Hub</h2>
<div id="testName"></div>
<div id="studentName"></div>
</div>
<div id="timer">10:00</div>
</div>

<div id="quiz"></div>

<button id="submitBtn" onclick="submitQuiz()">टेस्ट जमा करें</button>

<div id="scoreBox">
<h2 id="scoreText"></h2>

<h3>Student Comment</h3>
<textarea placeholder="अपनी राय लिखें..."></textarea>
</div>

</div>

<script>

const letters=["A","B","C","D"];

const test=new URLSearchParams(location.search).get("test")||1;

document.getElementById("testName").innerHTML="टेस्ट "+test;

document.getElementById("studentName").innerHTML="विद्यार्थी: "+(localStorage.getItem("student")||"");

const s=document.createElement("script");

s.src="questions"+test+".js";

s.onload=loadQuiz;

s.onerror=()=>{

document.getElementById("quiz").innerHTML="<h2>इस टेस्ट के प्रश्न नहीं मिले।</h2>";

};

document.body.appendChild(s);

let questions=[];

function loadQuiz(){

if(typeof window.questions!=="undefined")
questions=window.questions;

const quiz=document.getElementById("quiz");

quiz.innerHTML="";

questions.forEach((q,i)=>{

let html=`<div class="qbox" id="box${i}">
<h3>प्रश्न ${i+1}: ${q.q}</h3>`;

q.o.forEach((o,j)=>{

html+=`
<label class="opt" id="q${i}o${j}">
<input type="radio" name="q${i}" value="${j}">
<b>${letters[j]}.</b> ${o}
</label>
`;

});

html+=`
<div class="exp" id="e${i}">
<b>सही उत्तर:</b> ${letters[q.a]} - ${q.o[q.a]}<br>
<b>व्याख्या:</b> ${q.exp}
</div>
</div>`;

quiz.innerHTML+=html;

});

}

function submitQuiz(){

let score=0;

questions.forEach((q,i)=>{

const sel=document.querySelector(`input[name=q${i}]:checked`);

document.getElementById("e"+i).style.display="block";

document.getElementById("q"+i+"o"+q.a).classList.add("correct");

if(sel){

if(Number(sel.value)===q.a){

score++;

}else{

document.getElementById("q"+i+"o"+sel.value).classList.add("wrong");

}

}

});

document.getElementById("scoreBox").style.display="block";

document.getElementById("scoreText").innerHTML=`आपका स्कोर: ${score}/${questions.length}`;

window.scrollTo(0,document.body.scrollHeight);

document.getElementById("submitBtn").disabled=true;

}

let time=600;

const timer=document.getElementById("timer");

const t=setInterval(()=>{

let m=Math.floor(time/60);

let s=time%60;

timer.innerHTML=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

time--;

if(time<0){

clearInterval(t);

submitQuiz();

}

},1000);

</script>

</body>
</html>
