<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub Quiz</title>

<style>
body{
font-family:Arial,sans-serif;
background:#eef5ff;
margin:0;
}

header{
background:#083b8a;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:900px;
margin:20px auto;
padding:10px;
}

.question{
background:white;
padding:18px;
margin-bottom:20px;
border-radius:15px;
box-shadow:0 5px 12px rgba(0,0,0,.08);
}

.option{
display:block;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
cursor:pointer;
}

.option.correct{
background:#d4edda;
border-color:green;
}

.option.wrong{
background:#f8d7da;
border-color:red;
}

button{
background:#0b63ff;
color:white;
border:none;
padding:12px 22px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

#result{
background:white;
padding:20px;
border-radius:15px;
margin-top:20px;
display:none;
box-shadow:0 5px 12px rgba(0,0,0,.08);
}

.explanation{
margin-top:8px;
padding:10px;
background:#f5f5f5;
border-left:4px solid #0b63ff;
border-radius:6px;
font-size:14px;
}
</style>
</head>
<body>

<header>

<div>
<h2>MPPSC MCQ Hub</h2>
<div id="unitTitle">Unit</div>
<div id="testTitle">Test</div>
</div>

<div id="timer">10:00</div>

</header>

<div class="container">

<div id="quiz"></div>

<button onclick="submitQuiz()">Submit Test</button>

<div id="result"></div>

</div>

<script>

const params=new URLSearchParams(location.search);

const unit=params.get("unit")||"1";
const test=params.get("test")||"1";

document.getElementById("unitTitle").innerHTML="Unit "+unit;
document.getElementById("testTitle").innerHTML="Test "+test;

let questions=[];

const script=document.createElement("script");
script.src=`questions${unit}.js`;

script.onload=function(){

if(typeof questionBank!=="undefined"){

questions=questionBank["test"+test]||[];

loadQuiz();

}else{

document.getElementById("quiz").innerHTML="<h3>Questions नहीं मिले।</h3>";

}

};

document.body.appendChild(script);

function loadQuiz(){

const quiz=document.getElementById("quiz");

quiz.innerHTML="";

questions.forEach((q,index)=>{

let html=`
<div class="question">

<h3>प्रश्न ${index+1}: ${q.question}</h3>

`;

["A","B","C","D"].forEach((letter,i)=>{

html+=`
<label class="option" id="q${index}o${i}">
<input type="radio" name="q${index}" value="${i}">
<b>${letter}.</b> ${q.options[i]}
</label>
`;

});

html+=`
<div class="explanation" id="exp${index}" style="display:none;">
<b>Explanation:</b> ${q.explanation}
</div>
</div>
`;

quiz.innerHTML+=html;

});

}

function submitQuiz(){

let score=0;

questions.forEach((q,index)=>{

const selected=document.querySelector(`input[name=q${index}]:checked`);

for(let i=0;i<4;i++){

const label=document.getElementById(`q${index}o${i}`);

if(i===q.answer) label.classList.add("correct");

}

if(selected){

if(Number(selected.value)===q.answer){

score++;

}else{

document.getElementById(`q${index}o${selected.value}`).classList.add("wrong");

}

}

document.getElementById(`exp${index}`).style.display="block";

});

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=`
<h2>Result</h2>
<h3>Score: ${score} / ${questions.length}</h3>
`;

window.scrollTo(0,document.body.scrollHeight);

}

let time=600;

const timer=document.getElementById("timer");

const interval=setInterval(()=>{

let m=Math.floor(time/60);

let s=time%60;

timer.innerHTML=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

time--;

if(time<0){

clearInterval(interval);

submitQuiz();

}

},1000);

</script>

</body>
</html>
