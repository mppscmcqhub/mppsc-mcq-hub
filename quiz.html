<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<title>MPPSC MCQ Hub</title>

<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Arial;
background:#eef4ff;
margin:0;
}

header{
background:#0645d8;
color:white;
padding:15px;
}

.box{
background:white;
padding:15px;
border-radius:10px;
margin:15px;
}

.qbox{
background:#ffffff;
padding:15px;
margin:15px;
border-radius:10px;
}

.option{
display:block;
padding:8px;
margin:5px;
border:1px solid #ddd;
border-radius:5px;
}

.correct{
background:#b6f7b6;
}

.wrong{
background:#ffb3b3;
}

button{
padding:10px 20px;
background:#0645d8;
color:white;
border:none;
border-radius:5px;
}

#scoreBox{
font-size:20px;
font-weight:bold;
padding:20px;
}
</style>

</head>


<body>


<header>
<h2>MPPSC MCQ Hub</h2>
</header>


<div id="quiz"></div>


<div class="box">

<button onclick="submitQuiz()">Submit Test</button>

<div id="scoreBox"></div>


<h3>Student Comment</h3>

<textarea placeholder="अपनी राय लिखें..."></textarea>

</div>



<script src="questions1.js"></script>



<script>


let quiz=document.getElementById("quiz");


questions.forEach((q,i)=>{


let html=`

<div class="qbox">

<h3>
${q.question}
</h3>

`;



q.options.forEach((op,index)=>{


html+=`

<label class="option" id="opt${i}${index}">

<input type="radio" name="q${i}" value="${String.fromCharCode(65+index)}">

${op}

</label>


`;

});


html+=`

<p id="exp${i}"></p>

</div>


`;


quiz.innerHTML+=html;


});





function submitQuiz(){


let score=0;


questions.forEach((q,i)=>{


let ans=document.querySelector(
'input[name="q'+i+'"]:checked'
);


let exp=document.getElementById("exp"+i);


q.options.forEach((op,index)=>{


let div=document.getElementById("opt"+i+index);


if(String.fromCharCode(65+index)==q.answer){

div.classList.add("correct");

}


});



if(ans){


if(ans.value==q.answer){

score++;

}

else{

let index=ans.value.charCodeAt(0)-65;

document.getElementById("opt"+i+index)
.classList.add("wrong");

}


exp.innerHTML=
"Explanation: "+q.explanation;


}


});



document.getElementById("scoreBox").innerHTML=

"Your Score : "+score+"/"+questions.length;


}


</script>


</body>
</html>
