<!DOCTYPE html><html lang="hi"><meta charset="UTF-8"><title>Quiz</title>
<link rel="stylesheet" href="style.css"><body><div class="box"><div id=q></div><div id=opts></div><button onclick="next()">Next</button></div>
<script src="questions.js"></script><script>
let i=0,ans=[];
function load(){q.innerHTML="<h2>"+questions[i].q+"</h2>";opts.innerHTML="";
questions[i].o.forEach((t,n)=>{opts.innerHTML+=`<label class="opt"><input type="radio" name="a" value="${n}" ${ans[i]==n?"checked":""}><span>${t}</span></label>`;});
}
function next(){let c=document.querySelector('input[name=a]:checked');if(!c)return;ans[i]=+c.value;
if(i<questions.length-1){i++;load();}else{let s=0,r="<h2>Result</h2>";questions.forEach((x,k)=>{if(ans[k]==x.a)s++;r+=`<p><b>Q${k+1}:</b> ${x.q}<br>✔ ${x.o[x.a]}<br><i>${x.e}</i></p><hr>`});document.body.innerHTML=`<div class=box><h1>${localStorage.getItem("student")||"Student"}</h1><h2>Score ${s}/${questions.length}</h2>${r}</div>`;}}
load();</script></body></html>
