<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>MPPSC MCQ Hub</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h2>MPPSC MCQ Hub</h2>
</header>


<div class="box">

<div id="quiz"></div>

<button onclick="submitQuiz()">Submit Test</button>

<div id="scoreBox"></div>


<div class="comment">
<h3>Student Comment</h3>
<textarea placeholder="अपनी राय लिखें..."></textarea>
</div>


</div>


<!-- आपका data file -->
<script src="questionBank.js"></script>


<script>

let params = new URLSearchParams(window.location.search);

let unit = params.get("unit") || "1";
let test = params.get("test") || "1";


let questions = window.questionBank["unit"+unit]["test"+test];


let quiz=document.getElementById("quiz");


questions.forEach((q,i)=>{


let html=`

<div class="qbox">

<h3>${i+1}. ${q.question}</h3>

`;

q.options.forEach((op,index)=>{

html+=`

<label>
<input type="radio" name="q${i}" value="${index}">
${op}
</label>
<br>

`;

});


html+=`

<div id="exp${i}"></div>

</div>

`;

quiz.innerHTML += html;


});



function submitQuiz(){

let score=0;


questions.forEach((q,i)=>{


let ans=document.querySelector(
'input[name="q'+i+'"]:checked'
);


let exp=document.getElementById("exp"+i);


if(ans){

if(Number(ans.value)==q.answer){

score++;

exp.innerHTML="✅ सही उत्तर<br>"+q.explanation;

}else{

exp.innerHTML="❌ गलत उत्तर<br>सही उत्तर: "+q.options[q.answer]+"<br>"+q.explanation;

}

}


});


document.getElementById("scoreBox").innerHTML=

"<h2>Score : "+score+"/"+questions.length+"</h2>";

}


</script>

</body>
</html>
