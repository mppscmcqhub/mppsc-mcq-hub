<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<title>MPPSC MCQ Hub</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial;
background:#eef4ff;
margin:0;
}

header{
background:#0645d8;
color:white;
padding:15px;
}

.box{
background:white;
margin:15px;
padding:15px;
border-radius:10px;
}

.qbox{
background:white;
margin:15px;
padding:15px;
border-radius:10px;
}

.option{
display:block;
padding:10px;
margin:6px 0;
border:1px solid #ccc;
border-radius:5px;
cursor:pointer;
}

.correct{
background:#9cff9c;
}

.wrong{
background:#ff9999;
}

button{
background:#0645d8;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
}

</style>

</head>


<body>


<header>
<h2>MPPSC MCQ Hub</h2>
</header>



<div id="quiz"></div>



<div class="box">

<button onclick="submitQuiz()">
Submit Test
</button>


<h2 id="scoreBox"></h2>


<h3>Student Comment</h3>

<textarea 
placeholder="अपनी राय लिखें..."
rows="4"
style="width:100%">
</textarea>


</div>



<script src="questions1.js"></script>



<script>


let quiz=document.getElementById("quiz");



questions.forEach((q,i)=>{


let div=document.createElement("div");

div.className="qbox";


div.innerHTML=
`
<h3>
${q.question}
</h3>

<div id="options${i}"></div>

<p id="exp${i}"></p>

`;



quiz.appendChild(div);



let opt=document.getElementById("options"+i);



q.options.forEach((o,index)=>{


let label=document.createElement("label");


label.className="option";


label.id="q"+i+"o"+index;


label.innerHTML=

`
<input type="radio" 
name="q${i}" 
value="${String.fromCharCode(65+index)}">

${o}
`;



opt.appendChild(label);


});


});





function submitQuiz(){


let score=0;



questions.forEach((q,i)=>{


let selected=
document.querySelector(
'input[name="q'+i+'"]:checked'
);



q.options.forEach((o,index)=>{


let box=document.getElementById(
"q"+i+"o"+index
);


if(String.fromCharCode(65+index)==q.answer)
{
box.classList.add("correct");
}


});



if(selected){

if(selected.value==q.answer)
{
score++;
}

else
{
let wrongIndex =
selected.value.charCodeAt(0)-65;

document.getElementById(
"q"+i+"o"+wrongIndex
).classList.add("wrong");
}

}

document.getElementById("exp"+i).innerHTML =
"Explanation : " + q.explanation;



}



});



document.getElementById("scoreBox").innerHTML=

"Score : "+score+"/"+questions.length;



}


</script>



</body>
</html>
