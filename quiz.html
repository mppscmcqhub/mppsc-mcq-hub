<!DOCTYPE html><html lang='hi'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Quiz</title><link rel='stylesheet' href='style.css'></head><body><div class='card'><h2 id='student'></h2><h3 id='count'></h3><div id='timer'></div><h2 id='q'></h2><div id='opts'></div><button class='btn' onclick='nextQ()'>Next</button></div><script src='questions.js'></script><script>student.textContent='विद्यार्थी: '+(localStorage.getItem('studentName')||'Student');let i=0,s=0,sel=[];let t=1200;setInterval(()=>{if(t>0)t--;timer.textContent='समय: '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');},1000);function load(){count.textContent='प्रश्न '+(i+1)+'/20';q.textContent=questions[i].q;opts.innerHTML='';questions[i].options.forEach((o,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>sel[i]=n;opts.appendChild(b);});}function nextQ(){if(sel[i]===questions[i].answer)s++;i++;if(i>=20){let h='<div class=card><h2>रिज़ल्ट</h2><h3>स्कोर: '+s+'/20</h3>';questions.forEach((x,k)=>{h+='<hr><b>Q'+(k+1)+'. '+x.q+'</b><p class=good>✔ '+x.options[x.answer]+'</p><p>'+x.explanation+'</p>';});h+='</div>';document.body.innerHTML=h;return;}load();}load();</script></body></html>
