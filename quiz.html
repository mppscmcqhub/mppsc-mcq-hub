<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub Quiz</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:#d6e0ec;
}
header{
background:#083b8a;
color:#fff;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
}
header h2{margin-bottom:6px}
.timer{
font-size:28px;
font-weight:bold;
}
.container{
max-width:900px;
margin:25px auto;
padding:15px;
}
.card{
background:#fff;
padding:18px;
border-radius:14px;
box-shadow:0 3px 12px rgba(0,0,0,.12);
margin-bottom:18px;
}
.question{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
}
.option{
display:block;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
cursor:pointer;
}
.option:hover{background:#eef4ff}
.correct{background:#d4edda;border-color:green}
.wrong{background:#f8d7da;border-color:red}
.explanation{
display:none;
margin-top:12px;
padding:12px;
background:#eef7ff;
border-left:5px solid #0d6efd;
border-radius:8px;
}
button{
background:#0d6efd;
color:white;
border:none;
padding:12px 24px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}
button:hover{background:#084298}
#result{
display:none;
}
</style>
</head>
<body>

<header>
<div>
<h2>MPPSC MCQ Hub</h2>
<div id="quizTitle"></div>
</div>
<div class="timer" id="timer">10:00</div>
</header>

<div class="container">

<div id="quiz"></div>

<button id="submitBtn" onclick="submitQuiz()" style="display:none">Submit Test</button>

<div id="result" class="card">
<h2>Final Result</h2>
<h3 id="score"></h3>
</div>

</div>

<script>
const params=new URLSearchParams(location.search);
const unit=params.get("unit")||"1";
const test=params.get("test")||"1";

document.getElementById("quizTitle").innerHTML=`Unit ${unit}<br>Test ${test}`;

let questions=[];
let answers=[];
let time=600;
let submitted=false;

// Questions File Load
const s=document.createElement("script");
s.src=`questions${unit}.js`;

s.onload=function(){

if(!window.questionBank){
document.getElementById("quiz").innerHTML="<h2>questions"+unit+".js नहीं मिली</h2>";
return;
}

questions=window.questionBank["test"+test]||[];

if(questions.length===0){
document.getElementById("quiz").innerHTML="<h2>Questions नहीं मिले</h2>";
return;
}

document.getElementById("submitBtn").style.display="inline-block";
loadQuiz();
};

s.onerror=function(){
document.getElementById("quiz").innerHTML="<h2>questions"+unit+".js Load नहीं हुई</h2>";
};

document.body.appendChild(s);

// Quiz Render
function loadQuiz(){

const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{

let html=`<div class="card">
<div class="question">प्रश्न ${i+1}: ${q.question}</div>`;

q.options.forEach((op,j)=>{

html+=`
<label class="option" id="q${i}o${j}">
<input type="radio"
name="q${i}"
value="${j}"
onchange="answers[${i}]=${j}">
${op}
</label>`;
});

html+=`
<div class="explanation" id="exp${i}">
<b>Explanation:</b><br>${q.explanation}
</div></div>`;

quiz.innerHTML+=html;
});
}

// Submit
function submitQuiz(){

if(submitted)return;
submitted=true;

let score=0;

questions.forEach((q,i)=>{

const radios=document.querySelectorAll(`input[name=q${i}]`);

radios.forEach((r,j)=>{

const label=document.getElementById(`q${i}o${j}`);

label.classList.remove("correct","wrong");

if(j===q.answer){
label.classList.add("correct");
}

if(r.checked && j!==q.answer){
label.classList.add("wrong");
}

});

document.getElementById(`exp${i}`).style.display="block";

if(answers[i]===q.answer){
score++;
}
});

document.getElementById("result").style.display="block";
document.getElementById("score").innerHTML=`Score: ${score} / ${questions.length}`;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});
}

// Timer
setInterval(()=>{

if(submitted)return;

if(time>0){

time--;

const m=Math.floor(time/60);
const s=time%60;

document.getElementById("timer").innerHTML=
`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

}else{

submitQuiz();

}

},1000);

</script>

</body>
</html>
