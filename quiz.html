<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC Unit-10 Test</title>
<link rel="stylesheet" href="style.css">

<style>
.feedback-box{
    margin-top:30px;
    padding:20px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:10px;
}

.feedback-box h3{
    margin-bottom:15px;
}

.feedback-box input,
.feedback-box textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.feedback-box button{
    background:#0f2b66;
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.feedback-box button:hover{
    background:#173b8a;
}

#commentMsg{
    margin-top:10px;
    color:green;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

    <div class="topbar">
        <a href="index.html" class="back">← Home</a>
    </div>

    <h1>MPPSC Unit-10 टेस्ट (20 प्रश्न)</h1>
    <p>20 प्रश्न • ऑनलाइन टेस्ट</p>

    <div id="quiz"></div>

    <button id="submitBtn" onclick="submitQuiz()">
        टेस्ट जमा करें
    </button>

    <div id="scoreBox"></div>

    <button id="restartBtn" onclick="location.reload()" style="display:none;">
        फिर से टेस्ट करें
    </button>

    <!-- Student Comment -->
    <div class="feedback-box">
        <h3>Student Comment / छात्र की राय</h3>

        <input type="text" id="studentName"
               placeholder="अपना नाम लिखें">

        <textarea id="studentComment"
                  rows="4"
                  placeholder="अपना कमेंट लिखें..."></textarea>

        <button onclick="submitComment()">
            Comment Submit करें
        </button>

        <p id="commentMsg"></p>
    </div>

</div>

<script src="questions.js"></script>

<script>

const quiz=document.getElementById("quiz");

questions.forEach((q,i)=>{

let html=`
<div class="qbox">
<h3>प्रश्न ${i+1}: ${q.q}</h3>
`;

q.o.forEach((o,j)=>{

html+=`
<label class="opt" id="q${i}o${j}">
<input type="radio" name="q${i}" value="${j}">
<span>${o}</span>
</label>
`;

});

html+=`
<div id="e${i}" class="exp"></div>
</div>
`;

quiz.innerHTML+=html;

});

function submitQuiz(){

let score=0;

questions.forEach((q,i)=>{

const sel=document.querySelector(`input[name="q${i}"]:checked`);
const user=sel?Number(sel.value):-1;

q.o.forEach((_,j)=>{

const label=document.getElementById(`q${i}o${j}`);

label.classList.remove("correct","wrong");

if(j===q.a) label.classList.add("correct");

if(j===user && user!==q.a)
label.classList.add("wrong");

label.querySelector("input").disabled=true;

});

if(user===q.a) score++;

document.getElementById(`e${i}`).innerHTML=`
<b>सही उत्तर:</b> ${q.o[q.a]}<br>
<b>व्याख्या:</b> ${q.e}
`;

});

document.getElementById("scoreBox").innerHTML=`
<div class="result">
<h2>आपका स्कोर</h2>
<h1>${score}/${questions.length}</h1>
</div>
`;

document.getElementById("submitBtn").style.display="none";
document.getElementById("restartBtn").style.display="inline-block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function submitComment(){

const name=document.getElementById("studentName").value.trim();
const comment=document.getElementById("studentComment").value.trim();

if(name===""||comment===""){

document.getElementById("commentMsg").innerHTML=
"⚠️ नाम और कमेंट दोनों भरें।";

return;

}

document.getElementById("commentMsg").innerHTML=
`✅ धन्यवाद ${name}! आपका कमेंट दर्ज हो गया।`;

console.log({
name:name,
comment:comment
});

document.getElementById("studentName").value="";
document.getElementById("studentComment").value="";

}

</script>

</body>
</html>
