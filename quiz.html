<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:Arial,sans-serif;
background:#f3f3f3;
}
.container{
max-width:900px;
margin:auto;
padding:20px;
}
.top{
background:#082a73;
color:white;
padding:20px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}
#timer{
background:white;
color:#082a73;
padding:10px 16px;
border-radius:10px;
font-size:24px;
font-weight:bold;
}
.card{
background:white;
margin:20px 0;
padding:18px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.question{
font-size:22px;
font-weight:bold;
margin-bottom:15px;
}
.option{
display:block;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
cursor:pointer;
}
.option:hover{background:#f2f2f2;}
button{
background:#082a73;
color:white;
border:none;
padding:12px 25px;
border-radius:10px;
cursor:pointer;
font-size:18px;
}
button:hover{background:#0b3aa5;}
.correct{background:#d4edda;border-color:green;}
.wrong{background:#f8d7da;border-color:red;}
#result{
background:white;
padding:20px;
border-radius:15px;
margin-top:20px;
display:none;
}
textarea{
width:100%;
padding:10px;
border-radius:8px;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
<div>
<h1>MPPSC MCQ Hub</h1>
<h2>टेस्ट <span id="testNo"></span></h2>
<h3>यूनिट <span id="unitNo"></span></h3>
</div>

<div id="timer">10:00</div>
</div>

<form id="quiz"></form>

<button onclick="submitQuiz()">टेस्ट जमा करें</button>

<div id="result">
<h2>आपका स्कोर: <span id="score"></span></h2>

<div id="answers"></div>

<h3 style="margin-top:20px;">Student Comment</h3>
<textarea placeholder="अपनी राय लिखें..."></textarea>
</div>

</div>

<script>
const test=Number(new URLSearchParams(location.search).get("test"))||1;
const unit=Math.ceil(test/20);

document.getElementById("testNo").textContent=test;
document.getElementById("unitNo").textContent=unit;

let questions=[];

const script=document.createElement("script");
script.src=`questions${test}.js`;

script.onload=function(){

questions=window[`questions${test}`];

if(!questions||questions.length===0){
document.getElementById("quiz").innerHTML=
`<div class="card"><h2>Test ${test} के प्रश्न नहीं मिले।</h2></div>`;
return;
}

showQuestions();
};

script.onerror=function(){

document.getElementById("quiz").innerHTML=
`<div class="card"><h2>questions${test}.js नहीं मिली।</h2></div>`;

};

document.body.appendChild(script);

function showQuestions(){

const quiz=document.getElementById("quiz");

quiz.innerHTML="";

questions.forEach((q,i)=>{

quiz.innerHTML+=`

<div class="card">

<div class="question">
प्रश्न ${i+1}: ${q.q}
</div>

<label class="option">
<input type="radio" name="q${i}" value="0">
<strong>A.</strong> ${q.o[0]}
</label>

<label class="option">
<input type="radio" name="q${i}" value="1">
<strong>B.</strong> ${q.o[1]}
</label>

<label class="option">
<input type="radio" name="q${i}" value="2">
<strong>C.</strong> ${q.o[2]}
</label>

<label class="option">
<input type="radio" name="q${i}" value="3">
<strong>D.</strong> ${q.o[3]}
</label>

</div>

`;

});

}

function submitQuiz(){

let score=0;
let html="";

questions.forEach((q,i)=>{

const selected=document.querySelector(`input[name=q${i}]:checked`);

const value=selected?Number(selected.value):-1;

if(value===q.a)score++;

html+=`

<div class="card">

<h3>प्रश्न ${i+1}</h3>

<p>${q.q}</p>

<p style="color:green;">
✔ सही उत्तर: ${["A","B","C","D"][q.a]} - ${q.o[q.a]}
</p>

${value!==-1&&value!==q.a?
`<p style="color:red;">✘ आपका उत्तर: ${["A","B","C","D"][value]} - ${q.o[value]}</p>`:""}

<p><b>व्याख्या:</b> ${q.exp}</p>

</div>

`;

});

document.getElementById("score").textContent=`${score}/${questions.length}`;

document.getElementById("answers").innerHTML=html;

document.getElementById("result").style.display="block";

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

// Timer
let time=600;

setInterval(()=>{

if(time<=0){
submitQuiz();
return;
}

time--;

let m=Math.floor(time/60);
let s=time%60;

document.getElementById("timer").textContent=
`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

},1000);

</script>

</body>
</html>
