<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Noto Sans Devanagari",Arial,sans-serif;
}

body{
  background:#f5f5f5;
}

.container{
  max-width:900px;
  margin:40px auto;
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:35px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h1{
  font-size:42px;
  color:#111827;
  margin-bottom:10px;
}

.sub{
  font-size:22px;
  color:#555;
  margin-bottom:30px;
}

.lang-title{
  text-align:center;
  font-size:24px;
  font-weight:700;
  margin-bottom:25px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  text-decoration:none;
  color:#111;
  border:1px solid #ddd;
  border-radius:14px;
  padding:30px 20px;
  text-align:center;
  transition:.25s;
  background:#fff;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#0f2b66;
  box-shadow:0 8px 20px rgba(15,43,102,.12);
}

.icon{
  font-size:46px;
  margin-bottom:15px;
}

.card h2{
  font-size:24px;
  margin-bottom:8px;
}

.card p{
  color:#666;
  font-size:16px;
}

.footer{
  text-align:center;
  margin-top:35px;
  color:#777;
  font-size:14px;
}

@media(max-width:600px){
  .container{
    margin:15px;
    padding:22px;
  }

  h1{
    font-size:30px;
  }

  .sub{
    font-size:18px;
  }

  .lang-title{
    font-size:20px;
  }

  .card{
    padding:22px 16px;
  }
}
</style>

</head>
<body>

<div class="container">

<h1>MPPSC MCQ Hub</h1>
<p class="sub">20 Questions Online Test</p>

<div class="lang-title">अपनी भाषा चुनें / Choose Your Language</div>

<div class="grid">

<a href="quiz.html?lang=hi" class="card">
<div class="icon">🇮🇳</div>
<h2>Hindi Student</h2>
<p>20 प्रश्न ऑनलाइन टेस्ट</p>
</a>

<a href="quiz.html?lang=en" class="card">
<div class="icon">🇬🇧</div>
<h2>English Student</h2>
<p>20 Questions Online Test</p>
</a>

</div>

<div class="footer">
MPPSC Practice Test • Free MCQ Hub
</div>

</div>

</body>
</html>
