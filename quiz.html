<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC Unit-10 Test</title>

<link rel="stylesheet" href="style.css">

<style>
.feedback-box{
    margin-top:30px;
    padding:20px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:10px;
}

.feedback-box h3{
    margin-bottom:15px;
}

.feedback-box input,
.feedback-box textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.feedback-box button{
    background:#0f2b66;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.feedback-box button:hover{
    background:#183c88;
}
</style>

</head>

<body>

<div class="container">

<div class="topbar">
<a href="index.html" class="back">← Home</a>
<span id="langBadge">Hindi</span>
</div>

<h1 id="title">MPPSC Unit-10 टेस्ट (20 प्रश्न)</h1>
<p id="subtitle">20 प्रश्न • ऑनलाइन टेस्ट</p>

<div id="quiz"></div>

<button id="submitBtn" onclick="submitQuiz()">टेस्ट जमा करें</button>

<div id="scoreBox"></div>

<button id="restartBtn" onclick="location.reload()" style="display:none;">
फिर से टेस्ट करें
</button>

<!-- Student Feedback -->
<div class="feedback-box">

<h3>🎓 Student Feedback / छात्र प्रतिक्रिया</h3>

<input type="text" id="studentName" placeholder="अपना नाम लिखें">

<textarea id="studentComment" rows="4"
placeholder="अपनी राय या सुझाव लिखें..."></textarea>

<button onclick="sendFeedback()">Feedback भेजें</button>

<p id="feedbackMsg"></p>

</div>

</div>

<script src="questions.js"></script>

<script>

const quiz=document.getElementById("quiz");

questions.forEach((q,i)=>{

const box=document.createElement("div");
box.className="qbox";

box.innerHTML=`
<h3>प्रश्न ${i+1}: ${q.q}</h3>
${q.o.map((opt,j)=>`
<label class="opt">
<input type="radio" name="q${i}" value="${j}">
<span>${opt}</span>
</label>
`).join("")}
<div class="result" id="r${i}" style="display:none"></div>
`;

quiz.appendChild(box);

});

function submitQuiz(){

let score=0;

questions.forEach((q,i)=>{

const selected=document.querySelector(`input[name=q${i}]:checked`);
const res=document.getElementById(`r${i}`);

if(selected && Number(selected.value)===q.a){

score++;
res.innerHTML=`✅ सही<br>${q.e}`;
res.style.background="#e8f8ec";
res.style.borderLeft="4px solid green";

}else{

res.innerHTML=`❌ गलत<br>${q.e}`;
res.style.background="#fdeaea";
res.style.borderLeft="4px solid red";

}

res.style.display="block";

});

document.getElementById("scoreBox").innerHTML=
`<h2>आपका स्कोर: ${score}/${questions.length}</h2>`;

document.getElementById("submitBtn").style.display="none";
document.getElementById("restartBtn").style.display="inline-block";

window.scrollTo({top:0,behavior:"smooth"});

}

function sendFeedback(){

const name=document.getElementById("studentName").value.trim();
const comment=document.getElementById("studentComment").value.trim();

if(name==="" || comment===""){

alert("कृपया नाम और कमेंट दोनों भरें।");
return;

}

document.getElementById("feedbackMsg").innerHTML=
"✅ धन्यवाद! आपका Feedback प्राप्त हो गया।";

document.getElementById("studentName").value="";
document.getElementById("studentComment").value="";

}

</script>

</body>
</html>
