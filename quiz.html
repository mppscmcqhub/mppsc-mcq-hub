<!DOCTYPE html><html lang='hi'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Quiz</title><link rel='stylesheet' href='style.css'></head><body><div class='card'><h2 id='q'></h2><div id='opts'></div><button class='btn' onclick='nextQ()'>Next</button><p id='msg'></p></div><script src='questions.js'></script><script>let i=0;function load(){q.textContent=questions[i].q;opts.innerHTML='';msg.textContent='';questions[i].options.forEach((o,n)=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>{msg.textContent=n===questions[i].answer?'✅ सही उत्तर':'❌ गलत उत्तर';};opts.appendChild(b);});}function nextQ(){i=(i+1)%questions.length;load();}load();</script></body></html>
