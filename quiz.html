<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPPSC Quiz</title>

<style>
body{font-family:Arial;background:#f3f3f3;margin:0}
.container{max-width:900px;margin:auto;padding:20px}
.top{background:#082a73;color:#fff;padding:20px;border-radius:12px;
display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
#timer{background:#fff;color:#082a73;padding:8px 14px;border-radius:8px;font-weight:bold}
.q{background:#fff;margin:16px 0;padding:16px;border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.12)}
label{display:block;border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}
.correct{background:#d4edda;border-color:#28a745}
.wrong{background:#f8d7da;border-color:#dc3545}
.exp{display:none;background:#eef7ff;padding:10px;border-left:4px solid #0b5ed7;border-radius:8px;margin-top:8px}
button{background:#082a73;color:#fff;border:none;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
#result{display:none;background:#fff;padding:20px;border-radius:12px;margin-top:20px}
textarea{width:100%;padding:10px;border-radius:8px}
</style>

</head>
<body>

<div class="container">

<div class="top">
<div>
<h2>MPPSC MCQ Hub</h2>
<div id="info"></div>
</div>
<div id="timer">10:00</div>
</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">टेस्ट जमा करें</button>

<div id="result">
<h2 id="score"></h2>
<h3>Student Comment</h3>
<textarea placeholder="अपनी राय लिखें..."></textarea>
</div>

</div>

<script>

const test = Number(new URLSearchParams(location.search).get("test")||1);

const unit = Math.ceil(test/20);

document.getElementById("info").innerHTML=`टेस्ट ${test}<br>यूनिट ${unit}`;

let sec=600;

setInterval(()=>{
if(sec>0){
sec--;
let m=String(Math.floor(sec/60)).padStart(2,"0");
let s=String(sec%60).padStart(2,"0");
timer.innerHTML=`${m}:${s}`;
}
},1000);

const file="questions"+unit+".js";

const sc=document.createElement("script");

sc.src=file;

sc.onload=loadQuiz;

sc.onerror=()=>quiz.innerHTML="<h3>❌ "+file+" नहीं मिला।</h3>";

document.body.appendChild(sc);

function loadQuiz(){

const start=(test-1)%20;

const data=(window.questions||[]).slice(start,start+20);

quiz.innerHTML="";

data.forEach((q,i)=>{

quiz.innerHTML+=`

<div class="q">

<h3>प्रश्न ${i+1}: ${q.q}</h3>

${q.o.map((o,j)=>`

<label id="l${i}${j}">

<input type="radio" name="q${i}" value="${j}">

${String.fromCharCode(65+j)}. ${o}

</label>

`).join("")}

<div id="e${i}" class="exp">

<b>व्याख्या:</b> ${q.exp||""}

</div>

</div>

`;

});

}

function submitQuiz(){

const start=(test-1)%20;

const data=(window.questions||[]).slice(start,start+20);

let score=0;

data.forEach((q,i)=>{

const sel=document.querySelector(`input[name=q${i}]:checked`);

document.getElementById("e"+i).style.display="block";

q.o.forEach((o,j)=>{

if(j===q.a) document.getElementById(`l${i}${j}`).classList.add("correct");

});

if(sel){

if(Number(sel.value)===q.a) score++;

else document.getElementById(`l${i}${sel.value}`).classList.add("wrong");

}

});

document.getElementById("result").style.display="block";

document.getElementById("score").innerHTML=`आपका स्कोर: ${score}/20`;

window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});

}

</script>

</body>
</html>
