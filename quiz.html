<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub Quiz</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#d7e0ec;
}

header{
background:#083b8a;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h2{margin:0;}

.container{
max-width:900px;
margin:20px auto;
padding:10px;
}

.question-card{
background:white;
border-radius:12px;
padding:18px;
margin-bottom:18px;
box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.question{
font-weight:bold;
font-size:20px;
margin-bottom:15px;
}

.option{
display:block;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin:8px 0;
cursor:pointer;
}

.option:hover{
background:#eef4ff;
}

.correct{
background:#d4edda;
border-color:green;
}

.wrong{
background:#f8d7da;
border-color:red;
}

.explanation{
display:none;
background:#eef7ff;
border-left:5px solid #0d6efd;
padding:12px;
margin-top:10px;
border-radius:8px;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:12px 22px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#084298;
}

#result{
display:none;
background:white;
padding:20px;
border-radius:12px;
margin-top:25px;
box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.timer{
font-size:24px;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<div>
<h2>MPPSC MCQ Hub</h2>
<div id="title"></div>
</div>

<div class="timer" id="timer">10:00</div>
</header>

<div class="container">

<div id="quiz"></div>

<button onclick="submitQuiz()">Submit Test</button>

<div id="result">
<h2>Final Result</h2>
<h3 id="score"></h3>
</div>

</div>

<script>

const params=new URLSearchParams(location.search);

const unit=params.get("unit")||"1";
const test=params.get("test")||"1";

document.getElementById("title").innerHTML=`Unit ${unit}<br>Test ${test}`;

let questionBank={};
let questions=[];
let time=600;
let userAnswers=[];

const script=document.createElement("script");
script.src=`questions${unit}.js`;

script.onload=function(){

questions=questionBank["test"+test]||[];

if(questions.length===0){

document.getElementById("quiz").innerHTML="<h2>Questions नहीं मिले</h2>";
return;

}

loadQuiz();

};

document.body.appendChild(script);

function loadQuiz(){

const quiz=document.getElementById("quiz");

quiz.innerHTML="";

questions.forEach((q,i)=>{

let html=`
<div class="question-card">

<div class="question">
प्रश्न ${i+1}: ${q.question}
</div>
`;

q.options.forEach((opt,j)=>{

html+=`
<label class="option" id="q${i}o${j}">
<input type="radio" name="q${i}" value="${j}" onchange="saveAnswer(${i},${j})">
${opt}
</label>
`;

});

html+=`
<div class="explanation" id="exp${i}">
<b>Explanation:</b><br>${q.explanation}
</div>

</div>
`;

quiz.innerHTML+=html;

});

}

function saveAnswer(q,o){

userAnswers[q]=o;

}

function submitQuiz(){

let score=0;

questions.forEach((q,i)=>{

const options=document.querySelectorAll(`input[name=q${i}]`);

options.forEach((op,j)=>{

const label=document.getElementById(`q${i}o${j}`);

label.classList.remove("correct","wrong");

if(j===q.answer){

label.classList.add("correct");

}

if(op.checked && j!==q.answer){

label.classList.add("wrong");

}

});

document.getElementById(`exp${i}`).style.display="block";

if(userAnswers[i]===q.answer){

score++;

}

});

document.getElementById("result").style.display="block";

document.getElementById("score").innerHTML=`Score: ${score} / ${questions.length}`;

window.scrollTo(0,document.body.scrollHeight);

}

setInterval(()=>{

if(time>0){

time--;

let m=Math.floor(time/60);
let s=time%60;

document.getElementById("timer").innerHTML=
`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

}else{

submitQuiz();

}

},1000);

</script>

</body>
</html>
