<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MPPSC Quiz</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f3f3}
.container{max-width:900px;margin:auto;padding:20px}
.top{
background:#082a73;
color:white;
padding:20px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}
#timer{
background:white;
color:#082a73;
padding:10px 15px;
border-radius:10px;
font-size:24px;
font-weight:bold;
}
.card{
background:white;
margin:20px 0;
padding:20px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.option{
display:block;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
cursor:pointer;
}
.option:hover{background:#eef4ff}
.correct{background:#d4edda!important;border-color:#28a745!important}
.wrong{background:#f8d7da!important;border-color:#dc3545!important}
.exp{
display:none;
margin-top:10px;
padding:10px;
background:#eef4ff;
border-left:5px solid #082a73;
border-radius:8px;
}
button{
background:#082a73;
color:white;
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}
textarea{
width:100%;
padding:10px;
border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
<div>
<h1>MPPSC MCQ Hub</h1>
<p id="testInfo"></p>
<p id="unitInfo"></p>
</div>

<div id="timer">10:00</div>
</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">टेस्ट जमा करें</button>

<div class="card" id="result" style="display:none">
<h2 id="score"></h2>

<h3 style="margin-top:20px;">Student Comment</h3>
<textarea rows="3" placeholder="अपनी राय लिखें..."></textarea>
</div>

</div>

<script>

const params=new URLSearchParams(location.search);
const test=Number(params.get("test"))||1;
const unit=Math.ceil(test/20);

document.getElementById("testInfo").innerHTML="टेस्ट "+test;
document.getElementById("unitInfo").innerHTML="यूनिट "+unit;

let questions=[];
let score=0;
let time=600;

const timer=setInterval(()=>{
time--;
let m=String(Math.floor(time/60)).padStart(2,"0");
let s=String(time%60).padStart(2,"0");
document.getElementById("timer").innerHTML=m+":"+s;

if(time<=0){
clearInterval(timer);
submitQuiz();
}
},1000);

const script=document.createElement("script");
script.src="questions"+unit+".js";

script.onload=function(){

questions=window["questions"+unit];

if(!questions || questions.length===0){
document.getElementById("quiz").innerHTML=
"<div class='card'><h2>यूनिट "+unit+" के प्रश्न नहीं मिले।</h2></div>";
return;
}

showQuestions();

};

script.onerror=function(){

document.getElementById("quiz").innerHTML=
"<div class='card'><h2>questions"+unit+".js लोड नहीं हुई।</h2></div>";

};

document.body.appendChild(script);

function showQuestions(){

let html="";

questions.forEach((q,i)=>{

html+=`

<div class="card">

<h3>प्रश्न ${i+1}: ${q.q}</h3>

${q.o.map((op,j)=>`

<label class="option" id="q${i}o${j}">
<input type="radio" name="q${i}" value="${j}">
<b>${String.fromCharCode(65+j)}.</b> ${op}
</label>

`).join("")}

<div class="exp" id="exp${i}">
<b>व्याख्या:</b> ${q.exp}
</div>

</div>

`;

});

document.getElementById("quiz").innerHTML=html;

}

function submitQuiz(){

clearInterval(timer);

score=0;

questions.forEach((q,i)=>{

const selected=document.querySelector(`input[name=q${i}]:checked`);

q.o.forEach((o,j)=>{

const label=document.getElementById(`q${i}o${j}`);

label.classList.remove("correct","wrong");

if(j===q.a){

label.classList.add("correct");

}

});

if(selected){

if(Number(selected.value)===q.a){

score++;

}else{

document.getElementById(`q${i}o${selected.value}`).classList.add("wrong");

}

}

document.getElementById(`exp${i}`).style.display="block";

});

document.getElementById("result").style.display="block";

document.getElementById("score").innerHTML="आपका स्कोर: "+score+"/"+questions.length;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

</script>

</body>
</html>
