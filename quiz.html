<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MPPSC MCQ Hub Quiz</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#e8eef8;
}

header{
background:#123c8c;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
margin:0;
font-size:25px;
}

#timer{
font-size:22px;
font-weight:bold;
}

.container{
max-width:900px;
margin:20px auto;
padding:15px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px #aaa;
margin-bottom:20px;
}

.question{
font-size:18px;
font-weight:bold;
margin-bottom:15px;
}

.option{
display:block;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin:8px 0;
cursor:pointer;
background:#fff;
}

.option:hover{
background:#f1f1f1;
}

.correct{
background:#b7f7b7!important;
border-color:green;
}

.wrong{
background:#ffb3b3!important;
border-color:red;
}

.explanation{
display:none;
margin-top:10px;
padding:10px;
background:#eef6ff;
border-left:5px solid #1d5fd1;
border-radius:8px;
}

button{
background:#123c8c;
color:white;
border:0;
padding:12px 25px;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

textarea{
width:100%;
height:80px;
padding:10px;
border-radius:8px;
}

</style>

</head>

<body>

<header>

<div>
<h1>MPPSC MCQ Hub</h1>
<div id="title"></div>
</div>

<div id="timer">
10:00
</div>

</header>


<div class="container">

<div id="quiz"></div>


<div class="card">

<button onclick="submitQuiz()" id="submitBtn">
Submit Test
</button>

</div>


<div class="card" id="result" style="display:none">

<h2>Final Result</h2>

<h3 id="score"></h3>

</div>


<div class="card">

<h3>Student Comment</h3>

<textarea placeholder="अपनी राय लिखें..."></textarea>

</div>


</div>



<script src="questionBank.js"></script>


<script>

let url=new URLSearchParams(window.location.search);

let unit="unit"+url.get("unit");

let test="test"+url.get("test");


document.getElementById("title").innerHTML=
"Unit "+url.get("unit")+"<br>Test "+url.get("test");



let questions=[];


if(window.questionBank &&
questionBank[unit] &&
questionBank[unit][test]){

questions=questionBank[unit][test];

}


let quiz=document.getElementById("quiz");


if(questions.length==0){

quiz.innerHTML="<h2>Questions नहीं मिले</h2>";

}

else{


questions.forEach((q,i)=>{


let div=document.createElement("div");

div.className="card";


let html=`

<div class="question">

${i+1}. ${q.question}

</div>

`;


q.options.forEach((op,j)=>{

html+=`

<label class="option" id="q${i}o${j}">

<input type="radio" 
name="q${i}" 
value="${j}"
onclick="checkAnswer(${i},${j})">

${op}

</label>

`;

});


html+=`

<div class="explanation" id="exp${i}">

${q.explanation}

</div>

`;


div.innerHTML=html;

quiz.appendChild(div);


});


}


function checkAnswer(q,o){


let correct=questions[q].answer;


let options=document.querySelectorAll(
`input[name="q${q}"]`
);


options.forEach((x,index)=>{


let label=document.getElementById(`q${q}o${index}`);


label.classList.remove("correct","wrong");


if(index==correct){

label.classList.add("correct");

}


});


if(o!=correct){

document
.getElementById(`q${q}o${o}`)
.classList.add("wrong");

}


document.getElementById("exp"+q)
.style.display="block";


}



function submitQuiz(){


let score=0;


questions.forEach((q,i)=>{

let ans=document.querySelector(
`input[name="q${i}"]:checked`
);


if(ans && Number(ans.value)==q.answer){

score++;

}


});


document.getElementById("result").style.display="block";


document.getElementById("score").innerHTML=

"आपका Score : "+score+" / "+questions.length;


window.scrollTo(0,document.body.scrollHeight);


}



</script>

</body>
</html>
