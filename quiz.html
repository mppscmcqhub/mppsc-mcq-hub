<script src="questions.js"></script>

<script>
const quiz = document.getElementById("quiz");

// Questions दिखाना
questions.forEach((q, i) => {
  const box = document.createElement("div");
  box.className = "qbox";

  box.innerHTML = `
    <h3>प्रश्न ${i + 1}: ${q.q}</h3>
    ${q.o.map((opt, j) => `
      <label class="opt">
        <input type="radio" name="q${i}" value="${j}">
        <span>${opt}</span>
      </label>
    `).join("")}
    <div class="result"></div>
  `;

  quiz.appendChild(box);
});

// Quiz Submit
function submitQuiz() {
  let score = 0;

  document.querySelectorAll(".qbox").forEach((box, i) => {
    const q = questions[i];
    const selected = box.querySelector("input[type=radio]:checked");
    const result = box.querySelector(".result");

    result.className = "result";

    // अगर कुछ भी Select नहीं किया
    if (!selected) {
      result.classList.add("skip");
      result.innerHTML = "⏺ <b>अनुत्तरित / Not Answered</b>";
      return;
    }

    const answer = Number(selected.value);

    if (answer === q.a) {
      score++;
      result.classList.add("correct");
      result.innerHTML = `✅ <b>सही / Correct</b><br>${q.e}`;
    } else {
      result.classList.add("wrong");
      result.innerHTML = `❌ <b>गलत / Wrong</b><br>${q.e}`;
    }

    // दोबारा बदल न सके
    box.querySelectorAll("input").forEach(inp => inp.disabled = true);
  });

  document.getElementById("scoreBox").innerHTML = `
    <h2>🎯 स्कोर / Score: ${score}/${questions.length}</h2>
  `;

  document.getElementById("submitBtn").style.display = "none";
  document.getElementById("restartBtn").style.display = "inline-block";
}

// Restart
document.getElementById("restartBtn").onclick = function () {
  location.reload();
};
</script>
