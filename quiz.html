<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC Quiz</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f3f3}
.container{max-width:900px;margin:auto;padding:20px}
.top{
background:#082a73;color:#fff;padding:20px;border-radius:15px;
display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap
}
#timer{
background:#fff;color:#082a73;padding:10px 15px;border-radius:10px;
font-size:24px;font-weight:bold
}
.card{
background:#fff;margin:20px 0;padding:20px;border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.12)
}
.q{font-size:20px;font-weight:bold;margin-bottom:15px}
label{
display:block;border:1px solid #ddd;border-radius:10px;
padding:12px;margin:10px 0;cursor:pointer
}
label:hover{background:#f7f7f7}
.correct{background:#d4edda;border-color:#28a745}
.wrong{background:#f8d7da;border-color:#dc3545}
.exp{
display:none;margin-top:10px;padding:10px;
background:#eef6ff;border-left:4px solid #0d6efd;border-radius:6px
}
button{
background:#082a73;color:#fff;border:none;padding:12px 25px;
border-radius:10px;font-size:18px;cursor:pointer
}
button:hover{background:#0a3aa0}
#result{display:none}
textarea{
width:100%;padding:12px;border-radius:8px;border:1px solid #bbb
}
</style>
</head>
<body>

<div class="container">

<div class="top">
<div>
<h1>MPPSC MCQ Hub</h1>
<div id="testInfo"></div>
<div id="unitInfo"></div>
</div>
<div id="timer">10:00</div>
</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">टेस्ट जमा करें</button>

<div id="result" class="card">
<h2>आपका स्कोर: <span id="score"></span></h2>

<h3 style="margin-top:20px">Student Comment</h3>
<textarea placeholder="अपनी राय लिखें..."></textarea>
</div>

</div>

<script>
const params=new URLSearchParams(location.search);
const test=Number(params.get("test"))||1;
const unit=Math.ceil(test/20);

document.getElementById("testInfo").innerHTML="टेस्ट "+test;
document.getElementById("unitInfo").innerHTML="यूनिट "+unit;

let questions=[];

const script=document.createElement("script");
script.src="questions"+unit+".js?v="+Date.now();

script.onload=function(){

questions=window["questions"+unit];

if(!questions && unit===1){
questions=window.questions1;
}

if(!questions||questions.length===0){
document.getElementById("quiz").innerHTML=
'<div class="card"><h2>यूनिट '+unit+' के प्रश्न नहीं मिले।</h2></div>';
return;
}

showQuestions();
};

script.onerror=function(){
document.getElementById("quiz").innerHTML=
'<div class="card"><h2>questions'+unit+'.js लोड नहीं हुई।</h2></div>';
};

document.body.appendChild(script);

function showQuestions(){

let html="";

questions.slice(0,20).forEach((q,i)=>{

html+=`
<div class="card">
<div class="q">प्रश्न ${i+1}: ${q.q}</div>

${q.o.map((opt,j)=>`
<label id="l${i}${j}">
<input type="radio" name="q${i}" value="${j}">
 <b>${String.fromCharCode(65+j)}.</b> ${opt}
</label>
`).join("")}

<div class="exp" id="exp${i}">
<b>व्याख्या:</b> ${q.exp}
</div>
</div>
`;

});

document.getElementById("quiz").innerHTML=html;
}

let time=600;
const timer=setInterval(()=>{
time--;
let m=Math.floor(time/60);
let s=time%60;
document.getElementById("timer").innerHTML=
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
if(time<=0){
clearInterval(timer);
submitQuiz();
}
},1000);

function submitQuiz(){

clearInterval(timer);

let score=0;

questions.slice(0,20).forEach((q,i)=>{

let selected=document.querySelector('input[name="q'+i+'"]:checked');

for(let j=0;j<4;j++){

let label=document.getElementById("l"+i+j);
label.classList.remove("correct","wrong");

if(j===q.a){
label.classList.add("correct");
}

}

if(selected){

if(Number(selected.value)===q.a){
score++;
}else{
document.getElementById("l"+i+selected.value).classList.add("wrong");
}

}

document.getElementById("exp"+i).style.display="block";

});

document.getElementById("result").style.display="block";
document.getElementById("score").innerHTML=score+"/20";

window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
</script>

</body>
</html>
