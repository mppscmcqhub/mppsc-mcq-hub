<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC Unit-10 Test</title>
<link rel="stylesheet" href="style.css">

<style>
.result{
    background:#0b2358;
    border:2px solid #f1c40f;
    border-radius:12px;
    padding:20px;
    text-align:center;
    margin-bottom:20px;
}
.correct{
    background:#1f8b4c !important;
    border:2px solid #2ecc71;
}
.wrong{
    background:#8b1f2d !important;
    border:2px solid #ff4d4d;
}
.explanation{
    background:#102d6c;
    border-left:4px solid #f1c40f;
    padding:12px;
    margin-top:8px;
    border-radius:8px;
}
#restartBtn{
    display:none;
    margin-top:15px;
}
</style>

</head>
<body>

<div class="box">

<h1>MPPSC Unit-10 टेस्ट (20 प्रश्न)</h1>

<div id="scoreBox"></div>

<div id="quiz"></div>

<button id="submitBtn" onclick="submitQuiz()">
टेस्ट जमा करें
</button>

<button id="restartBtn" onclick="location.reload()">
फिर से टेस्ट दें
</button>

</div>

<script src="questions.js"></script>

<script>

const quiz=document.getElementById("quiz");

const student=localStorage.getItem("student") || "Student";

document.getElementById("scoreBox").innerHTML=
`<div class="result">
<h2>${student}</h2>
<p>20 प्रश्न ऑनलाइन टेस्ट</p>
</div>`;

let html="";

questions.forEach((q,i)=>{

html+=`
<div class="box">

<h3>प्रश्न ${i+1}: ${q.q}</h3>
`;

q.o.forEach((opt,j)=>{

html+=`
<label class="opt" id="q${i}o${j}">
<input type="radio" name="q${i}" value="${j}">
<span>${opt}</span>
</label>
`;

});

html+=`
<div class="explanation" id="e${i}" style="display:none;"></div>

</div>
`;

});

quiz.innerHTML=html;

function submitQuiz(){

let score=0;

questions.forEach((q,i)=>{

const selected=document.querySelector(`input[name="q${i}"]:checked`);

const user=selected ? Number(selected.value):-1;

q.o.forEach((_,j)=>{

const label=document.getElementById(`q${i}o${j}`);

label.classList.remove("correct","wrong");

if(j===q.a){

label.classList.add("correct");

}

if(j===user && user!==q.a){

label.classList.add("wrong");

}

label.querySelector("input").disabled=true;

});

const exp=document.getElementById(`e${i}`);

exp.style.display="block";

exp.innerHTML=`
<b>✔ सही उत्तर:</b> ${q.o[q.a]}<br>
<b>📖 Explanation:</b> ${q.e}
`;

if(user===q.a){

score++;

}

});

document.getElementById("submitBtn").style.display="none";
document.getElementById("restartBtn").style.display="block";

document.getElementById("scoreBox").innerHTML=
`
<div class="result">

<h2>${student}</h2>

<h2>🎉 स्कोर: ${score}/20</h2>

<p>${score>=15 ? "बहुत बढ़िया!" : score>=10 ? "अच्छा प्रयास!" : "और अभ्यास करें।"}</p>

</div>
`;

window.scrollTo({top:0,behavior:"smooth"});

}

</script>

</body>
</html>
