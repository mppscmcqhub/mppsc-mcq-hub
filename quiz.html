<!DOCTYPE html><html lang='hi'><meta charset='UTF-8'><title>20 प्रश्न टेस्ट</title>
<link rel='stylesheet' href='style.css'><body><div class='box'><h1>20 प्रश्न टेस्ट</h1><div id='quiz'></div>
<button onclick='submitQuiz()'>टेस्ट जमा करें</button><div id='result'></div></div>
<script src='questions.js'></script><script>
const qDiv=document.getElementById('quiz');
questions.forEach((q,i)=>{let h=`<div class="qbox"><h3>प्रश्न ${i+1}: ${q.q}</h3>`;
q.o.forEach((o,j)=>{h+=`<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>${o}</span></label>`});h+="</div>";qDiv.innerHTML+=h;});
function submitQuiz(){let s=0,out="<h2>परिणाम</h2>";questions.forEach((q,i)=>{let c=document.querySelector(`input[name=q${i}]:checked`);let a=c?+c.value:-1;if(a===q.a)s++;out+=`<div class=qbox><b>Q${i+1}:</b> ${q.q}<br>✔ सही उत्तर: ${q.o[q.a]}<br><i>व्याख्या: ${q.e}</i></div>`});result.innerHTML=`<h2>${localStorage.getItem('student')||'Student'} - स्कोर: ${s}/20</h2>`+out;window.scrollTo(0,document.body.scrollHeight);}
</script></body></html>
