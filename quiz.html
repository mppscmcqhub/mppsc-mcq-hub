<script>
const params = new URLSearchParams(window.location.search);
const unit = params.get("unit") || "1";
const test = params.get("test") || "1";

document.getElementById("quizTitle").innerHTML =
`Unit ${unit}<br>Test ${test}`;

let questions = [];
let answers = [];
let submitted = false;
let time = 600;

// questions file load
const script = document.createElement("script");
script.src = `questions${unit}.js?v=${Date.now()}`;

script.onload = () => {

    if (!window.questionBank) {
        document.getElementById("quiz").innerHTML =
        "<h2>Question Bank नहीं मिली</h2>";
        return;
    }

    questions = window.questionBank[`test${test}`] || [];

    if (questions.length === 0) {
        document.getElementById("quiz").innerHTML =
        "<h2>Questions नहीं मिले</h2>";
        return;
    }

    loadQuiz();
};

script.onerror = () => {
    document.getElementById("quiz").innerHTML =
    "<h2>questions"+unit+".js Load नहीं हुई</h2>";
};

document.body.appendChild(script);

function loadQuiz(){

    const quiz = document.getElementById("quiz");
    quiz.innerHTML = "";

    questions.forEach((q,i)=>{

        let html = `
        <div class="card">
        <div class="question">प्रश्न ${i+1}: ${q.question}</div>`;

        q.options.forEach((op,j)=>{

            html += `
            <label class="option" id="q${i}o${j}">
            <input type="radio"
            name="q${i}"
            onchange="answers[${i}]=${j}">
            ${op}
            </label>`;
        });

        html += `
        <div class="explanation" id="exp${i}" style="display:none">
        <b>Explanation:</b><br>${q.explanation}
        </div></div>`;

        quiz.innerHTML += html;
    });

    document.getElementById("submitBtn").style.display="inline-block";
}

function submitQuiz(){

    if(submitted)return;
    submitted=true;

    let score=0;

    questions.forEach((q,i)=>{

        document.querySelectorAll(`input[name=q${i}]`).forEach((r,j)=>{

            const label=document.getElementById(`q${i}o${j}`);

            label.classList.remove("correct","wrong");

            if(j===q.answer)label.classList.add("correct");

            if(r.checked && j!==q.answer)
                label.classList.add("wrong");

        });

        document.getElementById(`exp${i}`).style.display="block";

        if(answers[i]===q.answer)score++;

    });

    document.getElementById("result").style.display="block";
    document.getElementById("score").innerHTML=
    `Score: ${score}/${questions.length}`;
}

// timer
setInterval(()=>{

    if(submitted)return;

    if(time>0){

        time--;

        const m=Math.floor(time/60);
        const s=time%60;

        document.getElementById("timer").innerHTML=
        `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

    }else{

        submitQuiz();

    }

},1000);
</script>
