<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPPSC MCQ Hub Quiz</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#dbe3ef}
header{background:#0d3b8e;color:#fff;padding:15px}
.top{display:flex;justify-content:space-between;align-items:center}
.container{max-width:900px;margin:25px auto;padding:15px}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.question{font-size:18px;font-weight:bold;margin-bottom:15px;line-height:1.5}
.option{display:block;border:1px solid #ccc;border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}
.option:hover{background:#f5f5f5}
.correct{background:#d4edda;border-color:green}
.wrong{background:#f8d7da;border-color:red}
button{background:#0d6efd;color:#fff;border:none;padding:12px 22px;border-radius:8px;cursor:pointer}
button:hover{background:#084fc7}
#timer{font-size:28px;font-weight:bold}
.explanation{margin-top:10px;background:#eef7ff;padding:12px;border-left:5px solid #0d6efd;border-radius:8px}
</style>
</head>

<body>

<header>
<div class="top">
<div>
<h1>MPPSC MCQ Hub</h1>
<div id="quizTitle">Unit 1<br>Test 1</div>
</div>
<div id="timer">10:00</div>
</div>
</header>

<div class="container">

<div id="quiz"></div>

<button id="submitBtn" style="display:none" onclick="submitQuiz()">Submit Test</button>

<div class="card" id="result" style="display:none">
<h2>Final Result</h2>
<h3 id="score"></h3>
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const unit = params.get("unit") || "1";
const test = params.get("test") || "1";

document.getElementById("quizTitle").innerHTML=`Unit ${unit}<br>Test ${test}`;

let questions=[];
let answers=[];
let submitted=false;
let time=600;

const script=document.createElement("script");
script.src=`questions${unit}.js?v=${Date.now()}`;

script.onload=function(){

    if(!window.questionBank){
        document.getElementById("quiz").innerHTML="<h2>Question Bank नहीं मिली</h2>";
        return;
    }

    // ✅ यही Fix है
    questions=window.questionBank?.[`unit${unit}`]?.[`test${test}`]||[];

    if(questions.length===0){
        document.getElementById("quiz").innerHTML="<h2>Questions नहीं मिले</h2>";
        return;
    }

    loadQuiz();
};

script.onerror=function(){
document.getElementById("quiz").innerHTML=`<h2>questions${unit}.js Load नहीं हुई</h2>`;
};

document.body.appendChild(script);

function loadQuiz(){
const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach(function(q,i){

let html=`
<div class="card">
<div class="question">${q.question}</div>`;

q.options.forEach(function(op,j){

html+=`
<label class="option" id="q${i}o${j}">
<input type="radio" name="q${i}" onchange="answers[${i}]=${j}">
${op}
</label>`;
});

html+=`
<div class="explanation" id="exp${i}" style="display:none">
<b>Explanation / व्याख्या:</b><br>
${q.explanation}
</div>
</div>`;

quiz.innerHTML+=html;
});

document.getElementById("submitBtn").style.display="inline-block";
}

function submitQuiz(){

if(submitted)return;
submitted=true;

let score=0;

questions.forEach(function(q,i){

document.querySelectorAll(`input[name=q${i}]`).forEach(function(r,j){

const label=document.getElementById(`q${i}o${j}`);

label.classList.remove("correct","wrong");

if(j===q.answer) label.classList.add("correct");

if(r.checked && j!==q.answer) label.classList.add("wrong");

});

document.getElementById(`exp${i}`).style.display="block";

if(answers[i]===q.answer) score++;

});

document.getElementById("result").style.display="block";
document.getElementById("score").innerHTML=`Score: ${score}/${questions.length}`;

window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

setInterval(function(){

if(submitted)return;

if(time>0){

time--;

const m=Math.floor(time/60);
const s=time%60;

document.getElementById("timer").innerHTML=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

}else{
submitQuiz();
}

},1000);
</script>

</body>
</html>
