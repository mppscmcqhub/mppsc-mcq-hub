<!doctype html><html lang='hi'><meta charset='UTF-8'><title>Quiz</title><link rel='stylesheet' href='style.css'><body><div class='box'><h1 id=t>MPPSC Test</h1><div id=q></div><button id=s onclick='sub()'>टेस्ट जमा करें</button><div id=r></div></div><script>
const no=new URLSearchParams(location.search).get('test')||1;document.getElementById('t').textContent='MPPSC Test '+no;
const sc=document.createElement('script');sc.src='questions'+no+'.js';document.body.appendChild(sc);
sc.onload=()=>{const L=['A','B','C','D'];questions.forEach((x,i)=>{let h=`<div><h3>प्रश्न ${i+1}: ${x.q}</h3>`;x.o.forEach((o,j)=>h+=`<label class=opt id=q${i}o${j}><input type=radio name=q${i} value=${j}> <b>${L[j]}.</b> ${o}</label>`);h+=`<div id=e${i}></div></div>`;q.innerHTML+=h;});};
function sub(){let score=0;questions.forEach((x,i)=>{let c=document.querySelector(`input[name=q${i}]:checked`);let u=c?+c.value:-1;x.o.forEach((_,j)=>{let e=document.getElementById(`q${i}o${j}`);if(j===x.a)e.classList.add('correct');if(j===u&&u!==x.a)e.classList.add('wrong');});if(u===x.a)score++;document.getElementById(`e${i}`).innerHTML='<b>सही उत्तर:</b> '+x.o[x.a]+'<br><b>व्याख्या:</b> '+x.e;});s.style.display='none';r.innerHTML=`<div class=result><h2>${localStorage.getItem('student')||'Student'}</h2><h1>स्कोर: ${score}/20</h1></div>`;}
</script></body></html>
