<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPPSC Mains Premium Course</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #eef4ff; font-family: 'Segoe UI', sans-serif; color: #333; line-height: 1.5; padding: 20px; }
        
        .lock-container { text-align: center; margin: 100px auto; max-width: 400px; background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #eaeaea; }
        .lock-container h2 { color: #2563eb; margin-bottom: 15px; font-weight: bold; }
        .lock-container input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; text-align: center; }
        .lock-container button { background-color: #2563eb; color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        .lock-container button:hover { background-color: #1d4ed8; }
        .error-msg { color: #dc2626; font-weight: bold; margin-top: 10px; display: none; }

        #protected-content { display: none; max-width: 900px; margin: 0 auto; text-align: left; }
        .header-section { text-align: center; margin: 20px auto 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #eaeaea; }
        .header-section h1 { color: #2563eb; font-size: 2rem; font-weight: 900; margin-bottom: 10px; }
        
        .q-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .q-meta { font-size: 0.9rem; font-weight: bold; color: #2563eb; margin-bottom: 8px; background: #eff6ff; display: inline-block; padding: 3px 12px; border-radius: 4px; }
        .q-text { font-size: 1.1rem; font-weight: 600; color: #1e293b; margin-bottom: 15px; line-height: 1.6; }
        
        .btn-download { display: inline-block; background-color: #2563eb; color: white; padding: 8px 20px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; text-decoration: none; }
        .btn-download:hover { background-color: #1d4ed8; }
        .btn-back { display: inline-block; margin-bottom: 20px; color: #2563eb; text-decoration: none; font-weight: bold; font-size: 1rem; }
        .no-data { text-align: center; color: #888; font-style: italic; background: white; padding: 30px; border-radius: 10px; }
    </style>

<style id="site-logo-global-css">
.site-brand-bar{width:100%;background:#0d47a1;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:64px;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;position:relative;z-index:1000;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.site-brand-bar img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff;flex:0 0 auto}
.site-brand-bar .site-brand-title{font-size:1.12rem;font-weight:800;line-height:1.2}
@media(max-width:600px){.site-brand-bar{padding:7px 10px;min-height:58px}.site-brand-bar img{width:42px;height:42px}.site-brand-bar .site-brand-title{font-size:.98rem}}
</style>

</head>
<body>
<div class="site-brand-bar"><img src="MPPSC-MCQ-Hub-Logo.png" alt="MPPSC MCQ Hub Logo"><div class="site-brand-title">MPPSC MCQ Hub</div></div>


    <div id="lock-screen" class="lock-container">
        <h2>🔒 Mains Course Lock</h2>
        <p style="margin-bottom: 15px; color: #666; font-weight: 600;">आगे बढ़ने के लिए मेंस एक्सेस पासवर्ड डालें:</p>
        <input type="password" id="password-input" placeholder="यहाँ पासवर्ड टाइप करें...">
        <button onclick="checkPassword()">पेज अनलॉक करें</button>
        <div id="error" class="error-msg">गलत पासवर्ड! कृपया सही पासवर्ड डालें।</div>
    </div>

    <div id="protected-content">
        <div><a href="index.html" class="btn-back">← मुख्य पेज पर जाएं</a></div>
        <div class="header-section">
            <h1>MPPSC 2027 - Mains Premium Course</h1>
            <p>📚 मुख्य परीक्षा के डेली प्रश्न और मॉडल उत्तर PDF सूची</p>
        </div>
        <div id="mainsQuestionsList"></div>
    </div>

    <script>
        const CORRECT_PASSWORD = "mppscmains";

        function checkPassword() {
            if (document.getElementById("password-input").value === CORRECT_PASSWORD) {
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("protected-content").style.display = "block";
                renderMainsQuestions();
            } else {
                document.getElementById("error").style.display = "block";
                document.getElementById("password-input").value = "";
            }
        }

        document.getElementById("password-input").addEventListener("keyup", function(e) {
            if (e.key === "Enter") checkPassword();
        });

        function renderMainsQuestions() {
            const listContainer = document.getElementById("mainsQuestionsList");
            listContainer.innerHTML = "";
            
            let mainsData = [];
            try {
                let local = localStorage.getItem('mppsc_paid_mains_qs');
                if(local) mainsData = JSON.parse(local);
            } catch(e) {}

            if(mainsData.length === 0) {
                listContainer.innerHTML = '<div class="no-data">डैशबोर्ड से अभी तक मुख्य परीक्षा का कोई पेड प्रश्न लाइव नहीं किया गया है।</div>';
                return;
            }

            mainsData.forEach(function(item) {
                let card = document.createElement('div');
                card.className = 'q-card';
                card.innerHTML = `
                    <div class="q-meta">${item.title}</div>
                    <div class="q-text">${item.question}</div>
                    <a href="${item.pdf}" target="_blank" class="btn-download">📥 Download Model Answer PDF</a>
                `;
                listContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
