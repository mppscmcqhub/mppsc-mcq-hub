<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paid PRELIMS Access</title><style>

*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#edf3ff;color:#111}
a{text-decoration:none;color:inherit}
.top{height:64px;background:#1551a5;color:#fff;display:flex;align-items:center;padding:0 18px}
.topin{width:100%;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#1551a5;font-weight:900}
.title{font-size:18px;font-weight:800}
.login{margin-left:auto;background:#fff;color:#111;padding:7px 15px;border-radius:4px;font-weight:700}
.wrap{padding:25px 10px;max-width:1650px;margin:auto}
.heading{border-left:4px solid #1551a5;padding-left:9px;color:#0d3e85;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border:1px solid #dce3ee;border-radius:9px;min-height:205px;padding:15px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 7px rgba(0,0,0,.05)}
.unitno{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;margin:auto}
.card h3{text-align:center;margin:8px 0;font-size:14px}.card p{text-align:center;font-size:12px;color:#555}
.btn{background:#1551a5;color:#fff;text-align:center;padding:8px 12px;border-radius:20px;font-size:12px;font-weight:800}
.pre{border:1px dashed #ff6b6b;background:#fff8f8}.pre .btn{background:#ef3f3f}
.main{border:1px dashed #7da9e8;background:#f6f9ff}.main .btn{background:#3489cf}
.hero{background:#1551a5;color:#fff;border-radius:10px;padding:22px;margin-bottom:20px}
.testgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.testcard{background:#fff;border:1px solid #dce3ee;border-radius:9px;padding:16px;min-height:145px;display:flex;flex-direction:column;justify-content:space-between}
.badge{display:inline-block;background:#e5efff;color:#1551a5;padding:5px 8px;border-radius:12px;font-weight:800;font-size:11px}
.question{background:#fff;border:1px solid #dce3ee;border-radius:10px;padding:18px;margin:14px 0}
.option{display:block;border:1px solid #ccd6e3;border-radius:8px;padding:10px;margin:7px 0}
.submit{border:0;background:#16a34a;color:#fff;padding:11px 20px;border-radius:8px;font-weight:800;cursor:pointer}
.result{margin-top:18px;background:#ecfdf5;border:1px solid #86efac;border-radius:10px;padding:18px}
.back{display:inline-block;color:#1551a5;font-weight:800;margin-bottom:14px}
@media(max-width:1050px){.grid,.testgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid,.testgrid{grid-template-columns:1fr}.wrap{padding:14px 9px}}

</style></head>
<body><header class="top"><div class="topin"><div class="logo">MP</div><div class="title">Paid PRELIMS Access</div></div></header>
<main class="wrap"><section class="hero"><h1>PRELIMS Paid Course</h1><p>Production में payment gateway verification जोड़ें।</p></section>
<div class="card" style="max-width:600px;margin:auto"><h2>₹29 · Prelims</h2>
<p>Demo/testing के लिए नीचे unlock करें।</p>
<a class="btn" href="#" onclick="localStorage.setItem('mppsc_prelims_paid_access','paid');location.href='prelims.html';return false;">Demo Unlock</a></div></main></body></html>
