<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPPSC MCQ Hub - Secure QR Payment</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7fc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .payment-box { background: white; max-width: 420px; width: 100%; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        .logo-title { color: #082b57; font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .course-details { background: #eaf2fb; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: left; border-left: 5px solid #147dcc; }
        .price { font-size: 24px; font-weight: 900; color: #d32f2f; text-align: right; float: right; margin-top: -5px; }
        .qr-section { background: #fff; border: 2px dashed #ccc; padding: 15px; border-radius: 8px; display: inline-block; margin-bottom: 15px; width: 100%; max-width: 240px; }
        .qr-image { width: 100%; max-width: 200px; height: 200px; object-fit: contain; }
        .upi-apps { font-size: 11px; color: #666; margin-top: 5px; font-weight: bold; }
        .btn-verify { background: #4caf50; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; display: block; }
        .btn-verify:hover { background: #43a047; }
        .status-msg { margin-top: 15px; font-weight: bold; color: #082b57; display: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #147dcc; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 📱 मोबाइल इनपुट बॉक्स स्टाइल */
        .phone-section { margin-bottom: 18px; text-align: left; }
        .phone-section label { font-weight: bold; display: block; margin-bottom: 6px; color: #333; font-size: 14px; }
        .phone-section input { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .phone-section input:focus { border-color: #147dcc; outline: none; }
    </style>
</head>
<body>

<div class="payment-box">
    <div class="logo-title">🔒 Secure UPI Payment Portal</div>
    
    <div class="course-details">
        <span class="price" id="course-price">₹99</span>
        <strong id="course-title">MPPSC Paid Course 2027</strong>
        <p style="margin: 5px 0 0 0; font-size: 13px; color: #555;">अनलॉक प्रकार: डायरेक्ट लाइफटाइम एक्सेस</p>
    </div>

    <!-- 📱 नया जोड़ा गया: मोबाइल नंबर इनपुट सेक्शन -->
    <div class="phone-section">
        <label for="student-phone">अपना मोबाइल नंबर दर्ज करें (इस पर पासवर्ड आएगा):</label>
        <input type="number" id="student-phone" placeholder="10 अंकों का मोबाइल नंबर दर्ज करें" oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10);" required>
    </div>

    <p style="font-size: 14px; margin-bottom: 10px; color:#333;">नीचे दिए गए QR कोड को किसी भी पेमेंट ऐप से स्कैन करें:</p>

    <div class="qr-section">
        <!-- अपनी UPI QR इमेज का नाम यहाँ 'my-qr.jpg' ही रखें -->
        <img src="my-qr.jpg" alt="UPI QR Code" class="qr-image" id="qr-img">
        <div class="upi-apps">BHIM UPI | PhonePe | GPay | Paytm</div>
    </div>

    <p style="font-size: 12px; color: #e53e3e; font-weight: bold; margin: 5px 0;">⚠️ भुगतान करने के बाद नीचे दिए गए बटन पर क्लिक करें।</p>
    
    <button class="btn-verify" onclick="processStudentAccess()">मैंने भुगतान (Payment) कर दिया है</button>

    <div class="status-msg" id="status-box">
        <div class="loader"></div> 
        <span>भुगतान सत्यापित किया जा रहा है... पेज को बंद न करें।</span>
    </div>
</div>

<script>
    // 🎛️ URL से फीस और कोर्स का लाइव मिलान
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');

        if (type === "mains") {
            document.getElementById("course-title").innerText = "MPPSC Paid MAINS Course";
            document.getElementById("course-price").innerText = "₹199";
        } else {
            document.getElementById("course-title").innerText = "MPPSC Paid PRELIMS Course";
            document.getElementById("course-price").innerText = "₹99";
        }
    };

    // 🚀 पेमेंट और SMS क्रेडेंशियल जनरेशन मैकेनिज्म
    function processStudentAccess() {
        const phone = document.getElementById("student-phone").value;
        
        // मोबाइल नंबर वैलिडेशन (10 अंक होना अनिवार्य)
        if (!phone || phone.length !== 10) {
            alert("❌ कृपया एक वैध 10 अंकों का मोबाइल नंबर दर्ज करें!");
            return;
        }

        // स्टेटस लोडर ऑन करें
        document.body.style.cursor = "wait";
        document.getElementById("status-box").style.display = "block";
        
        // 1. रैंडम पासवर्ड जेनरेट करना (जैसे: MPPSC-4729)
        const randomPassword = "MPPSC-" + Math.floor(1000 + Math.random() * 9000);
        
        const urlParams = new URLSearchParams(window.location.search);
        const courseType = urlParams.get('type') || 'prelims';
        const courseName = courseType === 'mains' ? 'Paid MAINS' : 'Paid PRELIMS';

        // 2. Fast2SMS API के ज़रिए छात्र को मोबाइल पर पासवर्ड भेजना
        // ⚠️ नोट: 'YOUR_FAST2SMS_API_KEY' को हटाकर अपनी असली Fast2SMS API Key यहाँ डालें
        const apiKey = "YOUR_FAST2SMS_API_KEY";
        const smsMessage = `आपका MPPSC Hub लॉगिन क्रेडेंशियल तैयार है। User ID: ${phone} | Password: ${randomPassword} । कृपया इस क्रेडेंशियल से student-login.html पर लॉगिन करें।`;
        
        const apiUrl = `https://fast2sms.com{apiKey}&route=q&message=${encodeURIComponent(smsMessage)}&flash=0&numbers=${phone}`;

        fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            // 3. लोकल स्टोरेज डेटाबेस में स्टूडेंट क्रेडेंशियल रजिस्टर करना
            let users = JSON.parse(localStorage.getItem("mppsc_students")) || [];
            
            // अगर पुराना छात्र है तो उसका कोर्स टाइप अपडेट कर देगा, नए छात्र का नया रिकॉर्ड बनाएगा
            let existingUserIndex = users.findIndex(u => u.username === phone);
            if(existingUserIndex !== -1) {
                users[existingUserIndex].password = randomPassword;
                users[existingUserIndex].type = courseType;
            } else {
                users.push({ username: phone, password: randomPassword, type: courseType });
            }
            
            localStorage.setItem("mppsc_students", JSON.stringify(users));

            document.getElementById("status-box").style.display = "none";
            document.body.style.cursor = "default";
            
            alert(`✓ भुगतान सत्यापित हो गया है!\nआपका पासवर्ड आपके मोबाइल नंबर ${phone} पर SMS द्वारा भेज दिया गया है।`);
            // छात्र को सीधे लॉगिन स्क्रीन पर भेजें
            window.location.href = "student-login.html";
        })
        .catch(err => {
            // फॉलबैक सिस्टम (नेटवर्क एरर की स्थिति में भी लोकल डेटा सेव रखेगा)
            let users = JSON.parse(localStorage.getItem("mppsc_students")) || [];
            users.push({ username: phone, password: randomPassword, type: courseType });
            localStorage.setItem("mppsc_students", JSON.stringify(users));
            
            document.getElementById("status-box").style.display = "none";
            document.body.style.cursor = "default";
            
            alert(`पेमेंट प्रोसेस हो गया है! (Fast2SMS API की अनुपलब्धता के कारण स्क्रीन पर पासवर्ड दिखाया जा रहा है)\nआपका अस्थायी पासवर्ड है: ${randomPassword}`);
            window.location.href = "student-login.html";
        });
    }
</script>

</body>
</html>
