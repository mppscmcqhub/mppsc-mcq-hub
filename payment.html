<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPPSC Premium Payment Gateway</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f6f9; text-align: center; padding: 50px 20px; }
        .payment-box { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #ff9800; }
        h2 { color: #e65100; margin-bottom: 10px; }
        p { color: #555; font-size: 16px; line-height: 1.6; }
        .price-tag { font-size: 24px; font-weight: bold; color: #2e7d32; margin: 20px 0; }
        .pay-btn { display: inline-block; background-color: #ff9800; color: white; padding: 14px 35px; text-decoration: none; font-size: 18px; font-weight: bold; border-radius: 6px; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.15); }
        .pay-btn:hover { background-color: #e65100; }
        .back-link { display: inline-block; margin-top: 25px; color: #007bff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="payment-box">
        <h2>⭐ MPPSC Premium Course ⭐</h2>
        <p>संपूर्ण सिलेबस, स्पेशल नोट्स और प्रीमियम मॉक टेस्ट सीरीज का एक्सेस पाने के लिए नीचे दिए गए बटन पर क्लिक करके पेमेंट पूरा करें।</p>
        
        <!-- आप यहाँ अपनी कीमत लिख सकते हैं -->
        <div class="price-tag">₹29 (Pre) / ₹99 (Mains) Only</div>

        <!-- ⚠️ यहाँ नीचे "YOUR_PAYMENT_GATEWAY_LINK" की जगह अपना असली पेमेंट (Razorpay/UPI) लिंक डाल दें -->
        <a href="YOUR_PAYMENT_GATEWAY_LINK" target="_blank" class="pay-btn">
            💳 Proceed to Pay Now
        </a>

        <br>
        <a href="index.html" class="back-link">← वापस होम पेज पर जाएँ</a>
    </div>

</body>
</html>
