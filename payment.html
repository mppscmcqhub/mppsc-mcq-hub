<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Payment</title>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='js/supabase.js'></script></head>
<body style="font-family:Arial;padding:30px"><h2>Submit Payment</h2>
<input id=mobile placeholder='Mobile'><br><br><select id=course><option>PRELIMS</option><option>MAINS</option></select><br><br><input id=utr placeholder='UTR Number'><br><br><button onclick="send()">Send Request</button>
<script>
async function send(){
 const {data}=await sb.auth.getUser();
 await sb.from('payment_requests').insert({user_id:data.user.id,mobile:mobile.value,course:course.value,utr:utr.value});
 alert('Request Sent');
}
</script></body></html>
