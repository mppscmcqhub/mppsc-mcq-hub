<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPPSC Prelims 100 Test Series</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #eef4ff; font-family: 'Segoe UI', sans-serif; color: #333; line-height: 1.5; padding: 20px; }
        
        .header-section { text-align: center; margin: 20px auto 40px auto; max-width: 800px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #eaeaea; }
        .header-section h1 { color: #b91c1c; font-size: 2rem; font-weight: 900; margin-bottom: 10px; }
        .header-section p { color: #555; font-size: 1.1rem; font-weight: 600; }
        
        .tests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto 50px auto; }
        
        .test-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); text-align: center; border: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: space-between; height: 150px; transition: transform 0.2s; }
        .test-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
        
        .test-number { font-size: 1.2rem; font-weight: 800; color: #1e293b; margin-bottom: 5px; }
        .test-status { font-size: 0.9rem; color: #059669; font-weight: bold; margin-bottom: 15px; background: #ecfdf5; display: inline-block; padding: 2px 10px; border-radius: 12px; }
        
        .btn-download { background-color: #0d47a1; color: white; padding: 8px 0; width: 100%; border-radius: 6px; font-weight: 600; font-size: 0.9rem; text-decoration: none; display: block; border: none; cursor: pointer; transition: background 0.2s; }
        .btn-download:hover { background-color: #0a3980; }
        
        .btn-back { display: inline-block; margin-bottom: 20px; color: #0d47a1; text-decoration: none; font-weight: bold; font-size: 1rem; }
    </style>
</head>
<body>

    <div style="max-width: 1200px; margin: 0 auto;">
        <a href="index.html" class="btn-back">← मुख्य पेज पर जाएं</a>
    </div>

    <div class="header-section">
        <h1>MPPSC 2027 - Prelims Premium Test Series</h1>
        <p>🎯 कुल 100 मॉक टेस्ट पेपर्स की पूरी सूची</p>
    </div>

    <div class="tests-grid">
        <!-- यहाँ 1 से लेकर 100 तक के सभी टेस्ट ऑटोमैटिक जनरेट हो रहे हैं -->
        <script>
            for (let i = 1; i <= 100; i++) {
                let testNo = i < 10 ? '0' + i : i;
                document.write(`
                    <div class="test-card">
                        <div>
                            <div class="test-number">Mock Test - ${testNo}</div>
                            <div class="test-status">● Live Now</div>
                        </div>
                        <div>
                            <!-- अपनी PDF या ZIP का सही नाम यहाँ लिंक होगा (जैसे test1.pdf, test2.pdf) -->
                            <a href="test${i}.pdf" class="btn-download" download>Download PDF</a>
                        </div>
                    </div>
                `);
            }
        </script>
    </div>

</body>
</html>
